workflows:
  glotalk-v3-android-debug:
    name: GloTalk V3 Android Debug
    max_build_duration: 60

    environment:
      flutter: stable
      java: 17

    cache:
      cache_paths:
        - ~/.gradle/caches
        - ~/.gradle/wrapper
        - ~/.pub-cache

    scripts:
      - name: 创建 Flutter 项目骨架
        script: |
          set -e
          cd "$CM_BUILD_DIR"
          flutter create --org tech.glotalk --project-name glotalk GloTalk-V3-scaffold
          cp -r GloTalk-V3-scaffold/android "$CM_BUILD_DIR/GloTalk-V3/android"
          cp -r GloTalk-V3-scaffold/lib "$CM_BUILD_DIR/GloTalk-V3/lib"
          echo "✅ Flutter 项目骨架已生成"

      - name: 整理 Flutter 目录结构
        script: |
          set -e
          PROJECT="$CM_BUILD_DIR/GloTalk-V3"
          mkdir -p "$PROJECT/lib/screens"
          mkdir -p "$PROJECT/lib/services"
          mkdir -p "$PROJECT/android/app"

          [ -f "$PROJECT/main.dart" ] && mv "$PROJECT/main.dart" "$PROJECT/lib/main.dart" && echo "✅ main.dart"
          [ -f "$PROJECT/verify_screen.dart" ] && mv "$PROJECT/verify_screen.dart" "$PROJECT/lib/screens/verify_screen.dart" && echo "✅ verify_screen.dart"

          for svc in stt_service.dart translator_service.dart tts_service.dart; do
            [ -f "$PROJECT/$svc" ] && mv "$PROJECT/$svc" "$PROJECT/lib/services/$svc" && echo "✅ $svc"
          done

          [ -f "$PROJECT/proguard-rules.pro" ] && mv "$PROJECT/proguard-rules.pro" "$PROJECT/android/app/proguard-rules.pro" && echo "✅ proguard-rules.pro"

          find "$PROJECT/lib" -type f | sort

      - name: 修复 AGP Gradle 及 so 冲突
        script: |
          set -e
          PROJECT="$CM_BUILD_DIR/GloTalk-V3"

          # Gradle wrapper → 9.1.0
          mkdir -p "$PROJECT/android/gradle/wrapper"
          cat > "$PROJECT/android/gradle/wrapper/gradle-wrapper.properties" << 'EOF'
          distributionBase=GRADLE_USER_HOME
          distributionPath=wrapper/dists
          zipStoreBase=GRADLE_USER_HOME
          zipStorePath=wrapper/dists
          distributionUrl=https\://services.gradle.org/distributions/gradle-9.1.0-bin.zip
          EOF

          # 在 app/build.gradle.kts 末尾追加 packagingOptions
          # 解决 sherpa_onnx 与 flutter_onnxruntime 同时携带 libonnxruntime.so 的冲突
          APP_GRADLE="$PROJECT/android/app/build.gradle.kts"
          if [ -f "$APP_GRADLE" ]; then
            cat >> "$APP_GRADLE" << 'EOF'

          android {
              packaging {
                  jniLibs {
                      pickFirsts += setOf("lib/arm64-v8a/libonnxruntime.so", "lib/armeabi-v7a/libonnxruntime.so", "lib/x86_64/libonnxruntime.so", "lib/x86/libonnxruntime.so")
                  }
              }
          }
          EOF
            echo "✅ packagingOptions 已追加"
          else
            echo "⚠️ app/build.gradle.kts 不存在"
          fi

          echo "✅ 修复完成"

      - name: 安装 Flutter 依赖
        script: |
          set -e
          cd "$CM_BUILD_DIR/GloTalk-V3"
          flutter pub get

      - name: 编译 Android Debug APK
        script: |
          set -e
          cd "$CM_BUILD_DIR/GloTalk-V3"
          flutter build apk --debug --verbose

    artifacts:
      - GloTalk-V3/build/**/outputs/apk/**/*.apk
      - GloTalk-V3/build/**/outputs/apk/**/output-metadata.json

    publishing:
      email:
        recipients:
          - michaelbmt86@gmail.com
        notify:
          success: true
          failure: true
