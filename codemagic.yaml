workflows:
  glotalk-v3-cross-android-debug:
    name: GloTalk V3 Cross Android Debug
    max_build_duration: 60

    environment:
      flutter: stable
      java: 17

    cache:
      cache_paths:
        - ~/.gradle/caches
        - ~/.gradle/wrapper
        - ~/.pub-cache

    scripts:
      - name: 修复 Gradle 版本
        script: |
          set -e
          PROJECT="$CM_BUILD_DIR/GloTalk-V3-cross"
          sed -i 's/gradle-.*-bin.zip/gradle-9.1.0-bin.zip/' \
            "$PROJECT/android/gradle/wrapper/gradle-wrapper.properties"
          echo "✅ Gradle 9.1.0"

      - name: 修复 so 冲突
        script: |
          set -e
          PROJECT="$CM_BUILD_DIR/GloTalk-V3-cross"
          python3 -c "
          f = '$PROJECT/android/app/build.gradle.kts'
          content = open(f).read()
          patch = '\nandroid {\n    packaging {\n        jniLibs {\n            pickFirsts += setOf(\"lib/arm64-v8a/libonnxruntime.so\", \"lib/armeabi-v7a/libonnxruntime.so\", \"lib/x86_64/libonnxruntime.so\", \"lib/x86/libonnxruntime.so\")\n        }\n    }\n}\n'
          open(f, 'w').write(content + patch)
          print('so 冲突修复完成')
          "

      - name: 安装 Flutter 依赖
        script: |
          set -e
          cd "$CM_BUILD_DIR/GloTalk-V3-cross"
          flutter clean
          flutter pub get

      - name: 编译 Android Debug APK
        script: |
          set -e
          cd "$CM_BUILD_DIR/GloTalk-V3-cross"
          flutter build apk --debug --verbose

    artifacts:
      - GloTalk-V3-cross/build/**/outputs/apk/**/*.apk

    publishing:
      email:
        recipients:
          - michaelbmt86@gmail.com
        notify:
          success: true
          failure: true
