workflows:
  glotalk-v3-cross-android-debug:
    name: GloTalk V3 Cross Android Debug
    max_build_duration: 60

    environment:
      flutter: stable
      java: 17

    cache:
      cache_paths:
        - ~/.gradle/caches
        - ~/.gradle/wrapper
        - ~/.pub-cache

    scripts:
      - name: 修复 Gradle 版本
        script: |
          set -e
          PROPS="$CM_BUILD_DIR/GloTalk-V3-cross/android/gradle/wrapper/gradle-wrapper.properties"
          printf 'distributionBase=GRADLE_USER_HOME\ndistributionPath=wrapper/dists\nzipStoreBase=GRADLE_USER_HOME\nzipStorePath=wrapper/dists\ndistributionUrl=https\://services.gradle.org/distributions/gradle-9.1.0-bin.zip\n' > "$PROPS"
          echo "✅ Gradle 9.1.0 设置完成"
          cat "$PROPS"

      - name: 修复 so 冲突
        script: |
          set -e
          python3 << 'PYEOF'
          import os
          f = os.environ['CM_BUILD_DIR'] + '/GloTalk-V3-cross/android/app/build.gradle.kts'
          content = open(f).read()
          patch = """
android {
    packaging {
        jniLibs {
            pickFirsts += setOf(
                "lib/arm64-v8a/libonnxruntime.so",
                "lib/armeabi-v7a/libonnxruntime.so",
                "lib/x86_64/libonnxruntime.so",
                "lib/x86/libonnxruntime.so"
            )
        }
    }
}
"""
          open(f, 'w').write(content + patch)
          print('✅ so 冲突修复完成')
          PYEOF

      - name: 安装 Flutter 依赖
        script: |
          set -e
          cd "$CM_BUILD_DIR/GloTalk-V3-cross"
          flutter clean
          flutter pub get

      - name: 静态分析
        script: |
          set -e
          cd "$CM_BUILD_DIR/GloTalk-V3-cross"
          flutter analyze --no-fatal-infos
          echo "✅ 静态分析通过"

      - name: 编译 Android Debug APK
        script: |
          set -e
          cd "$CM_BUILD_DIR/GloTalk-V3-cross"
          flutter build apk --debug --verbose

    artifacts:
      - GloTalk-V3-cross/build/**/outputs/apk/**/*.apk

    publishing:
      email:
        recipients:
          - michaelbmt86@gmail.com
        notify:
          success: true
          failure: true
