workflows:
  android-workflow:
    name: GloTalk Android Debug
    max_build_duration: 60
    environment:
      flutter: stable
    scripts:
      - name: Get Flutter packages
        script: |
          cd flutter_app
          flutter pub get
      - name: Build Android APK
        script: |
          cd flutter_app
          flutter build apk --debug
    artifacts:
      - flutter_app/build/app/outputs/flutter-apk/app-debug.apk
