workflows:
  glotalk-v3-cross-android-debug:
    name: GloTalk V3 Cross Android Debug
    max_build_duration: 60

    environment:
      flutter: stable
      java: 17

    cache:
      cache_paths:
        - ~/.gradle/caches
        - ~/.gradle/wrapper
        - ~/.pub-cache

    scripts:
      - name: 安装 Flutter 依赖
        script: |
          set -e
          cd "$CM_BUILD_DIR/GloTalk-V3-cross"
          flutter clean
          flutter pub get

      - name: 编译 Android Debug APK
        script: |
          set -e
          cd "$CM_BUILD_DIR/GloTalk-V3-cross"
          flutter build apk --debug --verbose

    artifacts:
      - GloTalk-V3-cross/build/**/outputs/apk/**/*.apk

    publishing:
      email:
        recipients:
          - michaelbmt86@gmail.com
        notify:
          success: true
          failure: true
