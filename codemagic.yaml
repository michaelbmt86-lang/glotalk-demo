# GloTalk V3 — Codemagic CI/CD 配置
# 参考：https://docs.codemagic.io/yaml-basic-configuration/yaml-getting-started/
#       https://docs.codemagic.io/yaml-quick-start/building-a-flutter-app/
# 项目位置：仓库根目录下的 GloTalk-V3/ 子目录
# 编译目标：Android debug APK（Flutter stable）

workflows:
  glotalk-v3-android-debug:
    name: GloTalk V3 Android Debug
    max_build_duration: 60

    environment:
      flutter: stable
      java: 17

    cache:
      cache_paths:
        - ~/.gradle/caches
        - ~/.gradle/wrapper
        - ~/.pub-cache

    scripts:
      - name: 整理 Flutter 目录结构
        script: |
          set -e
          PROJECT="$CM_BUILD_DIR/GloTalk-V3"
          echo "▶ 项目目录: $PROJECT"
          ls -la "$PROJECT/"
          mkdir -p "$PROJECT/lib/screens"
          mkdir -p "$PROJECT/lib/services"
          mkdir -p "$PROJECT/android/app"

          if [ -f "$PROJECT/main.dart" ]; then
            mv "$PROJECT/main.dart" "$PROJECT/lib/main.dart"
            echo "✅ main.dart → lib/main.dart"
          fi

          if [ -f "$PROJECT/verify_screen.dart" ]; then
            mv "$PROJECT/verify_screen.dart" "$PROJECT/lib/screens/verify_screen.dart"
            echo "✅ verify_screen.dart → lib/screens/"
          fi

          for svc in stt_service.dart translator_service.dart tts_service.dart; do
            if [ -f "$PROJECT/$svc" ]; then
              mv "$PROJECT/$svc" "$PROJECT/lib/services/$svc"
              echo "✅ $svc → lib/services/"
            else
              echo "⚠️  $svc 未找到"
            fi
          done

          if [ -f "$PROJECT/proguard-rules.pro" ]; then
            mv "$PROJECT/proguard-rules.pro" "$PROJECT/android/app/proguard-rules.pro"
            echo "✅ proguard-rules.pro → android/app/"
          fi

          echo "▶ 整理后的 lib/ 结构："
          find "$PROJECT/lib" -type f | sort

      - name: 验证项目结构
        script: |
          set -e
          PROJECT="$CM_BUILD_DIR/GloTalk-V3"
          if [ ! -f "$PROJECT/pubspec.yaml" ]; then
            echo "❌ 未找到 pubspec.yaml"
            exit 1
          fi
          echo "✅ pubspec.yaml 存在"
          cat "$PROJECT/pubspec.yaml"

      - name: 安装 Flutter 依赖
        script: |
          set -e
          cd "$CM_BUILD_DIR/GloTalk-V3"
          flutter pub get

      - name: 修复 Gradle Wrapper
        script: |
          set -e
          PROJECT="$CM_BUILD_DIR/GloTalk-V3"
          if [ ! -f "$PROJECT/android/gradlew" ]; then
            echo "⚠️  gradlew 不存在，跳过"
          else
            cd "$PROJECT/android"
            chmod +x gradlew
            mkdir -p gradle/wrapper
            curl -fsSL \
              "https://github.com/gradle/gradle/raw/v8.11.1/gradle/wrapper/gradle-wrapper.jar" \
              -o gradle/wrapper/gradle-wrapper.jar
            ./gradlew wrapper --gradle-version 8.11.1
            echo "✅ Gradle wrapper 修复完成"
          fi

      - name: 编译 Android Debug APK
        script: |
          set -e
          cd "$CM_BUILD_DIR/GloTalk-V3"
          flutter build apk --debug --verbose

    artifacts:
      - GloTalk-V3/build/**/outputs/apk/**/*.apk
      - GloTalk-V3/build/**/outputs/apk/**/output-metadata.json

    publishing:
      email:
        recipients:
          - michaelbmt86@gmail.com
        notify:
          success: true
          failure: true
