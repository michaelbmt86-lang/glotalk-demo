server {
    listen 80;
    server_name glotalk.tech www.glotalk.tech;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name glotalk.tech www.glotalk.tech;

    ssl_certificate /etc/letsencrypt/live/glotalk.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/glotalk.tech/privkey.pem;

    root /var/www/glotalk;
    index index.html;

    location /session {
        proxy_pass http://localhost:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /sdp {
        proxy_pass http://localhost:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /agent/ {
        proxy_pass http://localhost:3000;
    }

    location /invite {
        proxy_pass http://localhost:3000;
    }

    location /admin {
        proxy_pass http://localhost:3000;
    }

    location /billing {
        proxy_pass http://localhost:3000;
    }

    location /alibaba-ws {
        proxy_pass http://localhost:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 3600s;
    }

    location /gemini-ws {
        proxy_pass http://localhost:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 3600s;
    }
    location /gemini-session {
        proxy_pass http://localhost:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
    location /livekit-token {
        proxy_pass http://localhost:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
    location /api/ {
        proxy_pass http://localhost:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
    location /alibaba-token {
        proxy_pass http://localhost:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /token {
        proxy_pass http://localhost:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
    location /health {
        proxy_pass http://localhost:3000;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
