<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: #0a0a0a; color: #e0e0e0; font-family: system-ui, sans-serif; min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 24px 16px; }
h1 { font-size: 1.6rem; font-weight: 700; margin-bottom: 4px; }
.sub { color: #666; font-size: 0.85rem; margin-bottom: 24px; }
.card { background: #141414; border: 1px solid #222; border-radius: 16px; padding: 20px; width: 100%; max-width: 420px; }
.label { font-size: 0.75rem; color: #555; margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.05em; }
.status { display: flex; align-items: center; gap: 8px; margin-bottom: 16px; font-size: 0.85rem; color: #888; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: #333; }
.dot.green { background: #22c55e; }
.dot.yellow { animation: pulse 1s infinite; background: #eab308; }
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.3} }
.row { display: flex; gap: 8px; margin-bottom: 12px; }
input { flex: 1; padding: 10px 12px; border-radius: 10px; border: 1px solid #333; background: #111; color: #e0e0e0; font-size: 0.9rem; }
.btn { width: 100%; padding: 14px; border-radius: 12px; border: none; font-size: 1rem; font-weight: 600; cursor: pointer; margin-bottom: 10px; }
.btn-start { background: #2563eb; color: #fff; }
.btn-stop { background: #dc2626; color: #fff; display: none; }
.box { background: #0f0f0f; border: 1px solid #1e1e1e; border-radius: 10px; padding: 14px; min-height: 60px; margin-bottom: 12px; font-size: 0.95rem; color: #ccc; }
.log { height: 140px; overflow-y: auto; font-size: 0.75rem; font-family: monospace; color: #666; }
.participants { margin-bottom: 12px; }
.participant-tag { display: inline-block; background: #1e3a5f; color: #60a5fa; border-radius: 6px; padding: 2px 8px; font-size: 0.75rem; margin: 2px; }
</style>
</head>

          <option value="nl">🇳🇱 荷兰语</option>
          <option value="pl">🇵🇱 波兰语</option>
          <option value="sv">🇸🇪 瑞典语</option>
          <option value="da">🇩🇰 丹麦语</option>
          <option value="fi">🇫🇮 芬兰语</option>
          <option value="cs">🇨🇿 捷克语</option>
          <option value="ro">🇷🇴 罗马尼亚语</option>

          <option value="zh">🇨🇳 中文</option>

          <option value="ko">🇰🇷 韩语</option>
          <option value="fr">🇫🇷 法语</option>
          <option value="de">🇩🇪 德语</option>
          <option value="es">🇪🇸 西班牙语</option>
          <option value="pt">🇧🇷 葡萄牙语</option>
          <option value="it">🇮🇹 意大利语</option>
          <option value="ru">🇷🇺 俄语</option>
          <option value="ar">🇸🇦 阿拉伯语</option>
          <option value="hi">🇮🇳 印地语</option>
          <option value="id">🇮🇩 印尼语</option>
          <option value="ms">🇲🇾 马来语</option>
          <option value="th">🇹🇭 泰语</option>
          <option value="vi">🇻🇳 越南语</option>
          <option value="nl">🇳🇱 荷兰语</option>
          <option value="pl">🇵🇱 波兰语</option>
          <option value="sv">🇸🇪 瑞典语</option>
          <option value="da">🇩🇰 丹麦语</option>
          <option value="fi">🇫🇮 芬兰语</option>
          <option value="cs">🇨🇿 捷克语</option>
          <option value="ro">🇷🇴 罗马尼亚语</option>
          <option value="hu">🇭🇺 匈牙利语</option>
          <option value="uk">🇺🇦 乌克兰语</option>
          <option value="el">🇬🇷 希腊语</option>
          <option value="tr">🇹🇷 土耳其语</option>
          <option value="bn">🇧🇩 孟加拉语</option>
      </select>
    </div>
  </div>

  <button class="btn btn-start" id="startBtn" onclick="startSession()">加入房间</button>
  <button class="btn btn-stop" id="stopBtn" onclick="stopSession()">离开房间</button>

  <div class="label" style="margin-bottom:6px;">房间参与者</div>
  <div class="participants" id="participants">（加入房间后显示）</div>

  <div class="label" style="margin-bottom:6px;">源语言识别</div>
  <div class="box" id="sourceText">（说话后显示原文）</div>

  <div class="label" style="margin-bottom:6px;">翻译结果</div>
  <div class="box" id="translationText">（翻译结果显示在这里）</div>

  <div class="label" style="margin-bottom:6px;">日志</div>
  <div class="log" id="log"></div>
</div>

<script>
const { Room, RoomEvent, Track } = LivekitClient;
let room = null;
let nextStartTime = 0;
let playbackContext = null;

function log(msg) {
  const el = document.getElementById('log');
  const t = new Date().toLocaleTimeString();
  el.innerHTML += `${t} ${msg}\n`;
  el.scrollTop = el.scrollHeight;
}

function setStatus(type, text) {
  const dot = document.getElementById('dot');
  dot.className = 'dot' + (type ? ' ' + type : '');
  document.getElementById('statusText').textContent = text;
}

function initPlayback() {
  playbackContext = new AudioContext({ sampleRate: 24000 });
  nextStartTime = 0;
}

function playPCMChunk(base64Data) {
  if (!playbackContext) initPlayback();
  const binary = atob(base64Data);
  const bytes = new Uint8Array(binary.length);
  for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
  const int16 = new Int16Array(bytes.buffer);
  const float32 = new Float32Array(int16.length);
  for (let i = 0; i < int16.length; i++) float32[i] = int16[i] / 32768;
  const buffer = playbackContext.createBuffer(1, float32.length, 24000);
  buffer.copyToChannel(float32, 0);
  const source = playbackContext.createBufferSource();
  source.buffer = buffer;
  source.connect(playbackContext.destination);
  const now = playbackContext.currentTime;
  const startAt = Math.max(now, nextStartTime);
  source.start(startAt);
  nextStartTime = startAt + buffer.duration;
}

function updateParticipants() {
  if (!room) return;
  const el = document.getElementById('participants');
  let html = '';
  // 本地
  html += `<span class="participant-tag">🎤 ${room.localParticipant.identity} (我)</span>`;
  // 远端
  room.remoteParticipants.forEach((p) => {
    html += `<span class="participant-tag">👤 ${p.identity}</span>`;
  });
  el.innerHTML = html || '（无其他参与者）';
}

async function startSession() {
  const roomName = document.getElementById('roomName').value;
  const identity = document.getElementById('identity').value;
  const sourceLang = document.getElementById('sourceLang').value;
  const targetLang = document.getElementById('targetLang').value;

  setStatus('yellow', '连接中...');
  log(`加入房间: ${roomName} 身份: ${identity}`);

  // 获取 LiveKit token
  const res = await fetch(`/livekit-token?room=${roomName}&identity=${identity}&lang=${sourceLang}`, {headers: {'x-glotalk-token': 'glotalk2026'}});
  const data = await res.json();
  if (!data.token) { log('❌ 获取 token 失败'); return; }
  log('✅ Token 获取成功');

  room = new Room();

  room.on(RoomEvent.Connected, () => {
    setStatus('green', '已连接');
    log('✅ 已加入 LiveKit 房间');
    updateParticipants();
    document.getElementById('startBtn').style.display = 'none';
    document.getElementById('stopBtn').style.display = 'block';
  });

  room.on(RoomEvent.ParticipantConnected, (p) => {
    log(`👤 参与者加入: ${p.identity}`);
    updateParticipants();
  });

  room.on(RoomEvent.ParticipantDisconnected, (p) => {
    log(`👤 参与者离开: ${p.identity}`);
    updateParticipants();
  });

  room.on(RoomEvent.TrackSubscribed, (track, publication, participant) => {
    log(`🎵 订阅到音轨: ${participant.identity} → ${publication.trackName}`);
    // 只播放对方的翻译音轨（不播放自己的）
    const myBotName = `bot-${identity}-${targetLang}`;
    if (participant.identity.startsWith('bot-') && 
        participant.identity !== myBotName &&
        track.kind === Track.Kind.Audio) {
      log('🔊 开始播放对方翻译音频');
      const mediaStream = new MediaStream([track.mediaStreamTrack]);
      const audio = new Audio();
      audio.srcObject = mediaStream;
      audio.play().catch(e => log('播放错误: ' + e.message));
    }
  });

  room.on(RoomEvent.DataReceived, (data, participant) => {
    try {
      const msg = JSON.parse(new TextDecoder().decode(data));
      if (msg.type === 'transcript') {
        document.getElementById('sourceText').textContent = msg.text;
      } else if (msg.type === 'translation') {
        document.getElementById('translationText').textContent = msg.text;
        log('✅ ' + msg.text.substring(0, 50));
      }
    } catch(e) {}
  });

  room.on(RoomEvent.Disconnected, () => {
    setStatus('', '已断开');
    log('已离开房间');
    document.getElementById('startBtn').style.display = 'block';
    document.getElementById('stopBtn').style.display = 'none';
    updateParticipants();
  });

  await room.connect(data.livekit_url || 'wss://glotalk-nppyx7kk.livekit.cloud', data.token);
  await room.localParticipant.setMicrophoneEnabled(true);
  log('🎤 麦克风已启动');

  // 通知服务器启动 Bot
  try {
    const botRes = await fetch(`/start-bot?room=${roomName}&identity=${identity}&source=${sourceLang}&target=${targetLang}`);
    log('Bot HTTP状态: ' + botRes.status);
    const botData = await botRes.json();
    log(botData.ok ? '🤖 Bot 已启动' : '⚠️ Bot 启动失败: ' + botData.error);
  } catch(e) {
    log('❌ Bot fetch错误: ' + e.message);
  }
}

async function stopSession() {
  if (room) {
    await room.disconnect();
    room = null;
  }
  setStatus('', '未连接');
}
</script>
</body>
</html>
