<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>GloTalk AL Admin</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0a0a0a;color:#f0f0f0;font-family:-apple-system,sans-serif;padding:20px}
h1{color:#f59e0b;font-size:24px;margin-bottom:4px}
.sub{color:#555;font-size:12px;margin-bottom:20px}
h2{color:#888;font-size:13px;margin:8px 0}
.card{background:#111;border:1px solid #222;border-radius:10px;padding:10px 14px;margin-bottom:10px}
input,select{background:#1a1a1a;border:1px solid #333;border-radius:8px;color:#f0f0f0;font:inherit;font-size:14px;padding:8px 12px;outline:none;width:100%}
.row{display:flex;gap:8px;margin-bottom:8px}
.row input,.row select{flex:1}
button{background:#f59e0b;color:#000;border:none;border-radius:8px;padding:10px 20px;font:inherit;font-size:14px;font-weight:700;cursor:pointer;width:100%}
button.sm{width:auto;padding:4px 10px;font-size:12px;background:#333;color:#888}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;color:#555;padding:6px 8px;border-bottom:1px solid #222}
td{padding:8px;border-bottom:1px solid #1a1a1a}
.dim td{color:#444}
#msg{padding:10px;border-radius:8px;background:#1a1200;color:#f59e0b;display:none;margin-top:8px}
#msg.err{background:#1a0f0f;color:#ef4444}
#agentMsg{display:none;padding:8px;margin-top:8px;border-radius:6px;font-size:13px}
.code-box{background:#111;border:1px solid #333;border-radius:6px;padding:6px 8px;font-size:12px;color:#f59e0b;cursor:pointer;word-break:break-all;margin-top:6px}
</style>
</head>
<body>
<h1>GloTalk AL Admin</h1>
<p class="sub">alibaba-v1 · qwen3.5-livetranslate · 独立数据</p>

<div class="card">
  <h2>👥 代理管理</h2>
  <div class="row">
    <input id="agentName" placeholder="代理姓名"/>
    <input id="agentBudget" placeholder="月度额度（人民币）" type="number" value="200"/>
  </div>
  <button onclick="createAgent()">创建代理账号</button>
  <div id="agentMsg"></div>
  <br/>
  <table id="agentTable">
    <tr><th>代理ID</th><th>姓名</th><th>状态</th><th>月额度</th><th>创建日期</th><th>操作</th></tr>
  </table>
</div>

<div class="card">
  <h2>🎫 生成邀请码</h2>
  <div class="row">
    <input id="inviteName" placeholder="被邀请人姓名"/>
    <select id="inviteDuration">
      <option value="30">30分钟</option>
      <option value="60">60分钟</option><option value="1440" selected>24小时</option>
      <option value="120">2小时</option>
      <option value="480">8小时</option>
      <option value="1440">24小时</option>
    </select>
  </div>
  <button id="createInviteBtn" onclick="createInvite()">生成邀请码</button>
  <div id="msg"></div>
</div>

<div class="card">
  <h2>📋 邀请码列表</h2>
  <table id="inviteTable">
    <tr><th>邀请码</th><th>备注</th><th>状态</th><th>剩余</th><th>使用时间</th><th>有效期</th><th>操作</th></tr>
  </table>
</div>

<script>
const ADMIN = new URLSearchParams(location.search).get('admin') || '';
const BASE_URL = 'https://glotalk.tech/glotalk-al.html';

function showMsg(t, e) {
  const m = document.getElementById('msg');
  m.textContent = t; m.style.display = 'block';
  m.className = e ? 'err' : '';
  setTimeout(() => m.style.display = 'none', 5000);
}

function copyText(txt, el) {
  navigator.clipboard.writeText(txt).then(() => { if(el) el.textContent = '✅ 已复制'; });
}

async function loadData() {
  try {
    const r = await fetch('/admin-al/data?admin=' + ADMIN);
    const d = await r.json();
    if (d.error) { document.body.innerHTML = '<p style="color:#ef4444;padding:20px">❌ ' + d.error + '</p>'; return; }

    // 渲染代理列表
    const at = document.getElementById('agentTable');
    const agents = d.agents || {};
    const aRows = Object.entries(agents).map(([id, ag]) =>
      '<tr class="' + (!ag.active ? 'dim' : '') + '">' +
      '<td><b>' + id + '</b></td>' +
      '<td>' + ag.name + '</td>' +
      '<td>' + (ag.active ? '🟢 活跃' : '🔴 停用') + '</td>' +
      '<td>¥' + ag.monthlyBudgetRMB + '</td>' +
      '<td>' + (ag.createdAt ? new Date(ag.createdAt).toLocaleDateString() : '-') + '</td>' +
      '<td><button class="sm" onclick="toggleAgent(\'' + id + '\',\'' + (ag.active ? 'disable' : 'enable') + '\')">' + (ag.active ? '停用' : '启用') + '</button></td>' +
      '</tr>'
    ).join('');
    at.innerHTML = '<tr><th>代理ID</th><th>姓名</th><th>状态</th><th>月额度</th><th>创建日期</th><th>操作</th></tr>' +
      (aRows || '<tr><td colspan="6" style="color:#333;text-align:center;padding:16px">暂无代理</td></tr>');

    // 渲染邀请码列表
    const it = document.getElementById('inviteTable');
    const invites = d.invites || {};
    const now = Date.now();
    const iRows = Object.entries(invites).reverse().map(([code, inv]) => {
      const expired = now > inv.expiresAt;
      const used = inv.used;
      const remaining = expired ? 0 : Math.max(0, Math.floor((inv.expiresAt - now) / 60000));
      return '<tr class="' + (expired||used ? 'dim' : '') + '">' +
        '<td><b>' + code + '</b></td>' +
        '<td>' + (inv.name||'-') + '</td>' +
        '<td>' + (used ? '✅已使用' : expired ? '⏰已过期' : '🟢可用') + '</td>' +
        '<td>' + (expired||used ? '-' : remaining + '分钟') + '</td>' +
        '<td>' + (inv.usedAt ? new Date(inv.usedAt).toLocaleString() : '-') + '</td>' +
        '<td>' + (inv.duration||60) + '分钟</td>' +
        '<td><button class="sm" onclick="revoke(\'' + code + '\')">吊销</button></td>' +
        '</tr>';
    }).join('');
    it.innerHTML = '<tr><th>邀请码</th><th>备注</th><th>状态</th><th>剩余</th><th>使用时间</th><th>有效期</th><th>操作</th></tr>' +
      (iRows || '<tr><td colspan="7" style="color:#333;text-align:center;padding:20px">暂无邀请码</td></tr>');
  } catch(e) {
    console.error(e);
  }
}

async function createInvite() {
  const btn = document.getElementById('createInviteBtn');
  if (btn.disabled) return;
  btn.disabled = true; btn.textContent = '生成中...';
  const name = document.getElementById('inviteName').value.trim() || '测试用户';
  const duration = parseInt(document.getElementById('inviteDuration').value);
  try {
    const r = await fetch('/admin-al/invite?admin=' + ADMIN, {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({name, duration})
    });
    const d = await r.json();
    if (d.code) {
      const m = document.getElementById('msg');
      m.innerHTML = '<div style="color:#f59e0b;font-weight:700;margin-bottom:6px">✅ ' + d.code + ' <span style="color:#666;font-size:12px">有效' + duration + '分钟</span></div>' +
        '<div style="color:#888;font-size:12px;margin-bottom:4px">邀请人打开此链接输入邀请码：</div>' +
        '<div class="code-box" onclick="copyText(\'' + BASE_URL + '\', this)">' + BASE_URL + '<br><small style="color:#888">点击复制链接</small></div>';
      m.style.display = 'block'; m.className = '';
      btn.textContent = '再生成一个'; btn.disabled = false;
      loadData();
    } else {
      showMsg('❌ ' + (d.error || '生成失败'), true);
      btn.textContent = '生成邀请码'; btn.disabled = false;
    }
  } catch(e) {
    showMsg('❌ 网络错误', true);
    btn.textContent = '生成邀请码'; btn.disabled = false;
  }
}

async function createAgent() {
  const name = document.getElementById('agentName').value.trim();
  const budget = parseFloat(document.getElementById('agentBudget').value) || 200;
  if (!name) { alert('请输入代理姓名'); return; }
  const r = await fetch('/admin-al/agent/create?admin=' + ADMIN, {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({name, monthlyBudgetRMB: budget})
  });
  const d = await r.json();
  const msg = document.getElementById('agentMsg');
  if (d.agentId) {
    const link = 'https://glotalk.tech/agent-al.html?id=' + d.agentId;
    msg.style.cssText = 'display:block;background:#1a1200;color:#f59e0b;padding:8px;border-radius:6px;font-size:13px';
    msg.innerHTML = '✅ 代理已创建：' + d.agentId + ' (' + name + ') 月额度¥' + budget +
      '<div class="code-box" onclick="copyText(\'' + link + '\', this)" style="color:#f59e0b">' + link + '<br><small style="color:#888">点击复制</small></div>';
    loadData();
  } else {
    msg.style.cssText = 'display:block;background:#1a0f0f;color:#ef4444;padding:8px;border-radius:6px;font-size:13px';
    msg.textContent = '❌ ' + (d.error || '创建失败');
  }
}

async function toggleAgent(id, action) {
  const r = await fetch('/admin-al/agent/toggle?admin=' + ADMIN, {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({agentId: id, action})
  });
  const d = await r.json();
  if (d.ok) loadData(); else alert('失败: ' + d.error);
}

async function revoke(code) {
  if (!confirm('确定吊销 ' + code + '？')) return;
  const r = await fetch('/admin-al/invite/revoke?admin=' + ADMIN, {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({code})
  });
  const d = await r.json();
  if (d.ok) { showMsg('✅ 已吊销 ' + code); loadData(); }
  else showMsg('❌ ' + d.error, true);
}

loadData();
</script>
</body>
</html>
