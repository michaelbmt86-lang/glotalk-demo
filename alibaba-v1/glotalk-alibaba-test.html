<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GloTalk Alibaba Test</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: #0f0f0f; color: #f0f0f0; font-family: -apple-system, sans-serif; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; }
h1 { font-size: 1.4rem; font-weight: 600; color: #fff; margin-bottom: 6px; }
.sub { font-size: 0.75rem; color: #666; margin-bottom: 32px; }
.card { background: #1a1a1a; border: 1px solid #2a2a2a; border-radius: 16px; padding: 28px; width: 100%; max-width: 480px; }
.status { display: flex; align-items: center; gap: 8px; font-size: 0.8rem; color: #888; margin-bottom: 24px; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: #444; transition: background 0.3s; }
.dot.connected { background: #22c55e; box-shadow: 0 0 8px #22c55e; }
.dot.listening { background: #f59e0b; box-shadow: 0 0 8px #f59e0b; animation: pulse 1s infinite; }
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }
.btn { width: 100%; padding: 14px; border-radius: 12px; border: none; font-size: 1rem; font-weight: 600; cursor: pointer; transition: all 0.2s; }
.btn-start { background: #2563eb; color: #fff; }
.btn-start:hover { background: #1d4ed8; }
.btn-stop { background: #dc2626; color: #fff; }
.label { font-size: 0.7rem; color: #555; text-transform: uppercase; letter-spacing: 0.1em; margin-bottom: 8px; margin-top: 16px; }
.text-box { background: #111; border: 1px solid #222; border-radius: 10px; padding: 14px; font-size: 0.95rem; line-height: 1.6; color: #e0e0e0; min-height: 60px; white-space: pre-wrap; }
.source-box { background: #111; border: 1px solid #222; border-radius: 10px; padding: 14px; font-size: 0.85rem; line-height: 1.6; color: #888; min-height: 40px; white-space: pre-wrap; }
.log { margin-top: 16px; font-size: 0.72rem; color: #555; font-family: monospace; max-height: 100px; overflow-y: auto; }
</style>
</head>
<body>
<h1>GloTalk · Alibaba Test</h1>
<p class="sub">qwen3-livetranslate-flash-realtime · 中文 → 英文</p>
<div class="card">
  <div class="status"><div class="dot" id="dot"></div><span id="statusText">未连接</span></div>
  <button class="btn btn-start" id="startBtn" onclick="startTranslation()">开始翻译</button>
  <button class="btn btn-stop" id="stopBtn" onclick="stopTranslation()" style="display:none;margin-top:10px">停止</button>
  <div class="label">源语言识别</div>
  <div class="source-box" id="sourceText">（说话后显示原文）</div>
  <div class="label">英文翻译</div>
  <div class="text-box" id="translationText">（翻译结果显示在这里）</div>
  <div class="log" id="log"></div>
</div>
<script>
const WS_URL = 'wss://glotalk.tech/alibaba-ws';
let ws = null, audioContext = null, mediaStream = null, processor = null;
let playbackContext = null, nextStartTime = 0;

function initPlayback() {
  playbackContext = new AudioContext({ sampleRate: 24000 });
  nextStartTime = 0;
}

function playPCMChunk(base64Data) {
  if (!playbackContext) initPlayback();
  const binary = atob(base64Data);
  const bytes = new Uint8Array(binary.length);
  for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
  const int16 = new Int16Array(bytes.buffer);
  const float32 = new Float32Array(int16.length);
  for (let i = 0; i < int16.length; i++) float32[i] = int16[i] / 32768;
  const buffer = playbackContext.createBuffer(1, float32.length, 24000);
  buffer.copyToChannel(float32, 0);
  const source = playbackContext.createBufferSource();
  source.buffer = buffer;
  source.connect(playbackContext.destination);
  const now = playbackContext.currentTime;
  const startAt = Math.max(now, nextStartTime);
  source.start(startAt);
  nextStartTime = startAt + buffer.duration;
}

function resetPlayback() {
  nextStartTime = 0;
}

function log(msg) {
  const el = document.getElementById('log');
  el.innerHTML += '<div>' + new Date().toLocaleTimeString() + ' ' + msg + '</div>';
  el.scrollTop = el.scrollHeight;
}
function setStatus(state, text) {
  document.getElementById('dot').className = 'dot ' + state;
  document.getElementById('statusText').textContent = text;
}

async function startTranslation() {
  document.getElementById('startBtn').style.display = 'none';
  document.getElementById('stopBtn').style.display = 'block';
  document.getElementById('translationText').textContent = '连接中...';
  log('连接 ' + WS_URL);

  ws = new WebSocket(WS_URL);

  ws.onopen = async () => {
    log('WebSocket 已连接');
    setStatus('connected', '已连接');
    ws.send(JSON.stringify({
      event_id: 'evt_' + Date.now(),
      type: 'session.update',
      session: {
        modalities: ['text', 'audio'],
        voice: 'Tina',
        output_audio_format: 'pcm',
        input_audio_format: 'pcm',
        input_audio_transcription: {
          model: 'qwen3-asr-flash-realtime',
          language: 'zh'
        },
        translation: { language: 'en' }
      }
    }));
    await startMicrophone();
    setStatus('listening', '正在监听...');
    document.getElementById('translationText').textContent = '请说话...';
  };

  ws.onmessage = async (e) => {
    const text = e.data instanceof Blob ? await e.data.text() : e.data;
    const ev = JSON.parse(text);
    if (ev.type === 'conversation.item.input_audio_transcription.text') {
      if (ev.stash) document.getElementById('sourceText').textContent = ev.stash;
    } else if (ev.type === 'conversation.item.input_audio_transcription.completed') {
      if (ev.transcript) document.getElementById('sourceText').textContent = ev.transcript;
    } else if (ev.type === 'response.created') {
      resetPlayback();
    } else if (ev.type === 'response.audio.delta') {
      if (ev.delta) playPCMChunk(ev.delta);
    } else if (ev.type === 'response.audio_transcript.done') {
      if (ev.transcript) { document.getElementById('translationText').textContent = ev.transcript; log('✅ ' + ev.transcript.substring(0,60)); }
    } else if (ev.type === 'response.text.done') {
      if (ev.text) { document.getElementById('translationText').textContent = ev.text; log('✅ ' + ev.text.substring(0,60)); }
    } else if (ev.type === 'response.audio_transcript.done') {
      if (ev.transcript) { document.getElementById('translationText').textContent = ev.transcript; log('✅ ' + ev.transcript.substring(0,60)); }
    } else if (ev.type === 'error') {
      log('❌ ' + JSON.stringify(ev.error));
    } else if (ev.type === 'session.created') {
      log('会话已创建');
    } else if (ev.type === 'session.updated') {
      log('会话已配置');
    }
  };

  ws.onerror = () => { log('连接错误'); setStatus('', '错误'); };
  ws.onclose = (e) => { log('断开: ' + e.code + ' ' + e.reason); setStatus('', '已断开'); };
}

async function startMicrophone() {
  mediaStream = await navigator.mediaDevices.getUserMedia({ audio: { sampleRate: 16000, channelCount: 1 } });
  audioContext = new AudioContext({ sampleRate: 16000 });
  const source = audioContext.createMediaStreamSource(mediaStream);
  processor = audioContext.createScriptProcessor(4096, 1, 1);
  processor.onaudioprocess = (e) => {
    if (!ws || ws.readyState !== WebSocket.OPEN) return;
    const f32 = e.inputBuffer.getChannelData(0);
    const i16 = new Int16Array(f32.length);
    for (let i = 0; i < f32.length; i++) i16[i] = Math.max(-32768, Math.min(32767, f32[i] * 32768));
    const b64 = btoa(String.fromCharCode(...new Uint8Array(i16.buffer)));
    ws.send(JSON.stringify({ event_id: 'evt_' + Date.now(), type: 'input_audio_buffer.append', audio: b64 }));
  };
  source.connect(processor);
  processor.connect(audioContext.destination);
  log('麦克风已启动');
}

function stopTranslation() {
  if (processor) { processor.disconnect(); processor = null; }
  if (audioContext) { audioContext.close(); audioContext = null; }
  if (mediaStream) { mediaStream.getTracks().forEach(t => t.stop()); mediaStream = null; }
  if (ws) { ws.close(); ws = null; }
  setStatus('', '已停止');
  document.getElementById('startBtn').style.display = 'block';
  document.getElementById('stopBtn').style.display = 'none';
  log('已停止');
}
</script>
</body>
</html>
