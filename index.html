<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>GloTalk 实时翻译</title>
  <style>
    :root {
      color-scheme: light;
      --page: #f3f7f2;
      --panel: #ffffff;
      --ink: #142018;
      --muted: #66726a;
      --line: #d7e1d9;
      --accent: #16843a;
      --accent-hover: #116f30;
      --danger: #d63f31;
      --danger-hover: #b9352a;
      --caption-bg: #fff2a8;
      --caption-line: #e6ce53;
      --shadow: 0 18px 45px rgba(30, 53, 38, 0.14);
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--ink);
      background:
        radial-gradient(circle at 10% 0%, rgba(53, 142, 87, 0.18), transparent 32rem),
        linear-gradient(135deg, #f8fbf6 0%, var(--page) 48%, #edf4f7 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px 18px;
    }

    main {
      width: min(760px, 100%);
      background: var(--panel);
      border: 1px solid rgba(215, 225, 217, 0.9);
      border-radius: 8px;
      box-shadow: var(--shadow);
      padding: clamp(22px, 4vw, 38px);
    }

    header {
      display: grid;
      gap: 8px;
      margin-bottom: 26px;
    }

    h1 {
      margin: 0;
      font-size: clamp(2.1rem, 8vw, 4.5rem);
      line-height: 0.95;
      letter-spacing: 0;
    }

    .subtitle {
      margin: 0;
      color: var(--muted);
      font-size: clamp(1rem, 2.5vw, 1.18rem);
      line-height: 1.55;
    }

    .controls {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 14px;
      align-items: end;
      margin-bottom: 18px;
    }

    label {
      display: grid;
      gap: 8px;
      color: var(--muted);
      font-size: 0.9rem;
      font-weight: 700;
    }

    select {
      width: 100%;
      min-height: 46px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fbfdfb;
      color: var(--ink);
      font: inherit;
      font-weight: 700;
      padding: 0 42px 0 14px;
      outline: none;
    }

    select:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(22, 132, 58, 0.14);
    }

    .caption-box {
      min-height: 260px;
      max-height: 42vh;
      overflow-y: auto;
      border: 1px solid var(--caption-line);
      border-radius: 8px;
      background: var(--caption-bg);
      padding: 20px;
      font-size: clamp(1.2rem, 3vw, 1.65rem);
      line-height: 1.55;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .caption-box:empty::before {
      content: "翻译字幕会显示在这里";
      color: rgba(20, 32, 24, 0.48);
    }

    .actions {
      display: grid;
      gap: 12px;
      margin-top: 18px;
    }

    button {
      width: 100%;
      min-height: 58px;
      border: 0;
      border-radius: 8px;
      background: var(--accent);
      color: #fff;
      font: inherit;
      font-size: 1.1rem;
      font-weight: 800;
      cursor: pointer;
      user-select: none;
      -webkit-user-select: none;
      transition: background-color 160ms ease, transform 160ms ease;
    }

    button:hover {
      background: var(--accent-hover);
    }

    button:active {
      transform: translateY(1px);
    }

    button.stop {
      background: var(--danger);
    }

    button.stop:hover {
      background: var(--danger-hover);
    }

    button:disabled {
      cursor: wait;
      opacity: 0.74;
    }

    .status {
      min-height: 24px;
      color: var(--muted);
      font-weight: 700;
      line-height: 1.5;
    }

    .status.error {
      color: var(--danger);
    }

    footer {
      margin-top: 20px;
      color: var(--muted);
      font-size: 0.86rem;
      line-height: 1.5;
      text-align: center;
    }

    @media (max-width: 560px) {
      body {
        align-items: stretch;
        padding: 14px;
      }

      main {
        min-height: calc(100vh - 28px);
        display: flex;
        flex-direction: column;
      }

      .controls {
        grid-template-columns: 1fr;
      }

      .caption-box {
        flex: 1;
        min-height: 220px;
        max-height: none;
      }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>GloTalk</h1>
      <p class="subtitle">实时语音翻译，把你听到的内容持续转换成目标语言字幕。</p>
    </header>

    <section class="controls" aria-label="翻译设置">
      <label for="output-language">
        输出语言
        <select id="output-language">
          <option value="en" selected>英文</option>
          <option value="ja">日文</option>
          <option value="ko">韩文</option>
          <option value="es">西班牙文</option>
          <option value="fr">法文</option>
          <option value="de">德文</option>
          <option value="it">意大利文</option>
          <option value="pt">葡萄牙文</option>
          <option value="ar">阿拉伯文</option>
          <option value="hi">印地文</option>
        </select>
      </label>
    </section>

    <section id="captions" class="caption-box" aria-live="polite" aria-label="实时翻译字幕"></section>

    <section class="actions">
      <button id="toggle-button" type="button">开始翻译</button>
      <div id="status" class="status" role="status">准备就绪</div>
    </section>

    <footer>需要 HTTPS 才能使用麦克风。</footer>
  </main>

  <audio id="remote-audio" autoplay></audio>

  <script>
    const SESSION_FUNCTION_URL = "https://ryqxhagdbycccosuavtp.supabase.co/functions/v1/create-realtime-session";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJ5cXhoYWdkYnljY2Nvc3VhdnRwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk3MDM5MTgsImV4cCI6MjA5NTI3OTkxOH0.lj3PdKLsTU_cNEHjLNqyHSszJtGSU6gPORE5Y_9WNjQ";
    const OPENAI_REALTIME_TRANSLATIONS_URL = "https://api.openai.com/v1/realtime/translations?model=gpt-realtime-translate";

    const outputLanguageSelect = document.getElementById("output-language");
    const captions = document.getElementById("captions");
    const toggleButton = document.getElementById("toggle-button");
    const statusLine = document.getElementById("status");
    const remoteAudio = document.getElementById("remote-audio");

    let peerConnection = null;
    let dataChannel = null;
    let localStream = null;
    let activeSegment = null;
    let isTranslating = false;

    function setStatus(message, isError = false) {
      statusLine.textContent = message;
      statusLine.classList.toggle("error", isError);
    }

    function setButtonState(translating, busy = false) {
      isTranslating = translating;
      toggleButton.disabled = busy;
      toggleButton.classList.toggle("stop", translating);
      toggleButton.textContent = busy
        ? "正在连接..."
        : translating
          ? "停止翻译"
          : "开始翻译";
      outputLanguageSelect.disabled = translating || busy;
    }

    function scrollCaptionsToBottom() {
      captions.scrollTop = captions.scrollHeight;
    }

    function ensureActiveSegment() {
      if (!activeSegment) {
        activeSegment = document.createElement("span");
        captions.appendChild(activeSegment);
      }
      return activeSegment;
    }

    function appendTranscriptDelta(delta) {
      if (!delta) return;
      const segment = ensureActiveSegment();
      segment.textContent += delta;
      scrollCaptionsToBottom();
    }

    function finishTranscriptSegment(transcript) {
      if (transcript && !activeSegment?.textContent) {
        ensureActiveSegment().textContent = transcript;
      }
      if (activeSegment) {
        captions.appendChild(document.createElement("br"));
        activeSegment = null;
      }
      scrollCaptionsToBottom();
    }

    function handleRealtimeEvent(event) {
      if (!event || !event.type) return;

      if (
        event.type === "session.output_transcript.delta" ||
        event.type === "response.audio_transcript.delta"
      ) {
        appendTranscriptDelta(event.delta ?? event.text ?? "");
        return;
      }

      if (
        event.type === "session.output_transcript.done" ||
        event.type === "response.audio_transcript.done"
      ) {
        finishTranscriptSegment(event.transcript ?? event.text ?? "");
        return;
      }

      if (event.type === "error") {
        setStatus(event.error?.message || "翻译服务返回错误", true);
      }
    }

    async function getClientSecret() {
      console.log("正在调用Supabase获取token...");
      let response;
      try {
        response = await fetch(SESSION_FUNCTION_URL, {
          method: "POST",
          headers: {
            Authorization: `Bearer ${SUPABASE_ANON_KEY}`,
            apikey: SUPABASE_ANON_KEY,
            "Content-Type": "application/json",
          },
          body: JSON.stringify({
            outputLanguage: outputLanguageSelect.value,
          }),
        });
      } catch (fetchError) {
        throw new Error("网络请求失败：" + fetchError.message);
      }

      const text = await response.text();
      console.log("Supabase返回：", response.status, text);

      let data = {};
      try { data = JSON.parse(text); } catch {}

      if (!response.ok) {
        throw new Error(data.error || `获取token失败：${response.status} ${text}`);
      }
      if (!data.client_secret) {
        throw new Error("没有返回client_secret，完整返回：" + text);
      }
      return data.client_secret;
    }

    function waitForIceConnected(connection, timeoutMs = 10000) {
      return new Promise((resolve, reject) => {
        if (connection.iceConnectionState === "connected" || connection.iceConnectionState === "completed") {
          resolve();
          return;
        }

        const timeout = window.setTimeout(() => {
          cleanup();
          reject(new Error("连接超时，请重试"));
        }, timeoutMs);

        function cleanup() {
          window.clearTimeout(timeout);
          connection.removeEventListener("iceconnectionstatechange", handleStateChange);
        }

        function handleStateChange() {
          const state = connection.iceConnectionState;
          if (state === "connected" || state === "completed") {
            cleanup();
            resolve();
          } else if (state === "failed" || state === "disconnected" || state === "closed") {
            cleanup();
            reject(new Error("连接中断，请重新开始"));
          }
        }

        connection.addEventListener("iceconnectionstatechange", handleStateChange);
      });
    }

    async function startTranslation() {
      setButtonState(false, true);
      captions.textContent = "";
      activeSegment = null;
      setStatus("正在请求麦克风权限");

      try {
        if (!navigator.mediaDevices?.getUserMedia) {
          throw new Error("当前浏览器不支持麦克风采集");
        }

        localStream = await navigator.mediaDevices.getUserMedia({
          audio: {
            echoCancellation: true,
            noiseSuppression: true,
            autoGainControl: true,
          },
        });

        setStatus("正在获取短期连接密钥");
        const clientSecret = await getClientSecret();

        setStatus("正在建立实时翻译连接");
        peerConnection = new RTCPeerConnection();
        dataChannel = peerConnection.createDataChannel("oai-events");

        dataChannel.addEventListener("open", () => {
          setStatus("正在持续翻译");
        });

        dataChannel.addEventListener("message", (message) => {
          try {
            handleRealtimeEvent(JSON.parse(message.data));
          } catch {
            setStatus("无法解析翻译事件", true);
          }
        });

        dataChannel.addEventListener("close", () => {
          if (isTranslating) setStatus("实时翻译连接已关闭");
        });

        peerConnection.addEventListener("track", (event) => {
          remoteAudio.srcObject = event.streams[0];
        });

        peerConnection.addEventListener("connectionstatechange", () => {
          const state = peerConnection?.connectionState;
          if (state === "failed" || state === "disconnected") {
            setStatus("连接中断，请重新开始", true);
            stopTranslation();
          }
        });

        localStream.getTracks().forEach((track) => {
          peerConnection.addTrack(track, localStream);
        });

        const offer = await peerConnection.createOffer();
        await peerConnection.setLocalDescription(offer);

        const sdpResponse = await fetch(OPENAI_REALTIME_TRANSLATIONS_URL, {
          method: "POST",
          headers: {
            Authorization: `Bearer ${clientSecret}`,
            "Content-Type": "application/sdp",
          },
          body: offer.sdp,
        });

        const answerSdp = await sdpResponse.text();
        if (!sdpResponse.ok) {
          throw new Error(answerSdp || `OpenAI Realtime 连接失败：${sdpResponse.status}`);
        }

        await peerConnection.setRemoteDescription({
          type: "answer",
          sdp: answerSdp,
        });

        await waitForIceConnected(peerConnection);
        setButtonState(true, false);
      } catch (error) {
        console.error(error);
        stopTranslation({ keepStatus: true });
        setStatus(error instanceof Error ? error.message : String(error), true);
      }
    }

    function stopTranslation(options = {}) {
      if (dataChannel) {
        dataChannel.close();
        dataChannel = null;
      }

      if (peerConnection) {
        peerConnection.getSenders().forEach((sender) => sender.track?.stop());
        peerConnection.close();
        peerConnection = null;
      }

      if (localStream) {
        localStream.getTracks().forEach((track) => track.stop());
        localStream = null;
      }

      remoteAudio.srcObject = null;
      activeSegment = null;
      setButtonState(false, false);

      if (!options.keepStatus) {
        setStatus("已停止翻译");
      }
    }

    toggleButton.addEventListener("click", () => {
      if (isTranslating) {
        stopTranslation();
      } else {
        startTranslation();
      }
    });
  </script>
</body>
</html>
