<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <title>GloTalk Voice Translate Demo</title>
  <style>
    :root {
      --red: #e53935;
      --red-dark: #c62828;
      --yellow: #fff4b8;
      --text: #151515;
      --muted: #6b7280;
      --border: #ebe6c7;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
    }

    html,
    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100dvh;
      background: #fff;
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: max(24px, env(safe-area-inset-top)) 22px max(28px, env(safe-area-inset-bottom));
    }

    .app {
      width: min(100%, 430px);
      min-height: 620px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 22px;
    }

    h1 {
      margin: 0;
      font-size: 42px;
      line-height: 1;
      letter-spacing: 0;
      font-weight: 800;
    }

    .subtitle {
      margin-top: -8px;
      font-size: 14px;
      color: var(--muted);
    }

    .translation-box {
      width: 100%;
      min-height: 130px;
      border: 1px solid var(--border);
      border-radius: 18px;
      background: var(--yellow);
      padding: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      font-size: 21px;
      line-height: 1.35;
      font-weight: 650;
      word-break: break-word;
      white-space: pre-wrap;
    }

    .mic-button {
      width: 138px;
      height: 138px;
      border: 0;
      border-radius: 999px;
      background: var(--red);
      color: #fff;
      display: grid;
      place-items: center;
      box-shadow: 0 18px 40px rgba(229, 57, 53, 0.28);
      touch-action: none;
      cursor: pointer;
      transition: transform 120ms ease, background 120ms ease, box-shadow 120ms ease;
    }

    .mic-button.recording {
      transform: scale(1.06);
      background: var(--red-dark);
      box-shadow: 0 0 0 12px rgba(229, 57, 53, 0.13), 0 20px 45px rgba(198, 40, 40, 0.32);
    }

    .mic-button:disabled {
      cursor: wait;
      background: #9ca3af;
      box-shadow: none;
      transform: none;
    }

    .mic-icon {
      width: 58px;
      height: 58px;
      pointer-events: none;
    }

    .status {
      min-height: 28px;
      font-size: 16px;
      color: var(--muted);
      text-align: center;
      line-height: 1.45;
      padding: 0 8px;
    }

    .status.error {
      color: #b91c1c;
    }

    .settings {
      display: none;
      margin-top: 6px;
      border: 0;
      background: transparent;
      color: #2563eb;
      font-size: 14px;
      padding: 8px 12px;
    }

    .hint {
      color: #9ca3af;
      font-size: 12px;
      text-align: center;
      line-height: 1.4;
      max-width: 330px;
    }
  </style>
</head>
<body>
  <main class="app">
    <h1>GloTalk</h1>
    <div class="subtitle">iPhone Safari 语音翻译 Demo</div>

    <section id="translationBox" class="translation-box">按住红色麦克风，说一句中文</section>

    <button id="micButton" class="mic-button" type="button" aria-label="按住录音">
      <svg class="mic-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <path d="M12 14.5a3.5 3.5 0 0 0 3.5-3.5V6a3.5 3.5 0 0 0-7 0v5a3.5 3.5 0 0 0 3.5 3.5Z" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        <path d="M19 11a7 7 0 0 1-14 0M12 18v3M8.5 21h7" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
      </svg>
    </button>

    <div id="status" class="status">按住开始录音，松开翻译成英文</div>
    <button id="settingsButton" class="settings" type="button">设置 Supabase anon key</button>
    <div class="hint">需要 HTTPS 才能使用麦克风。GitHub Pages 可以，普通本地文件通常不行。</div>
  </main>

  <script>
    const EDGE_FUNCTION_URL = "https://ryqxhagdbycccosuavtp.supabase.co/functions/v1/translate-realtime";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJ5cXhoYWdkYnljY2Nvc3VhdnRwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk3MDM5MTgsImV4cCI6MjA5NTI3OTkxOH0.lj3PdKLsTU_cNEHjLNqyHSszJtGSU6gPORE5Y_9WNjQ";
    const MAX_RECORDING_MS = 12000;

    const micButton = document.getElementById("micButton");
    const statusEl = document.getElementById("status");
    const translationBox = document.getElementById("translationBox");

    let peerConnection = null;
    let dataChannel = null;
    let mediaStream = null;
    let remoteAudio = null;
    let recordingStartedAt = 0;
    let stopTimer = null;
    let busy = false;
    let liveTranscript = "";

    function setStatus(text, isError = false) {
      statusEl.textContent = text;
      statusEl.classList.toggle("error", isError);
    }

    function englishOnly(text) {
      const raw = String(text || "").replace(/\r/g, "\n").trim();
      if (!raw) return "";

      const lines = raw
        .split("\n")
        .map((line) => line.trim())
        .filter(Boolean);

      const englishLines = lines.filter((line) => /[A-Za-z]/.test(line) && !/[\u3400-\u9fff]/.test(line));
      if (englishLines.length > 0) {
        return englishLines.join("\n");
      }
      return raw.replace(/[\u3400-\u9fff]+/g, "").trim() || raw;
    }

    function updateTranscript(text) {
      const cleaned = englishOnly(text);
      if (!cleaned) return;
      translationBox.textContent = cleaned;
    }

    function handleRealtimeEvent(event) {
      if (!event || !event.type) return;

      if (event.type === "error") {
        setStatus(event.error?.message || "Realtime 翻译出错", true);
        return;
      }

      if (
        event.type === "response.audio_transcript.delta" ||
        event.type === "response.output_text.delta" ||
        event.type === "response.text.delta"
      ) {
        liveTranscript += event.delta || "";
        updateTranscript(liveTranscript);
      }

      if (
        event.type === "response.audio_transcript.done" ||
        event.type === "response.output_text.done" ||
        event.type === "response.text.done"
      ) {
        liveTranscript = event.transcript || event.text || liveTranscript;
        updateTranscript(liveTranscript);
        setStatus("英文译音正在播放");
      }

      if (event.type === "response.done") {
        setStatus("按住开始下一次实时翻译");
        setTimeout(cleanupSession, 1500);
      }
    }

    async function unlockRemoteAudio() {
      if (!remoteAudio) {
        remoteAudio = document.createElement("audio");
        remoteAudio.autoplay = true;
        remoteAudio.playsInline = true;
        remoteAudio.style.display = "none";
        document.body.appendChild(remoteAudio);
      }
      try {
        await remoteAudio.play();
      } catch {
        // iPhone Safari may reject until a remote stream is attached. The
        // pointerdown gesture still creates the element inside a user action.
      }
    }

    async function startRealtimeTranslation(event) {
      event.preventDefault();
      if (busy) return;

      if (!window.RTCPeerConnection || !navigator.mediaDevices?.getUserMedia) {
        setStatus("当前 Safari 不支持 WebRTC 实时语音", true);
        return;
      }

      busy = true;
      micButton.disabled = true;
      micButton.classList.add("recording");
      liveTranscript = "";
      translationBox.textContent = "正在连接 GPT-Realtime-Translate...";
      setStatus("正在建立低延迟实时翻译通道");

      try {
        await unlockRemoteAudio();

        mediaStream = await navigator.mediaDevices.getUserMedia({
          audio: {
            echoCancellation: true,
            noiseSuppression: true,
            autoGainControl: true,
          },
        });

        peerConnection = new RTCPeerConnection();

        peerConnection.ontrack = async (trackEvent) => {
          const [stream] = trackEvent.streams;
          if (remoteAudio && stream) {
            remoteAudio.srcObject = stream;
            try {
              await remoteAudio.play();
            } catch (error) {
              setStatus("请再点一次页面以允许播放英文语音", true);
            }
          }
        };

        for (const track of mediaStream.getTracks()) {
          peerConnection.addTrack(track, mediaStream);
        }

        dataChannel = peerConnection.createDataChannel("oai-events");
        dataChannel.onopen = () => {
          setStatus("正在录音，松开后自动输出英文");
          micButton.disabled = false;
          recordingStartedAt = Date.now();
          clearTimeout(stopTimer);
          stopTimer = setTimeout(stopRealtimeTranslation, MAX_RECORDING_MS);
        };
        dataChannel.onmessage = (message) => {
          try {
            handleRealtimeEvent(JSON.parse(message.data));
          } catch {
            // Ignore non-JSON data channel messages.
          }
        };

        const offer = await peerConnection.createOffer({
          offerToReceiveAudio: true,
          offerToReceiveVideo: false,
        });
        await peerConnection.setLocalDescription(offer);

        const response = await fetch(EDGE_FUNCTION_URL, {
          method: "POST",
          headers: {
            "Content-Type": "application/sdp",
            "Authorization": `Bearer ${SUPABASE_ANON_KEY}`,
          },
          body: offer.sdp,
        });

        const answerSdp = await response.text();
        if (!response.ok) {
          let message = answerSdp;
          try {
            message = JSON.parse(answerSdp).error || answerSdp;
          } catch {
            // Keep raw answer text.
          }
          throw new Error(message || `Realtime SDP request failed: ${response.status}`);
        }

        await peerConnection.setRemoteDescription({
          type: "answer",
          sdp: answerSdp,
        });
      } catch (error) {
        cleanupSession();
        setStatus(error.message || String(error), true);
        translationBox.textContent = "按住红色麦克风，说一句中文";
      }
    }

    function stopRealtimeTranslation(event) {
      if (event) event.preventDefault();
      clearTimeout(stopTimer);

      if (!busy) return;

      const durationMs = Date.now() - recordingStartedAt;
      if (durationMs < 350 && recordingStartedAt) {
        setStatus("录音太短，请按住说完整一句话", true);
        cleanupSession();
        return;
      }

      micButton.classList.remove("recording");
      micButton.disabled = true;
      setStatus("正在生成英文翻译...");

      if (mediaStream) {
        for (const track of mediaStream.getAudioTracks()) {
          track.enabled = false;
        }
      }

      setTimeout(() => {
        micButton.disabled = false;
        busy = false;
      }, 2500);
    }

    function cleanupSession() {
      clearTimeout(stopTimer);
      micButton.classList.remove("recording");
      micButton.disabled = false;
      busy = false;

      if (mediaStream) {
        for (const track of mediaStream.getTracks()) {
          track.stop();
        }
      }
      mediaStream = null;

      if (dataChannel) {
        try { dataChannel.close(); } catch { }
      }
      dataChannel = null;

      if (peerConnection) {
        try { peerConnection.close(); } catch { }
      }
      peerConnection = null;
    }

    micButton.addEventListener("pointerdown", startRealtimeTranslation);
    micButton.addEventListener("pointerup", stopRealtimeTranslation);
    micButton.addEventListener("pointercancel", stopRealtimeTranslation);
    micButton.addEventListener("pointerleave", (event) => {
      if (busy) stopRealtimeTranslation(event);
    });

    if (!window.isSecureContext) {
      setStatus("请用 HTTPS 打开本页面，否则 iPhone Safari 不能录音", true);
    }
  </script>
</body>
</html>
