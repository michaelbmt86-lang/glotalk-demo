
<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>GloTalk P2P文字测试</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <style>
    * { box-sizing: border-box; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
    input, textarea { -webkit-user-select: text !important; user-select: text !important; }
    body { margin: 0; min-height: 100vh; background: #0a0a0a; color: #f0f0f0; font-family: -apple-system, sans-serif; display: flex; align-items: center; justify-content: center; padding: 20px; }
    .app { width: min(100%, 420px); display: flex; flex-direction: column; gap: 12px; }
    h2 { color: #22c55e; margin: 0; font-size: 24px; }
    h2 span { color: #fff; }
    .log { background: #111; border: 1px solid #222; border-radius: 12px; padding: 14px; min-height: 220px; max-height: 300px; overflow-y: auto; font-size: 13px; line-height: 1.8; }
    .ok   { color: #22c55e; }
    .err  { color: #ef4444; }
    .info { color: #60a5fa; }
    .msg  { color: #f0f0f0; }
    .them { color: #f59e0b; }
    .status { font-size: 13px; text-align: center; min-height: 18px; color: #555; }
    .status.ok  { color: #22c55e; }
    .status.err { color: #ef4444; }
    input[type=text] { width: 100%; padding: 12px 14px; background: #1a1a1a; border: 1px solid #2a2a2a; border-radius: 10px; color: #f0f0f0; font: inherit; font-size: 15px; outline: none; -webkit-user-select: text; user-select: text; }
    button { width: 100%; height: 52px; border: none; border-radius: 12px; font: inherit; font-size: 16px; font-weight: 800; cursor: pointer; }
    .btn-send { background: #22c55e; color: #000; }
    .btn-send:disabled { background: #1a1a1a; color: #444; cursor: not-allowed; }
    .btn-leave { background: #ef4444; color: #fff; height: 44px; font-size: 14px; }
    .ping { font-size: 12px; color: #555; text-align: center; }
  </style>
</head>
<body>
<div class="app">
  <h2>Glo<span>Talk</span> P2P测试</h2>
  <p style="color:#555;font-size:12px;margin:0">房间固定888888 · 纯P2P文字 · 不调用OpenAI · 完全免费</p>

  <div class="log" id="log"></div>
  <div class="status" id="status">正在连接...</div>
  <div class="ping" id="ping"></div>

  <input type="text" id="msgInput" placeholder="输入消息发给对方..." disabled />
  <button class="btn-send" id="sendBtn" onclick="sendMsg()" disabled>发送消息</button>
  <div style="display:flex;gap:8px;align-items:center;background:#111;border:1px solid #222;border-radius:10px;padding:10px 14px;">
    <span style="font-size:12px;color:#555;white-space:nowrap;">对方声音：</span>
    <audio id="remoteAudio" autoplay playsinline style="width:100%;height:32px;"></audio>
  </div>
  <button class="btn-leave" onclick="location.reload()">重新连接</button>
</div>

<script>
const SUPABASE_URL  = "https://ryqxhagdbycccosuavtp.supabase.co";
const SUPABASE_ANON = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJ5cXhoYWdkYnljY2Nvc3VhdnRwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk3MDM5MTgsImV4cCI6MjA5NTI3OTkxOH0.lj3PdKLsTU_cNEHjLNqyHSszJtGSU6gPORE5Y_9WNjQ";
const ROOM = "p2p-test-888888";
const myId = "设备" + Math.floor(Math.random() * 9000 + 1000);

const SUPABASE_URL_TURN = "https://ryqxhagdbycccosuavtp.supabase.co/functions/v1/create-turn-credentials";

// 动态获取真实TURN凭证
let RTC_CONFIG = {
  iceServers: [
    { urls: "stun:stun.l.google.com:19302" },
    { urls: "stun:stun1.l.google.com:19302" },
    { urls: "stun:stun.cloudflare.com:3478" },
  ],
  iceTransportPolicy: "all",
};

async function initTurnConfig() {
  try {
    const res = await fetch(SUPABASE_URL_TURN, {
      method: "POST",
      headers: {
        "Authorization": `Bearer ${SUPABASE_ANON}`,
        "apikey": SUPABASE_ANON,
        "Content-Type": "application/json"
      }
    });
    const data = await res.json();
    if (data.iceServers && Array.isArray(data.iceServers)) {
      RTC_CONFIG = {
        iceServers: [
          ...data.iceServers,
          { urls: "stun:stun.l.google.com:19302" },
          { urls: "stun:stun1.l.google.com:19302" },
        ],
        iceTransportPolicy: "all",
      };
      log("✅ TURN凭证获取成功！", "ok");
    }
  } catch(e) {
    log("⚠️ TURN获取失败，用备用STUN: " + e.message, "err");
  }
}

let pc = null, dc = null, sbChannel = null, sbClient = null;
let localStream = null;
let connected = false;
let pingInterval = null;
let pingStart = 0;

const logEl   = document.getElementById("log");
const statusEl= document.getElementById("status");
const pingEl  = document.getElementById("ping");
const msgInput= document.getElementById("msgInput");
const sendBtn = document.getElementById("sendBtn");

function log(msg, type = "info") {
  const d = document.createElement("div");
  d.className = type;
  d.textContent = new Date().toLocaleTimeString() + " " + msg;
  logEl.appendChild(d);
  logEl.scrollTop = logEl.scrollHeight;
  console.log(msg);
}

function setStatus(msg, type = "") {
  statusEl.textContent = msg;
  statusEl.className = "status" + (type ? " " + type : "");
}

async function send(payload) {
  if (sbChannel) await sbChannel.send({ type: "broadcast", event: "signal", payload });
}

async function createPC() {
  // 申请麦克风
  try {
    localStream = await navigator.mediaDevices.getUserMedia({ audio: true });
    log("✅ 麦克风已获取", "ok");
  } catch(e) {
    log("⚠️ 麦克风获取失败: " + e.message + "（文字测试仍可用）", "err");
  }

  pc = new RTCPeerConnection(RTC_CONFIG);

  // 收到对方音频
  pc.ontrack = (e) => {
    log("✅ 收到对方音频！", "ok");
    const audio = document.getElementById("remoteAudio");
    audio.srcObject = e.streams[0];
    audio.play().catch(() => {});
  };

  // 添加本机麦克风
  if (localStream) {
    localStream.getTracks().forEach(t => pc.addTrack(t, localStream));
  }

  // 记录所有ICE候选类型
  pc.onicecandidate = async (e) => {
    if (e.candidate) {
      log("ICE候选: " + e.candidate.type + " " + e.candidate.protocol, "info");
      await send({ type: "ice", candidate: e.candidate.toJSON() });
    } else {
      log("ICE收集完成", "ok");
    }
  };

  pc.oniceconnectionstatechange = () => {
    const s = pc.iceConnectionState;
    log("ICE状态: " + s, s === "connected" || s === "completed" ? "ok" : "info");
    if (s === "failed") {
      log("ICE失败！重启中...", "err");
      pc.restartIce();
    }
    if (s === "disconnected") {
      log("ICE断开！2秒后重启...", "err");
      setTimeout(() => {
        if (pc?.iceConnectionState === "disconnected") pc.restartIce();
      }, 2000);
    }
  };

  pc.onconnectionstatechange = () => {
    log("连接状态: " + pc.connectionState, "info");
  };

  return pc;
}

function setupDC(dataChannel) {
  dc = dataChannel;
  dc.onopen = () => {
    connected = true;
    log("✅ DataChannel已开启！P2P连接成功！", "ok");
    setStatus("🟢 P2P连接成功！可以发消息了", "ok");
    msgInput.disabled = false;
    sendBtn.disabled = false;
    msgInput.focus();

    // 开始ping测试延迟
    pingInterval = setInterval(() => {
      if (dc?.readyState === "open") {
        pingStart = Date.now();
        dc.send(JSON.stringify({ type: "ping", t: pingStart }));
      }
    }, 3000);
  };

  dc.onclose = () => {
    connected = false;
    log("DataChannel已关闭", "err");
    setStatus("连接断开", "err");
    msgInput.disabled = true;
    sendBtn.disabled = true;
    clearInterval(pingInterval);
  };

  dc.onerror = (e) => {
    log("DataChannel错误: " + e.error?.message, "err");
  };

  dc.onmessage = (e) => {
    try {
      const data = JSON.parse(e.data);
      if (data.type === "ping") {
        dc.send(JSON.stringify({ type: "pong", t: data.t }));
        return;
      }
      if (data.type === "pong") {
        const rtt = Date.now() - data.t;
        pingEl.textContent = "P2P延迟: " + rtt + "ms";
        return;
      }
      if (data.type === "msg") {
        log("对方说: " + data.text, "them");
      }
    } catch {
      log("对方说: " + e.data, "them");
    }
  };
}

let pendingIce = [];

async function handleSignal(payload) {
  if (payload.type === "join") {
    log("对方加入！我发offer...", "ok");
    await createPC();
    const d = pc.createDataChannel("chat");
    setupDC(d);
    const offer = await pc.createOffer();
    await pc.setLocalDescription(offer);
    await send({ type: "offer", sdp: pc.localDescription.sdp });
  }

  if (payload.type === "offer") {
    log("收到offer，发answer...", "ok");
    await createPC();
    pc.ondatachannel = (e) => setupDC(e.channel);
    await pc.setRemoteDescription({ type: "offer", sdp: payload.sdp });
    // 应用缓存的ICE
    for (const c of pendingIce) {
      try { await pc.addIceCandidate(new RTCIceCandidate(c)); } catch {}
    }
    pendingIce = [];
    const answer = await pc.createAnswer();
    await pc.setLocalDescription(answer);
    await send({ type: "answer", sdp: pc.localDescription.sdp });
  }

  if (payload.type === "answer") {
    log("收到answer，完成握手...", "ok");
    await pc.setRemoteDescription({ type: "answer", sdp: payload.sdp });
    for (const c of pendingIce) {
      try { await pc.addIceCandidate(new RTCIceCandidate(c)); } catch {}
    }
    pendingIce = [];
  }

  if (payload.type === "ice") {
    if (!pc?.remoteDescription) {
      pendingIce.push(payload.candidate);
    } else {
      try { await pc.addIceCandidate(new RTCIceCandidate(payload.candidate)); } catch {}
    }
  }
}

function cleanup() {
  if (localStream) { localStream.getTracks().forEach(t => t.stop()); localStream = null; }
}

function sendMsg() {
  const text = msgInput.value.trim();
  if (!text || !dc || dc.readyState !== "open") return;
  dc.send(JSON.stringify({ type: "msg", text }));
  log("我说: " + text, "msg");
  msgInput.value = "";
}

msgInput.addEventListener("keydown", (e) => {
  if (e.key === "Enter") sendMsg();
});

// 用async IIFE包装，支持顶层await
(async () => {
  log("我的ID: " + myId, "ok");
  log("获取TURN凭证...");
  await initTurnConfig();
  log("连接信令服务器...");

  sbClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON);
  sbChannel = sbClient.channel(`p2ptest-${ROOM}`, {
    config: { broadcast: { self: false } }
  });

  sbChannel
    .on("broadcast", { event: "signal" }, async ({ payload }) => {
      await handleSignal(payload);
    })
    .subscribe(async (status) => {
      log("信令状态: " + status, status === "SUBSCRIBED" ? "ok" : "info");
      if (status === "SUBSCRIBED") {
        setStatus("已进入房间，等待对方...");
        await sbChannel.send({ type: "broadcast", event: "signal", payload: { type: "join" } });
      }
    });
})();
</script>
</body>
</html>
