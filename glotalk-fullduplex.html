<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>GloTalk</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; -webkit-user-select: none; user-select: none; }
    body {
      min-height: 100dvh;
      background: #0a0a0a; color: #f0f0f0;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif;
      display: flex; align-items: center; justify-content: center;
      padding: max(20px, env(safe-area-inset-top)) 20px max(20px, env(safe-area-inset-bottom));
    }
    .app { width: min(100%, 420px); display: flex; flex-direction: column; gap: 12px; }
    .logo { font-size: 30px; font-weight: 800; letter-spacing: -1px; color: #fff; }
    .logo span { color: #22c55e; }

    .status-bar {
      display: flex; align-items: center; gap: 8px;
      background: #111; border: 1px solid #222; border-radius: 12px; padding: 10px 14px;
    }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: #333; flex-shrink: 0; transition: all 0.3s; }
    .dot.green  { background: #22c55e; box-shadow: 0 0 6px #22c55e88; }
    .dot.yellow { background: #f59e0b; }
    .dot.red    { background: #ef4444; }
    .status-text { font-size: 13px; color: #888; flex: 1; }
    .ping { font-size: 11px; color: #22c55e; }

    .lang-card {
      background: #111; border: 1px solid #222; border-radius: 14px; padding: 12px 14px;
      display: flex; flex-direction: column; gap: 8px;
    }
    .lang-row { display: flex; align-items: center; gap: 10px; }
    .lang-label { font-size: 11px; color: #555; font-weight: 600; text-transform: uppercase; width: 56px; flex-shrink: 0; }
    select {
      flex: 1; background: #1a1a1a; border: 1px solid #2a2a2a; border-radius: 8px;
      color: #f0f0f0; font: inherit; font-size: 14px; padding: 8px 10px; outline: none; cursor: pointer;
    }
    select option { background: #1a1a1a; }
    select:disabled { opacity: 0.4; }

    /* 字幕区（默认隐藏） */
    .subtitle-section { display: flex; flex-direction: column; gap: 8px; display: none; }
    .subtitle-section.visible { display: flex; }
    .box-wrap { display: flex; flex-direction: column; gap: 4px; }
    .box-label { font-size: 11px; color: #555; font-weight: 600; text-transform: uppercase; padding-left: 2px; }
    .tbox {
      min-height: 80px; max-height: 120px; overflow-y: auto;
      border-radius: 12px; padding: 12px;
      font-size: 16px; font-weight: 600; line-height: 1.5;
      word-break: break-word; white-space: pre-wrap;
    }
    /* 上框：对方说→翻译成我的语言 */
    .tbox-them { background: #0d1a0f; border: 1px solid #1a3320; color: #22c55e; }
    .tbox-them:empty::before { content: attr(data-ph); color: #1a3320; font-size: 13px; font-weight: 400; }
    /* 下框：我说的话原文（本地ASR） */
    .tbox-me { background: #0f0f1a; border: 1px solid #1a1a3a; color: #60a5fa; }
    .tbox-me:empty::before { content: attr(data-ph); color: #1a1a3a; font-size: 13px; font-weight: 400; }

    .btn {
      width: 100%; height: 60px; border: none; border-radius: 14px;
      font: inherit; font-size: 17px; font-weight: 800; cursor: pointer;
      transition: all 0.15s; touch-action: none;
    }
    .btn:active:not(:disabled) { transform: scale(0.97); }
    .btn-green { background: #22c55e; color: #000; }
    .btn-red   { background: #ef4444; color: #fff; box-shadow: 0 0 0 4px #ef444422; }

    .toolbar { display: flex; gap: 8px; flex-wrap: wrap; }
    .tool-btn {
      flex: 1; min-width: 70px; height: 44px;
      border: 1px solid #222; border-radius: 10px;
      background: #111; color: #888; font: inherit; font-size: 12px; cursor: pointer;
      transition: all 0.15s;
    }
    .tool-btn.active { border-color: #22c55e44; color: #22c55e; background: #0d1a0f; }
    .tool-btn:active { transform: scale(0.96); }

    .video-row { display: flex; gap: 8px; }
    .video-wrap { flex: 1; display: flex; flex-direction: column; gap: 4px; align-items: center; }
    .video-wrap span { font-size: 11px; color: #555; }
    video { width: 100%; aspect-ratio: 4/3; border-radius: 10px; background: #111; object-fit: cover; display: none; }

    .log-box {
      background: #0a0a0a; border: 1px solid #1a1a1a; border-radius: 8px;
      padding: 8px; font-size: 11px; max-height: 140px; overflow-y: auto;
      font-family: monospace; display: none;
    }
    .toggle-log { width: 100%; height: 28px; border: none; border-radius: 6px; background: #111; color: #333; font-size: 11px; cursor: pointer; }
    audio { display: none; }
  </style>
</head>

    <div class="video-wrap">
      <span id="labelLocalVideo">我的画面</span>
      <video id="localVideo" autoplay playsinline muted></video>
    </div>
    <div class="video-wrap">
      <span id="labelRemoteVideo">对方画面</span>
      <video id="remoteVideo" autoplay playsinline></video>
    </div>
  </div>

  <button class="btn btn-green" id="mainBtn" onclick="handleMain()">开始通话</button>

  <div class="toolbar" id="toolbar" style="display:none">
    <button class="tool-btn active" id="muteBtn"    onclick="toggleMute()">🎤 麦克风</button>

    <button class="tool-btn"        onclick="location.reload()" id="reconnBtn">🔄 重连</button>
  </div>

  <div class="log-box" id="logBox"></div>
  <button class="toggle-log" onclick="toggleLog()">🔍 调试日志</button>

</div>

<!-- 音频：对方翻译后的声音 -->
<audio id="audioThem" autoplay playsinline></audio>
<!-- 音频：对方原始P2P声音（音量压低） -->
<audio id="audioRaw" autoplay playsinline></audio>

// ═══════════════════════════════════════════════
// UI
// ═══════════════════════════════════════════════
function setStatus(msg, color) {
  $("statusText").textContent = msg;
  $("dot").className = "dot" + (color ? " "+color : "");
  log(msg, color==="green"?"#22c55e":color==="red"?"#ef4444":"#60a5fa");
}
function log(msg, color="#555") {
  const d = document.createElement("div");
  d.style.color = color;
  d.textContent = new Date().toLocaleTimeString()+" "+msg;
  $("logBox").appendChild(d);
  $("logBox").scrollTop = $("logBox").scrollHeight;
}
function toggleLog() {
  const b = $("logBox");
  b.style.display = b.style.display==="block" ? "none" : "block";
}
function appendBox(el, text) {
  if (!text) return;
  el.textContent += text;
  el.scrollTop = el.scrollHeight;
}
function newlineBox(el) {
  if (el.textContent) el.textContent += "\n";
  el.scrollTop = el.scrollHeight;
}

// ═══════════════════════════════════════════════
// TURN
// ═══════════════════════════════════════════════
async function initTurn() {
  try {
    const r = await fetch(SUPABASE_TURN_URL, {
      method:"POST",
      headers:{"Authorization":`Bearer ${SUPABASE_ANON}`,"apikey":SUPABASE_ANON,"Content-Type":"application/json"}
    });
    const d = await r.json();
    let servers = d.iceServers;
    if (servers && !Array.isArray(servers)) servers = [servers];
    if (servers?.length) {
      const u = servers[0].username || d.username;
      const c = servers[0].credential || d.credential;
      const extra = (u&&c) ? [
        {urls:"turns:turn.cloudflare.com:5349?transport=tcp",username:u,credential:c},
        {urls:"turn:turn.cloudflare.com:3478?transport=tcp", username:u,credential:c},
        {urls:"turn:turn.cloudflare.com:3478?transport=udp", username:u,credential:c},
      ] : [];
      rtcConfig = { iceServers:[{urls:"stun:stun.l.google.com:19302"},...extra,...servers], iceTransportPolicy:"all" };
      log("✅ TURN "+rtcConfig.iceServers.length+"个服务器","#22c55e");
    }
  } catch(e) { log("⚠️ TURN: "+e.message,"#f59e0b"); }
}

// ═══════════════════════════════════════════════
// 本地ASR（Web Speech API）
// 用途：识别我说的话 → 显示在下框（原文，不走OpenAI）
// 完全免费，本地处理
// ═══════════════════════════════════════════════
function startASR() {
  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SpeechRecognition) {
    log("⚠️ 此浏览器不支持本地语音识别","#f59e0b");
    return;
  }
  const sr = new SpeechRecognition();
  sr.lang = t.srLang;         // 跟随用户选择的语言
  sr.continuous = true;       // 持续识别
  sr.interimResults = true;   // 实时中间结果

  let finalText = "";

  sr.onresult = e => {
    if (!subtitleOn) return; // 字幕关闭时不显示
    let interim = "";
    for (let i = e.resultIndex; i < e.results.length; i++) {
      if (e.results[i].isFinal) {
        finalText += e.results[i][0].transcript;
        newlineBox($("boxMe"));
      } else {
        interim = e.results[i][0].transcript;
      }
    }
    if (interim) {
      // 显示中间结果（实时反馈）
      const box = $("boxMe");
      const lines = box.textContent.split("\n");
      lines[lines.length-1] = interim;
      box.textContent = lines.join("\n");
      box.scrollTop = box.scrollHeight;
    }
  };

  sr.onerror = e => {
    if (e.error !== "no-speech") log("ASR错误: "+e.error,"#f59e0b");
  };

  sr.onend = () => {
    // 自动重启（callActive时保持持续识别）
    if (callActive && !muted) {
      try { sr.start(); } catch {}
    }
  };

  try { sr.start(); log("✅ 本地ASR启动（"+t.srLang+"）","#22c55e"); }
  catch(e) { log("ASR启动失败: "+e.message,"#f59e0b"); }

  speechRecognition = sr;
}

function stopASR() {
  if (speechRecognition) {
    try { speechRecognition.stop(); } catch {}
    speechRecognition = null;
  }
}

// ═══════════════════════════════════════════════
// 翻译引擎（对方声音 → 翻译成我的语言）
// 上框字幕来自 output_transcript（翻译后文字）
// 对方原始P2P声音音量压到0.1，翻译声音正常播放
// ═══════════════════════════════════════════════
async function buildTranslationSession(inputStream, outputLang) {
  const ctx  = new (window.AudioContext || window.webkitAudioContext)();
  const dest = ctx.createMediaStreamDestination();
  const silent = dest.stream;

  const tPc = new RTCPeerConnection({
    iceServers:[{urls:"stun:stun.l.google.com:19302"},{urls:"stun:stun1.l.google.com:19302"}],
    iceCandidatePoolSize:10,
  });

  // 翻译后的声音 → audioThem播放（正常音量）
  tPc.ontrack = e => {
    $("audioThem").srcObject = e.streams[0];
    $("audioThem").volume = 1.0;
    $("audioThem").play().catch(()=>{});
    log("✅ 翻译音频流已连接","#22c55e");
  };

  const tDc = tPc.createDataChannel("oai-events");
  tDc.onmessage = e => {
    try {
      const ev = JSON.parse(e.data);
      // 上框：翻译后的文字（output transcript）
      if (ev.type==="session.output_transcript.delta"||ev.type==="response.audio_transcript.delta") {
        if (subtitleOn) appendBox($("boxThem"), ev.delta||ev.text||"");
      }
      if (ev.type==="session.output_transcript.done"||ev.type==="response.audio_transcript.done") {
        if (subtitleOn) newlineBox($("boxThem"));
      }
      if (ev.type==="error") log("翻译错误: "+(ev.error?.message||""),"#ef4444");
    } catch {}
  };

  silent.getTracks().forEach(tk => { tk.enabled=false; tPc.addTrack(tk,silent); });

  const [secretRes, offer] = await Promise.all([
    fetch(SESSION_URL, {
      method:"POST", headers:{"Content-Type":"application/json"},
      body:JSON.stringify({outputLanguage:outputLang})
    }),
    tPc.createOffer().then(o => { tPc.setLocalDescription(o); return o; })
  ]);

  const secretText = await secretRes.text();
  if (!secretRes.ok) throw new Error("Session "+secretRes.status);
  const {client_secret} = JSON.parse(secretText);
  if (!client_secret) throw new Error("no client_secret");

  const sdpRes = await fetch(`${SDP_URL}?model=gpt-realtime-translate`, {
    method:"POST",
    headers:{"Authorization":`Bearer ${client_secret}`,"Content-Type":"application/sdp"},
    body:offer.sdp
  });
  const answerSdp = await sdpRes.text();
  if (!sdpRes.ok) throw new Error("SDP "+sdpRes.status);

  await tPc.setRemoteDescription({type:"answer",sdp:answerSdp});

  await new Promise((resolve,reject) => {
    const to = setTimeout(()=>reject(new Error("翻译引擎超时")),15000);
    const check = () => {
      const s = tPc?.iceConnectionState;
      if (s==="connected"||s==="completed") { clearTimeout(to); resolve(); }
      else if (s==="failed") { clearTimeout(to); reject(new Error("ICE失败")); }
    };
    tPc.oniceconnectionstatechange = check;
    check();
  });

  // 把对方声音送入翻译引擎
  if (inputStream) {
    const track = inputStream.getAudioTracks()[0];
    if (track) {
      const sender = tPc.getSenders().find(s=>s.track?.kind==="audio");
      if (sender) await sender.replaceTrack(track);
    }
  }

  log("✅ 翻译引擎就绪 →"+outputLang,"#22c55e");
  return tPc;
}

// ═══════════════════════════════════════════════
// P2P连接
// ═══════════════════════════════════════════════
async function createP2P() {
  try {
    localStream = await navigator.mediaDevices.getUserMedia({
      audio:{ echoCancellation:true, noiseSuppression:true, autoGainControl:true },
      video:false
    });
    log("✅ 麦克风已获取","#22c55e");
  } catch(e) { log("⚠️ 麦克风: "+e.message,"#ef4444"); }

  p2pPc = new RTCPeerConnection(rtcConfig);
  if (localStream) localStream.getTracks().forEach(tk=>p2pPc.addTrack(tk,localStream));

  let remoteStream = new MediaStream();

  p2pPc.ontrack = async e => {
    log("收到对方轨道: "+e.track.kind,"#60a5fa");

    if (e.track.kind==="video") {
      remoteStream.addTrack(e.track);
      $("remoteVideo").srcObject = remoteStream;
      $("remoteVideo").style.display = "block";
      return;
    }

    if (e.track.kind==="audio") {
      // 对方原始声音：音量压低到0.1（避免和翻译声音叠加混乱）
      // 翻译声音是主要输出，原始声音只作为参考
      const rawStream = new MediaStream([e.track]);
      $("audioRaw").srcObject = rawStream;
      $("audioRaw").volume = 0.1;
      $("audioRaw").play().catch(()=>{});
      log("对方原始声音音量已压低至10%","#60a5fa");

      // 把对方声音送进翻译引擎
      const myLang = $("myLang").value;
      try {
        theirTransPc = await buildTranslationSession(rawStream, myLang);
        setStatus(t.active, "green");
      } catch(err) {
        log("翻译引擎失败: "+err.message,"#ef4444");
        // 翻译失败时，原始声音恢复正常音量
        $("audioRaw").volume = 1.0;
        setStatus(t.active+" ⚠️翻译异常","yellow");
      }
    }
  };

  p2pPc.onicecandidate = async e => {
    if (e.candidate) await bcast({type:"ice",candidate:e.candidate.toJSON()});
  };

  p2pPc.oniceconnectionstatechange = () => {
    const s = p2pPc.iceConnectionState;
    log("ICE: "+s, s==="connected"||s==="completed"?"#22c55e":s==="failed"?"#ef4444":"#60a5fa");
    if (s==="connected"||s==="completed") {
      clearTimeout(relayTimer);
      setStatus(t.connecting+" P2P✅ 翻译启动中...","yellow");
    }
    if (s==="failed"&&!usedRelay) {
      usedRelay=true;
      try { p2pPc.setConfiguration({...rtcConfig,iceTransportPolicy:"relay"}); } catch {}
      p2pPc.restartIce();
    }
    if (s==="disconnected") {
      setTimeout(()=>{ if(p2pPc?.iceConnectionState==="disconnected") p2pPc.restartIce(); },2000);
    }
  };

  relayTimer = setTimeout(()=>{
    if (!usedRelay&&p2pPc?.iceConnectionState!=="connected"&&p2pPc?.iceConnectionState!=="completed") {
      usedRelay=true;
      try { p2pPc.setConfiguration({...rtcConfig,iceTransportPolicy:"relay"}); } catch {}
      p2pPc.restartIce();
    }
  },15000);
}

function setupDC(d) {
  dc = d;
  dc.onopen = () => {
    log("✅ DataChannel开启","#22c55e");
    // 启动本地ASR（识别我说的话，显示在下框）
    startASR();
    // ping保活
    setInterval(()=>{
      if (dc?.readyState==="open") {
        pingStart = Date.now();
        dc.send(JSON.stringify({type:"ping",t:pingStart}));
      }
    },3000);
  };
  dc.onclose  = () => setStatus(t.left,"red");
  dc.onmessage = e => {
    try {
      const d = JSON.parse(e.data);
      if (d.type==="ping") { dc.send(JSON.stringify({type:"pong",t:d.t})); return; }
      if (d.type==="pong") { $("pingText").textContent=(Date.now()-d.t)+"ms"; return; }
    } catch {}
  };
}

// ICE
async function addIce(c) {
  if (!p2pPc) return;
  if (!p2pPc.remoteDescription) { pendingIce.push(c); return; }
  try { await p2pPc.addIceCandidate(new RTCIceCandidate(c)); } catch {}
}
async function flushIce() {
  while(pendingIce.length) {
    try { await p2pPc.addIceCandidate(new RTCIceCandidate(pendingIce.shift())); } catch {}
  }
}

// 信令
async function bcast(payload) {
  if (ch) await ch.send({type:"broadcast",event:"signal",payload});
}
async function onSignal(payload) {
  if (payload.type==="offer") {
    if (!p2pPc) await createP2P();
    p2pPc.ondatachannel = e=>setupDC(e.channel);
    await p2pPc.setRemoteDescription({type:"offer",sdp:payload.sdp});
    await flushIce();
    const ans = await p2pPc.createAnswer();
    await p2pPc.setLocalDescription(ans);
    await bcast({type:"answer",sdp:p2pPc.localDescription.sdp});
  }
  if (payload.type==="answer") {
    await p2pPc.setRemoteDescription({type:"answer",sdp:payload.sdp});
    await flushIce();
  }
  if (payload.type==="ice") await addIce(payload.candidate);
}

// ═══════════════════════════════════════════════
// 主流程
// ═══════════════════════════════════════════════
async function startCall() {
  callActive = true;
  $("mainBtn").className = "btn btn-red";
  $("mainBtn").textContent = t.btnHangup;
  $("toolbar").style.display = "flex";
  $("myLang").disabled = true;
  $("theirLang").disabled = true;
  $("boxThem").textContent = "";
  $("boxMe").textContent = "";

  setStatus(t.connecting,"yellow");
  log("ID:"+myId+" 房间:"+ROOM,"#60a5fa");

  await initTurn();

  sb = window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON);
  ch = sb.channel(ROOM,{config:{broadcast:{self:false},presence:{key:myId}}});

  ch.on("presence",{event:"sync"},async()=>{
    const members = Object.keys(ch.presenceState()).sort();
    log("成员: "+members.join(", "),"#60a5fa");
    if (members.length>2) { setStatus(t.full,"red"); return; }
    if (members.length>=2&&!p2pPc) {
      const isCaller = members[0]===myId;
      log(isCaller?"发offer":"等待offer","#60a5fa");
      if (isCaller) {
        await createP2P();
        const d = p2pPc.createDataChannel("chat");
        setupDC(d);
        const offer = await p2pPc.createOffer();
        await p2pPc.setLocalDescription(offer);
        await bcast({type:"offer",sdp:p2pPc.localDescription.sdp});
      } else {
        await createP2P();
        p2pPc.ondatachannel = e=>setupDC(e.channel);
      }
    }
  })
  .on("presence",{event:"join"},({key})=>{
    log("加入: "+key,"#22c55e");
    setStatus(t.connecting,"yellow");
  })
  .on("presence",{event:"leave"},({key})=>{
    log("离开: "+key,"#ef4444");
    setStatus(t.left,"red");
  })
  .on("broadcast",{event:"signal"},async({payload})=>{ await onSignal(payload); })
  .subscribe(async s=>{
    if (s==="SUBSCRIBED") {
      setStatus(t.waiting,"yellow");
      await ch.track({id:myId,ts:myTs});
    }
  });
}

function hangup() {
  callActive = false;
  clearTimeout(relayTimer);
  stopASR();
  [p2pPc,theirTransPc].forEach(pc=>{ try{pc?.close();}catch{} });
  p2pPc = theirTransPc = null;
  if (localStream) { localStream.getTracks().forEach(tk=>tk.stop()); localStream=null; }
  if (ch) { ch.unsubscribe(); ch=null; }
  $("mainBtn").className = "btn btn-green";
  $("mainBtn").textContent = t.btnStart;
  $("toolbar").style.display = "none";
  $("myLang").disabled = false;
  $("theirLang").disabled = false;
  setStatus(t.ended,"");
}

function handleMain() {
  if (callActive) hangup();
  else startCall();
}

// ═══════════════════════════════════════════════
// 工具栏
// ═══════════════════════════════════════════════
function toggleMute() {
  muted = !muted;
  if (localStream) localStream.getAudioTracks().forEach(tk=>tk.enabled=!muted);
  if (muted) stopASR(); else if (callActive) startASR();
  $("muteBtn").textContent = muted ? t.btnMicOff : t.btnMic;
  $("muteBtn").className = "tool-btn"+(muted?"":" active");
}

function toggleSubtitle() {
  subtitleOn = !subtitleOn;
  $("subtitleSection").className = "subtitle-section"+(subtitleOn?" visible":"");
  $("subtitleBtn").textContent = subtitleOn ? t.btnSubOn : t.btnSub;
  $("subtitleBtn").className = "tool-btn"+(subtitleOn?" active":"");
  if (!subtitleOn) {
    $("boxThem").textContent = "";
    $("boxMe").textContent = "";
  }
}

async function toggleVideo() {
  videoOn = !videoOn;
  $("videoBtn").textContent = videoOn ? t.btnCamOn : t.btnCam;
  $("videoBtn").className = "tool-btn"+(videoOn?" active":"");
  $("videoRow").style.display = videoOn ? "flex" : "none";
  if (videoOn && localStream) {
    try {
      const vs = await navigator.mediaDevices.getUserMedia({video:{facingMode:"user",width:{ideal:640},height:{ideal:480}}});
      const vt = vs.getVideoTracks()[0];
      localStream.addTrack(vt);
      $("localVideo").style.display = "block";
      $("localVideo").srcObject = localStream;
      if (p2pPc) p2pPc.addTrack(vt,localStream);
    } catch(e) { log("摄像头失败: "+e.message,"#ef4444"); videoOn=false; }
  } else if (!videoOn && localStream) {
    localStream.getVideoTracks().forEach(tk=>{ tk.stop(); localStream.removeTrack(tk); });
    $("localVideo").style.display = "none";
  }
}

window.addEventListener("load",()=>onLangChange());
</script>
