// ===== 日志 =====
const screenLog = document.getElementById("screenLog");
function addLog(msg, color="#555") {
  const d = document.createElement("div");
  d.style.color = color;
  d.textContent = new Date().toLocaleTimeString() + " " + msg;
  screenLog.appendChild(d);
  screenLog.scrollTop = screenLog.scrollHeight;
}
function toggleLog() {
  screenLog.style.display = screenLog.style.display === "none" ? "block" : "none";
}
function setStatus(msg, type="") {
  document.getElementById("statusBar").textContent = msg;
  document.getElementById("statusBar").className = type;
  const c = type==="ok"?"#22c55e":type==="err"?"#ef4444":type==="info"?"#60a5fa":"#555";
  addLog(msg, c);
}
function setIndicator(state, text) {
  document.getElementById("dot").className = "dot"+(state?" "+state:"");
  document.getElementById("indText").textContent = text;
}

// ===== 配置 =====
const SUPABASE_URL   = "https://ryqxhagdbycccosuavtp.supabase.co";
const SUPABASE_ANON  = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJ5cXhoYWdkYnljY2Nvc3VhdnRwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk3MDM5MTgsImV4cCI6MjA5NTI3OTkxOH0.lj3PdKLsTU_cNEHjLNqyHSszJtGSU6gPORE5Y_9WNjQ";
const TURN_URL       = "https://ryqxhagdbycccosuavtp.supabase.co/functions/v1/create-turn-credentials";
const SESSION_URL    = "https://ryqxhagdbycccosuavtp.supabase.co/functions/v1/create-realtime-session";

const ROOM = "glt-fd-888888";

const myTs = Date.now();

// ===== 状态 =====
let rtcConfig = { iceServers:[{urls:"stun:stun.l.google.com:19302"}], iceTransportPolicy:"all" };
let sb=null, ch=null, pc=null, transPc=null;
let localStream=null, videoStream=null;
let videoEnabled=false, rtcReady=false;
let makingOffer=false, ignoreOffer=false, isPolite=false;
let transRetryCount=0;
let pendingIce=[];
let audioCtx=null, analyser=null, vadTimer=null, isSpeaking=false, vadInterval=null;
const VAD_THRESHOLD=0.015, VAD_HOLD_MS=800;

// ===== TURN =====

// ===== VAD =====
function startVAD(stream) {
  try {
    audioCtx = new (window.AudioContext||window.webkitAudioContext)();
    const src = audioCtx.createMediaStreamSource(stream);
    analyser = audioCtx.createAnalyser();
    analyser.fftSize=512; analyser.smoothingTimeConstant=0.3;
    src.connect(analyser);
    const buf = new Uint8Array(analyser.frequencyBinCount);
    vadInterval = setInterval(()=>{
      if (!analyser) return;
      analyser.getByteFrequencyData(buf);
      let sum=0; for(let i=0;i<buf.length;i++) sum+=buf[i]*buf[i];
      const rms = Math.sqrt(sum/buf.length)/255;
      document.getElementById("vadFill").style.width = Math.min(rms*800,100)+"%";
      if (rms>VAD_THRESHOLD) {
        clearTimeout(vadTimer);
        if (!isSpeaking) { isSpeaking=true; setIndicator("speaking",t("speaking")); }
        vadTimer = setTimeout(()=>{
          isSpeaking=false;
          setIndicator(rtcReady?"":"translating", rtcReady?t("standby"):t("transStart"));
          document.getElementById("vadFill").style.width="0%";
        }, VAD_HOLD_MS);
      }
    }, 20);
  } catch(e) { addLog("VAD error: "+e.message, "#ef4444"); }
}
function stopVAD() {
  clearInterval(vadInterval); clearTimeout(vadTimer); vadInterval=null; isSpeaking=false;
  document.getElementById("vadFill").style.width="0%";
  if (audioCtx) { audioCtx.close().catch(()=>{}); audioCtx=null; } analyser=null;
}

// ===== 翻译引擎 =====
// ===== 翻译引擎：使用WebSocket代替WebRTC连接OpenAI =====
// 原因：OpenAI Realtime WebRTC在Safari iOS上有ICE consent bug（官方已确认）
// 解决方案：改用WebSocket传输，完全绕过ICE问题
// 参考：https://github.com/openai/openai-agents-js/issues/1353

let transWs = null;        // WebSocket连接到OpenAI
let transAudioCtx = null;  // 播放翻译音频的AudioContext
let transWorklet = null;   // 音频处理器
let peerMediaStream = null; // 对方的音频流

function scheduleTransRetry() {
  if (transRetryCount >= 3) {
    addLog("Trans failed after "+transRetryCount+" retries", "#ef4444");
    transRetryCount = 0;
    setStatus(t("transFail"), "err");
    setIndicator("", t("transFail"));
    return;
  }
  transRetryCount++;
  const delay = transRetryCount * 3000;
  addLog("Trans WS retry "+transRetryCount+"/3 in "+(delay/1000)+"s...", "#f59e0b");
  setTimeout(async () => {
    if (peerMediaStream) {
      addLog("Retrying translation WS (attempt "+transRetryCount+")...", "#f59e0b");
      await startTranslation(peerMediaStream.getAudioTracks()[0]);
    }
  }, delay);
}

function handleTransEvent(data) {
  try {
    const ev = JSON.parse(data);
    if (ev.type && !["session.created","output_audio_buffer.started",
      "input_audio_buffer.speech_started","input_audio_buffer.speech_stopped",
      "input_audio_buffer.committed"].includes(ev.type)) {
      addLog("DC: "+ev.type, "#60a5fa");
    }
    if (ev.type==="session.output_transcript.delta"||ev.type==="response.audio_transcript.delta") {
      const delta = ev.delta||ev.text||"";
      if (delta) {
        addLog("delta: ["+delta+"]", "#22c55e");
        const tb = document.getElementById("transcript");
        tb.textContent += delta;
        tb.scrollTop = tb.scrollHeight;
      }
    }
    if (ev.type==="session.output_transcript.done"||ev.type==="response.audio_transcript.done") {
      const tb = document.getElementById("transcript");
      const lines = tb.textContent.split("\n");
      tb.textContent = (lines.length>6?lines.slice(-6):lines).join("\n")+"\n";
      tb.scrollTop = tb.scrollHeight;
    }
    if (ev.type==="session.input_transcript.delta") {
      const delta = ev.delta||ev.text||"";
      if (delta) {
        const tb = document.getElementById("myTranscript");
        tb.textContent += delta;
        tb.scrollTop = tb.scrollHeight;
      }
    }
    if (ev.type==="session.input_transcript.done") {
      const tb = document.getElementById("myTranscript");
      addLog("对方说: ["+tb.textContent.trim().split("\n").filter(Boolean).pop()+"]", "#60a5fa");
      const lines = tb.textContent.split("\n");
      tb.textContent = (lines.length>4?lines.slice(-4):lines).join("\n")+"\n";
      tb.scrollTop = tb.scrollHeight;
    }
    if (ev.type==="error") addLog("Trans error: "+(ev.error?.message||""), "#ef4444");

    // 播放翻译后的音频
    if (ev.type==="response.audio.delta"&&ev.delta) {
      playTranslatedAudio(ev.delta);
    }
  } catch(e) { addLog("Trans parse err: "+e.message, "#ef4444"); }
}

// 播放Base64编码的PCM音频
let audioQueue = [];
let isPlaying = false;

async function playTranslatedAudio(base64Audio) {
  if (!transAudioCtx) {
    transAudioCtx = new (window.AudioContext||window.webkitAudioContext)({sampleRate:24000});
  }
  if (transAudioCtx.state === "suspended") await transAudioCtx.resume();

  const raw = atob(base64Audio);
  const pcm = new Int16Array(raw.length/2);
  for (let i=0; i<pcm.length; i++) {
    pcm[i] = (raw.charCodeAt(i*2)) | (raw.charCodeAt(i*2+1)<<8);
  }
  const float32 = new Float32Array(pcm.length);
  for (let i=0; i<pcm.length; i++) float32[i] = pcm[i]/32768;

  const buf = transAudioCtx.createBuffer(1, float32.length, 24000);
  buf.copyToChannel(float32, 0);
  audioQueue.push(buf);
  if (!isPlaying) drainAudioQueue();
}

let nextStartTime = 0;
function drainAudioQueue() {
  if (audioQueue.length===0) { isPlaying=false; return; }
  isPlaying = true;
  const buf = audioQueue.shift();
  const src = transAudioCtx.createBufferSource();
  src.buffer = buf;
  src.connect(transAudioCtx.destination);
  const now = transAudioCtx.currentTime;
  const start = Math.max(now, nextStartTime);
  src.start(start);
  nextStartTime = start + buf.duration;
  src.onended = drainAudioQueue;
}

// 把对方麦克风音频转成PCM发给OpenAI WebSocket
let captureCtx = null;
let captureProcessor = null;

function startAudioCapture(audioTrack) {
  try {
    captureCtx = new (window.AudioContext||window.webkitAudioContext)({sampleRate:24000});
    const stream = new MediaStream([audioTrack]);
    const source = captureCtx.createMediaStreamSource(stream);
    captureProcessor = captureCtx.createScriptProcessor(4096, 1, 1);
    captureProcessor.onaudioprocess = (e) => {
      if (!transWs || transWs.readyState !== WebSocket.OPEN) return;
      const float32 = e.inputBuffer.getChannelData(0);
      const pcm16 = new Int16Array(float32.length);
      for (let i=0; i<float32.length; i++) {
        pcm16[i] = Math.max(-32768, Math.min(32767, float32[i]*32768));
      }
      const bytes = new Uint8Array(pcm16.buffer);
      let binary = "";
      for (let i=0; i<bytes.length; i++) binary += String.fromCharCode(bytes[i]);
      const base64 = btoa(binary);
      transWs.send(JSON.stringify({
        type: "input_audio_buffer.append",
        audio: base64
      }));
    };
    source.connect(captureProcessor);
    captureProcessor.connect(captureCtx.destination);
    addLog("Audio capture started (24kHz PCM)", "#22c55e");
  } catch(e) {
    addLog("Audio capture error: "+e.message, "#ef4444");
  }
}

function stopAudioCapture() {
  if (captureProcessor) { captureProcessor.disconnect(); captureProcessor=null; }
  if (captureCtx) { captureCtx.close().catch(()=>{}); captureCtx=null; }
}

async function startTranslation(peerAudioTrack) {
  if (transWs) return;
  peerMediaStream = new MediaStream([peerAudioTrack]);
  addLog("Starting translation via WebSocket, lang="+myLang, "#60a5fa");

  try {
    // 1. 获取session密钥
    const secretRes = await fetch(SESSION_URL, {
      method:"POST",
      headers:{"Authorization":`Bearer ${SUPABASE_ANON}`,"apikey":SUPABASE_ANON,"Content-Type":"application/json"},
      body: JSON.stringify({ outputLanguage: myLang })
    });
    const secretText = await secretRes.text();
    addLog("Session: "+secretRes.status, secretRes.ok?"#22c55e":"#ef4444");
    if (!secretRes.ok) throw new Error(secretRes.status+" "+secretText);
    const { client_secret } = JSON.parse(secretText);
    if (!client_secret) throw new Error("no client_secret");

    // 2. 连接WebSocket
    const wsUrl = `wss://api.openai.com/v1/realtime/translations?model=gpt-realtime-translate`;
    transWs = new WebSocket(wsUrl, ["realtime", "openai-insecure-api-key."+client_secret, "openai-beta.realtime-v1"]);

    await new Promise((resolve, reject) => {
      const timeout = setTimeout(() => reject(new Error("WS connect timeout")), 10000);
      transWs.onopen = () => {
        clearTimeout(timeout);
        addLog("Trans WebSocket connected!", "#22c55e");
        transRetryCount = 0;
        resolve();
      };
      transWs.onerror = (e) => {
        clearTimeout(timeout);
        reject(new Error("WS error"));
      };
    });

    transWs.onmessage = (e) => handleTransEvent(e.data);

    transWs.onclose = (e) => {
      addLog("Trans WS closed: "+e.code+" "+e.reason, "#ef4444");
      transWs = null;
      stopAudioCapture();
      rtcReady = false;
      // 自动重连
      if (p2pPc && p2pPc.connectionState === "connected") {
        setTimeout(() => scheduleTransRetry(), 500);
      }
    };

    transWs.onerror = (e) => {
      addLog("Trans WS error", "#ef4444");
    };

    // 3. 开始捕获对方音频并发送
    startAudioCapture(peerAudioTrack);

    rtcReady = true;
    setIndicator("", t("standby"));
    setStatus(t("transReady"), "ok");
    addLog("Translation WebSocket ready!", "#22c55e");

  } catch(err) {
    addLog("Trans WS FAILED: "+err.message, "#ef4444");
    if (transWs) { try { transWs.close(); } catch {} transWs=null; }
    stopAudioCapture();
    setTimeout(() => scheduleTransRetry(), 100);
  }
}

// ===== PERFECT NEGOTIATION（W3C标准，微信/Discord用的就是这套）=====
function setupPC() {
  pc = new RTCPeerConnection(rtcConfig);

  // onnegotiationneeded：需要协商时自动发offer
  pc.onnegotiationneeded = async () => {
    try {
      makingOffer = true;
      addLog("onnegotiationneeded → setLocalDescription", "#60a5fa");
      await pc.setLocalDescription();
      await bcast({ type:"sdp", sdp: pc.localDescription });
    } catch(e) {
      addLog("negotiation error: "+e.message, "#ef4444");
    } finally {
      makingOffer = false;
    }
  };

  // ICE候选
  pc.onicecandidate = async ({candidate}) => {
    if (candidate) {
      await bcast({ type:"ice", candidate: candidate.toJSON() });
    }
  };

  pc.oniceconnectionstatechange = () => {
    const s = pc.iceConnectionState;
    addLog("P2P ICE: "+s, s==="connected"||s==="completed"?"#22c55e":s==="failed"?"#ef4444":"#60a5fa");
    if (s==="failed") pc.restartIce();
    if (s==="disconnected") setTimeout(()=>{ if(pc?.iceConnectionState==="disconnected") pc.restartIce(); }, 2000);
  };

  pc.onconnectionstatechange = () => {
    addLog("P2P conn: "+pc.connectionState, "#60a5fa");
    if (pc.connectionState==="connected") {
      // 只有第一次连接时显示p2pOk，翻译引擎已在运行就不重复启动
      if (!rtcReady) setStatus(t("p2pOk"), "ok");
    }
  };

  // 收到对方轨道
  let remoteStream = new MediaStream();
  pc.ontrack = async ({track, streams}) => {
    addLog("P2P ontrack: "+track.kind, "#22c55e");
    remoteStream.addTrack(track);

    if (track.kind==="video") {
      document.getElementById("remoteVideo").srcObject = remoteStream;
    }

    if (track.kind==="audio" && !transPc) {
      // 只送给翻译引擎，不直接播放（只启动一次）
      setIndicator("translating", t("transStart"));
      await startTranslation(track);
    }
  };

  // 添加本机麦克风（Perfect Negotiation：addTrack会自动触发onnegotiationneeded）
  if (localStream) {
    localStream.getTracks().forEach(track => {
      pc.addTrack(track, localStream);
      addLog("Added local track: "+track.kind, "#22c55e");
    });
  }

  return pc;
}

// ===== 信令处理（Perfect Negotiation标准模式）=====
async function handleSignal(payload) {
  if (payload.type === "sdp") {
    const desc = payload.sdp;
    const offerCollision = desc.type==="offer" && (makingOffer || pc.signalingState!=="stable");
    ignoreOffer = !isPolite && offerCollision;
    if (ignoreOffer) { addLog("Ignoring colliding offer (impolite)", "#f59e0b"); return; }

    addLog("setRemoteDescription: "+desc.type, "#60a5fa");
    await pc.setRemoteDescription(desc);

    if (desc.type === "offer") {
      addLog("Creating answer...", "#60a5fa");
      await pc.setLocalDescription();
      await bcast({ type:"sdp", sdp: pc.localDescription });
    }
  }

  if (payload.type === "ice") {
    try {
      if (!pc.remoteDescription) { pendingIce.push(payload.candidate); return; }
      await pc.addIceCandidate(new RTCIceCandidate(payload.candidate));
    } catch(e) {
      if (!ignoreOffer) addLog("ICE add error: "+e.message, "#ef4444");
    }
  }

  if (payload.type === "leave") {
    setIndicator("", t("peerLeft"));
    setStatus(t("peerHangup"), "err");
  }
}

async function bcast(payload) {
  if (ch) await ch.send({type:"broadcast", event:"signal", payload});
}

// ===== 视频开关 =====
async function toggleVideo() {
  const btn = document.getElementById("videoBtn");
  const row = document.getElementById("videoRow");
  if (!videoEnabled) {
    try {
      videoStream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode:"user", width:{ideal:640}, height:{ideal:480} }
      });
      document.getElementById("localVideo").srcObject = videoStream;
      if (pc) videoStream.getVideoTracks().forEach(t => pc.addTrack(t, videoStream));
      row.style.display = "flex";
      videoEnabled = true;
      btn.textContent = t("videoOff");
      btn.style.color = "#ef4444";
    } catch(e) { setStatus(t("err")+e.message, "err"); }
  } else {
    if (videoStream) { videoStream.getTracks().forEach(t=>t.stop()); videoStream=null; }
    document.getElementById("localVideo").srcObject = null;
    row.style.display = "none";
    videoEnabled = false;
    btn.textContent = t("videoOn");
    btn.style.color = "#60a5fa";
  }
}

// ===== 主流程 =====
async function joinRoom() {
  myLang = document.getElementById("myLang").value;
  document.getElementById("joinBtn").disabled = true;
  document.getElementById("joinCard").style.display = "none";
  document.getElementById("callSection").classList.add("visible");
  applyUI();
  setStatus(t("connecting"), "info");

  try {
    // 申请麦克风
    localStream = await navigator.mediaDevices.getUserMedia({ audio: true });
    addLog("Mic ready", "#22c55e");
    startVAD(localStream);

    // TURN配置
    await initTurn();

    // Supabase Presence信令
    sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON);
    ch = sb.channel(ROOM, { config:{ broadcast:{self:false}, presence:{key:myId} } });

    ch.on("presence", {event:"sync"}, ()=>{
      const state   = ch.presenceState();
      const members = Object.keys(state).sort();
      addLog("Room members: "+members.join(","), "#60a5fa");

      if (members.length > 2) { setStatus(t("err")+"Room full", "err"); return; }

      if (members.length === 2 && !pc) {
        // ID字母序小的是impolite（主动发offer），大的是polite（让步）
        isPolite = myId !== members[0];
        addLog("Role: "+(isPolite?"polite":"impolite")+" id="+myId, "#f59e0b");
        setupPC();
        // 清空pending ICE
        pendingIce.forEach(async c => {
          try { await pc.addIceCandidate(new RTCIceCandidate(c)); } catch {}
        });
        pendingIce = [];
      }
    })
    .on("presence", {event:"join"}, ({key})=>{
      addLog("Joined: "+key, "#22c55e");
      setStatus(t("peerJoined"), "info");
    })
    .on("presence", {event:"leave"}, ({key})=>{
      addLog("Left: "+key, "#ef4444");
      setStatus(t("peerLeft"), "err");
      setIndicator("", t("peerLeft"));
    })
    .on("broadcast", {event:"signal"}, async ({payload})=>{
      if (!pc && payload.type !== "leave") {
        pendingIce.push(payload); // 缓存直到pc准备好
        return;
      }
      await handleSignal(payload);
    })
    .subscribe(async status=>{
      addLog("Channel: "+status, status==="SUBSCRIBED"?"#22c55e":"#60a5fa");
      if (status==="SUBSCRIBED") {
        setStatus(t("waiting"), "info");
        setIndicator("", t("waiting"));
        await ch.track({id:myId, ts:myTs});
      }
    });

  } catch(err) {
    setStatus(t("err")+err.message, "err");
    document.getElementById("joinBtn").disabled = false;
    document.getElementById("joinCard").style.display = "";
    document.getElementById("callSection").classList.remove("visible");
  }
}

function leaveRoom() {
  bcast({type:"leave"}).catch(()=>{});
  cleanup();
  document.getElementById("callSection").classList.remove("visible");
  document.getElementById("joinCard").style.display = "";
  document.getElementById("joinBtn").disabled = false;
  document.getElementById("transcript").textContent = "";
  applyUI();
}

function cleanup() {
  rtcReady=false; makingOffer=false; ignoreOffer=false; pendingIce=[]; transRetryCount=0;
  stopVAD();
  if (ch)          { try { sb?.removeChannel(ch); } catch {} ch=null; sb=null; }
  if (transWs)     { try { transWs.close(); } catch {} transWs=null; }
  if (transPc)     { try { transPc.close(); } catch {} transPc=null; }
  if (pc)          { try { pc.close(); }      catch {} pc=null; }
  stopAudioCapture();
  if (transAudioCtx) { try { transAudioCtx.close(); } catch {} transAudioCtx=null; }
  audioQueue=[]; isPlaying=false; nextStartTime=0; peerMediaStream=null;
  if (localStream) { localStream.getTracks().forEach(t=>t.stop()); localStream=null; }
  if (videoStream) { videoStream.getTracks().forEach(t=>t.stop()); videoStream=null; }
  document.getElementById("remoteAudio").srcObject = null;
  document.getElementById("myTranscript").textContent = "";
  document.getElementById("localVideo").srcObject  = null;
  document.getElementById("remoteVideo").srcObject = null;
  document.getElementById("videoRow").style.display = "none";
  videoEnabled = false;
}

// 预热
window.addEventListener("load", ()=>{
  fetch(SESSION_URL, {method:"OPTIONS", headers:{"Authorization":`Bearer ${SUPABASE_ANON}`}}).catch(()=>{});
});
</script>
