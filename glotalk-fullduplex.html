<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <title>GloTalk</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <style>
    *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
    body{min-height:100dvh;background:#0a0a0a;color:#f0f0f0;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",sans-serif;display:flex;align-items:center;justify-content:center;padding:max(20px,env(safe-area-inset-top)) 20px max(20px,env(safe-area-inset-bottom))}
    .app{width:min(100%,420px);display:flex;flex-direction:column;gap:12px}
    .logo{font-size:30px;font-weight:800;letter-spacing:-1px;color:#fff}
    .logo span{color:#22c55e}
    .tagline{font-size:12px;color:#333;margin-top:2px}
    .status-bar{display:flex;align-items:center;gap:8px;background:#111;border:1px solid #222;border-radius:12px;padding:10px 14px}
    .dot{width:8px;height:8px;border-radius:50%;background:#333;flex-shrink:0;transition:all .3s}
    .dot.green{background:#22c55e;box-shadow:0 0 6px #22c55e88}
    .dot.yellow{background:#f59e0b}
    .dot.red{background:#ef4444}
    .status-text{font-size:13px;color:#888;flex:1}
    .ping{font-size:11px;color:#22c55e}
    .room-card{background:#111;border:1px solid #222;border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
    .room-row{display:flex;align-items:center;gap:8px}
    .room-label{font-size:11px;color:#555;font-weight:600;text-transform:uppercase;width:44px;flex-shrink:0}
    .room-id{flex:1;background:#1a1a1a;border:1px solid #2a2a2a;border-radius:8px;color:#22c55e;font:inherit;font-size:15px;font-weight:700;padding:8px 10px;letter-spacing:2px}
    .room-input{flex:1;background:#1a1a1a;border:1px solid #2a2a2a;border-radius:8px;color:#f0f0f0;font:inherit;font-size:15px;font-weight:700;padding:8px 10px;letter-spacing:2px;outline:none;-webkit-user-select:text;user-select:text}
    .room-input:focus{border-color:#22c55e44}
    .room-input::placeholder{color:#333;font-weight:400;letter-spacing:0}
    .copy-btn{height:36px;padding:0 12px;border:1px solid #2a2a2a;border-radius:8px;background:#1a1a1a;color:#888;font:inherit;font-size:12px;cursor:pointer;white-space:nowrap;flex-shrink:0}
    .copy-btn:active{background:#222}
    .share-link{font-size:11px;color:#444;word-break:break-all;background:#0f0f0f;border-radius:6px;padding:6px 8px;-webkit-user-select:text;user-select:text}
    .lang-card{background:#111;border:1px solid #222;border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
    .lang-row{display:flex;align-items:center;gap:10px}
    .lang-label{font-size:11px;color:#555;font-weight:600;text-transform:uppercase;width:56px;flex-shrink:0}
    select{flex:1;background:#1a1a1a;border:1px solid #2a2a2a;border-radius:8px;color:#f0f0f0;font:inherit;font-size:14px;padding:8px 10px;outline:none;cursor:pointer}
    select option{background:#1a1a1a}
    select:disabled{opacity:.4}
    .subtitle-section{display:none;flex-direction:column;gap:8px}
    .subtitle-section.visible{display:flex}
    .box-wrap{display:flex;flex-direction:column;gap:4px}
    .box-label{font-size:11px;color:#555;font-weight:600;text-transform:uppercase;padding-left:2px}
    .tbox{min-height:80px;max-height:120px;overflow-y:auto;border-radius:12px;padding:12px;font-size:16px;font-weight:600;line-height:1.5;word-break:break-word;white-space:pre-wrap;-webkit-user-select:text;user-select:text}
    .tbox-them{background:#0d1a0f;border:1px solid #1a3320;color:#22c55e}
    .tbox-them:empty::before{content:attr(data-ph);color:#1a3320;font-size:13px;font-weight:400}
    .tbox-me{background:#0f0f1a;border:1px solid #1a1a3a;color:#60a5fa}
    .tbox-me:empty::before{content:attr(data-ph);color:#1a1a3a;font-size:13px;font-weight:400}
    .video-row{display:flex;gap:8px}
    .video-wrap{flex:1;display:flex;flex-direction:column;gap:4px;align-items:center}
    .video-wrap span{font-size:11px;color:#555}
    video{width:100%;aspect-ratio:4/3;border-radius:10px;background:#111;object-fit:cover;display:none}
    .quality-bar{display:flex;align-items:center;gap:6px;background:#111;border:1px solid #222;border-radius:8px;padding:6px 10px;font-size:11px;color:#555}
    .qdot{width:6px;height:6px;border-radius:50%;background:#333}
    .qdot.g{background:#22c55e}.qdot.y{background:#f59e0b}.qdot.r{background:#ef4444}
    .timer-bar{display:flex;align-items:center;justify-content:space-between;background:#111;border:1px solid #222;border-radius:8px;padding:6px 12px;font-size:12px}
    .timer-text{color:#555}
    .timer-val{color:#22c55e;font-weight:700;font-variant-numeric:tabular-nums}
    .timer-warn{color:#f59e0b}
    .timer-cost{color:#555;font-size:11px}
    .btn{width:100%;height:60px;border:none;border-radius:14px;font:inherit;font-size:17px;font-weight:800;cursor:pointer;transition:all .15s;touch-action:none}
    .btn:active:not(:disabled){transform:scale(.97)}
    .btn-green{background:#22c55e;color:#000}
    .btn-red{background:#ef4444;color:#fff;box-shadow:0 0 0 4px #ef444422}
    .toolbar{display:flex;gap:8px;flex-wrap:wrap}
    .tool-btn{flex:1;min-width:70px;height:44px;border:1px solid #222;border-radius:10px;background:#111;color:#888;font:inherit;font-size:12px;cursor:pointer;transition:all .15s}
    .tool-btn.active{border-color:#22c55e44;color:#22c55e;background:#0d1a0f}
    .tool-btn:active{transform:scale(.96)}
    .log-wrap{display:none;flex-direction:column;gap:4px}
    .log-wrap.visible{display:flex}
    textarea.log-box{background:#0a0a0a;border:1px solid #1a1a1a;border-radius:8px;padding:8px;font-size:11px;height:200px;resize:none;font-family:monospace;color:#666;outline:none;-webkit-user-select:text;user-select:text;width:100%}
    .toggle-log{width:100%;height:28px;border:none;border-radius:6px;background:#111;color:#333;font-size:11px;cursor:pointer}
    audio{display:none}
  </style>
</head>
<body>
<div class="app">
  <div>
    <div class="logo">Glo<span>Talk</span></div>
    <div class="tagline" id="tagline">实时翻译通话 · 无需VPN · 支持70+语言</div>
  </div>
  <div class="status-bar">
    <div class="dot" id="dot"></div>
    <div class="status-text" id="statusText">选择语言，创建通话</div>
    <div class="ping" id="pingText"></div>
  </div>
  <!-- 房间号由邀请码自动决定，不需要单独输入 -->
  <!-- 邀请码输入框（通话开始前验证）-->
  <div class="room-card" id="inviteCard">
    <div class="room-row">
      <span class="room-label" style="width:56px">邀请码</span>
      <input class="room-input" id="inviteInput" maxlength="9" placeholder="GT-XXXXXX"
        oninput="this.value=this.value.toUpperCase()" style="letter-spacing:2px;font-weight:700;color:#f59e0b"/>
      <button class="copy-btn" id="verifyBtn" onclick="verifyInvite()" style="background:#f59e0b22;border-color:#f59e0b44;color:#f59e0b">验证</button>
    </div>
    <div id="inviteStatus" style="font-size:12px;color:#555;padding:2px 0">请输入邀请码才能开始通话</div>
  </div>

  <div class="lang-card">
    <div class="lang-row">
      <span class="lang-label" id="labelMe">我说</span>
      <select id="myLang" onchange="onLangChange()">
        <option value="zh">🇨🇳 中文</option>
        <option value="en">🇺🇸 英文</option>
        <option value="ja">🇯🇵 日文</option>
        <option value="ko">🇰🇷 韩文</option>
        <option value="es">🇪🇸 西班牙文</option>
        <option value="fr">🇫🇷 法文</option>
        <option value="de">🇩🇪 德文</option>
        <option value="ar">🇸🇦 阿拉伯文</option>
      </select>
    </div>
    <div class="lang-row">
      <span class="lang-label" id="labelThem">对方说</span>
      <select id="theirLang" onchange="onLangChange()">
        <option value="en">🇺🇸 英文</option>
        <option value="zh">🇨🇳 中文</option>
        <option value="ja">🇯🇵 日文</option>
        <option value="ko">🇰🇷 韩文</option>
        <option value="es">🇪🇸 西班牙文</option>
        <option value="fr">🇫🇷 法文</option>
        <option value="de">🇩🇪 德文</option>
        <option value="ar">🇸🇦 阿拉伯文</option>
      </select>
    </div>
  </div>
  <div class="subtitle-section" id="subtitleSection">
    <div class="box-wrap">
      <div class="box-label" id="labelBoxThem">🔊 对方说 → 我听到的翻译</div>
      <div class="tbox tbox-them" id="boxThem" data-ph="对方说话时，翻译显示在这里..."></div>
    </div>
    <div class="box-wrap">
      <div class="box-label" id="labelBoxMe">🎤 我说的话</div>
      <div class="tbox tbox-me" id="boxMe" data-ph="我说话时，原文显示在这里..."></div>
    </div>
  </div>
  <div class="video-row" id="videoRow" style="display:none">
    <div class="video-wrap">
      <span id="labelLocalVideo">我的画面</span>
      <video id="localVideo" autoplay playsinline muted></video>
    </div>
    <div class="video-wrap">
      <span id="labelRemoteVideo">对方画面</span>
      <video id="remoteVideo" autoplay playsinline></video>
    </div>
  </div>
  <div class="quality-bar" id="qualityBar" style="display:none">
    <div class="qdot" id="qdot"></div>
    <span id="qualityText">检测网络中...</span>
  </div>
  <div class="timer-bar" id="timerBar" style="display:none">
    <span class="timer-text" id="timerLabel">通话时长</span>
    <span class="timer-val" id="timerVal">0:00</span>
    <span class="timer-cost" id="timerCost"></span>
  </div>
  <button class="btn btn-green" id="mainBtn" onclick="handleMain()" disabled style="opacity:0.4;cursor:not-allowed">开始通话</button>
  <div class="toolbar" id="toolbar" style="display:none">
    <button class="tool-btn active" id="muteBtn" onclick="toggleMute()">🎤 麦克风</button>
    <button class="tool-btn" id="subtitleBtn" onclick="toggleSubtitle()">💬 字幕</button>
    <button class="tool-btn" id="videoBtn" onclick="toggleVideo()">📷 摄像头</button>
    <button class="tool-btn" id="reconnBtn" onclick="location.reload()">🔄 重连</button>
  </div>
  <div class="log-wrap" id="logWrap">
    <textarea class="log-box" id="logBox" readonly placeholder="调试日志（可复制）..."></textarea>
  </div>
  <button class="toggle-log" onclick="toggleLog()">🔍 调试日志</button>
  <button class="toggle-log" onclick="clearLog()" style="color:#444;margin-top:-8px">🗑️ 清除日志</button>
</div>
<audio id="audioThem" autoplay playsinline></audio>
<script>

// 验证邀请码
async function verifyInvite(){
  const input = document.getElementById("inviteInput");
  const statusEl = document.getElementById("inviteStatus");
  const code = (input?.value||"").trim().toUpperCase();
  if(!code){statusEl.textContent="请输入邀请码";statusEl.style.color="#ef4444";return;}
  statusEl.textContent="验证中...";statusEl.style.color="#f59e0b";
  try{
    const r = await fetch(GLOTALK+"/invite/verify",{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({code})
    });
    const d = await r.json();
    if(d.ok){
      inviteCode = code;
      inviteVerified = true;
      statusEl.textContent="✅ 验证通过，欢迎 "+d.name+"！可以开始通话";
      statusEl.style.color="#22c55e";
      document.getElementById("inviteInput").disabled=true;
      document.getElementById("verifyBtn").disabled=true;
      document.getElementById("mainBtn").disabled=false;
      // 验证通过，直接跳转到带邀请码的房间（自动进入）
      if(d.roomId){
        const currentLang = document.getElementById("myLang")?.value || "zh";
        location.href = location.pathname + "?room=" + d.roomId + "&lang=" + currentLang + "&invite=" + code;
      }
      log("✅ 邀请码验证通过: "+code+" 房间:"+d.roomId);
    }else{
      statusEl.textContent="❌ "+(d.error||"验证失败");
      statusEl.style.color="#ef4444";
      inviteVerified=false;
    }
  }catch(e){
    statusEl.textContent="❌ 网络错误，请重试";
    statusEl.style.color="#ef4444";
  }
}

// ═══════════════════════════════════════════════════════════
// 关闭session（正确止血）
// 步骤：DataChannel发session.close → 等session.closed（最多2秒）→ 关闭PC → 通知服务器
// ═══════════════════════════════════════════════════════════
async function closeSession(tPc,sessionId){
  if(!tPc)return;
  // 找DataChannel
  const channels=tPc.getDataChannels?.()??[];
  // 尝试通过已知dc发送
  try{
    // 对于翻译session，dc在tPc内部
    if(tPc._dc&&tPc._dc.readyState==="open"){
      tPc._dc.send(JSON.stringify({type:"session.close"}));
      await new Promise(res=>{
        const h=e=>{try{const ev=JSON.parse(e.data);if(ev.type==="session.closed"){tPc._dc.removeEventListener("message",h);res();}}catch{}};
        tPc._dc.addEventListener("message",h);
        setTimeout(res,2000);
      });
    }
  }catch{}
  try{tPc.close();}catch{}
  // 通知服务器
  if(sessionId){
    try{await fetch(GLOTALK+"/session/close",{method:"POST",headers:{"Content-Type":"application/json","X-GloTalk-Token":TOKEN},body:JSON.stringify({session_id:sessionId}),keepalive:true});}
    catch{}
  }
  log("📵 Session关闭: "+(sessionId||"unknown"));
}

// ═══════════════════════════════════════════════════════════
// 建立翻译session
// 参考：OpenAI官方文档 realtime-translation guide
// 双人通话模式：每个方向一个session
// ═══════════════════════════════════════════════════════════
async function buildSession(inputStream,outputLang,onDelta,onDone,audioEl){
  // 1. 从服务器获取client_secret（有防护）
  const sr=await fetch(GLOTALK+"/session",{
    method:"POST",
    headers:{"Content-Type":"application/json","X-GloTalk-Token":TOKEN},
    body:JSON.stringify({outputLanguage:outputLang})
  });
  const sd=await sr.json();
  if(!sr.ok)throw new Error("Session "+sr.status+": "+(sd.error||""));
  const{client_secret,session_id}=sd;
  if(!client_secret)throw new Error("no client_secret");
  log("✅ Session: "+session_id+" →"+outputLang);

  // 2. 建立WebRTC连接
  const ctx=new(window.AudioContext||window.webkitAudioContext)();
  const silent=ctx.createMediaStreamDestination().stream;
  const tPc=new RTCPeerConnection({
    iceServers:[{urls:"stun:stun.l.google.com:19302"},{urls:"stun:stun1.l.google.com:19302"}],
    iceCandidatePoolSize:10
  });

  // 翻译音频输出
  if(audioEl){
    tPc.ontrack=e=>{
      audioEl.srcObject=e.streams[0];
      audioEl.volume=1.0;
      audioEl.play().catch(()=>{});
      log("✅ 翻译音频已连接 →"+outputLang);
    };
  }

  // DataChannel：字幕
  const tDc=tPc.createDataChannel("oai-events");
  tPc._dc=tDc; // 保存引用，用于关闭
  tDc.onmessage=e=>{
    try{
      const ev=JSON.parse(e.data);
      if(ev.type==="session.output_transcript.delta"||ev.type==="response.audio_transcript.delta")
        onDelta&&onDelta(ev.delta||ev.text||"");
      if(ev.type==="session.output_transcript.done"||ev.type==="response.audio_transcript.done")
        onDone&&onDone();
      if(ev.type==="error")log("翻译错误: "+(ev.error?.message||""));
    }catch{}
  };

  // 3. 静音占位流
  silent.getTracks().forEach(tk=>{tk.enabled=false;tPc.addTrack(tk,silent);});

  // 4. 创建offer
  const offer=await tPc.createOffer();
  await tPc.setLocalDescription(offer);

  // 5. SDP握手（通过我们的服务器中继）
  const sdpRes=await fetch(GLOTALK+"/sdp?model=gpt-realtime-translate",{
    method:"POST",
    headers:{"Authorization":"Bearer "+client_secret,"Content-Type":"application/sdp","X-GloTalk-Token":TOKEN},
    body:offer.sdp
  });
  const answerSdp=await sdpRes.text();
  if(!sdpRes.ok)throw new Error("SDP "+sdpRes.status+": "+answerSdp.slice(0,200));

  await tPc.setRemoteDescription({type:"answer",sdp:answerSdp});

  // 6. 等待ICE连接
  await new Promise((resolve,reject)=>{
    const to=setTimeout(()=>reject(new Error("翻译引擎连接超时")),15000);
    const check=()=>{
      const s=tPc?.iceConnectionState;
      if(s==="connected"||s==="completed"){clearTimeout(to);resolve();}
      else if(s==="failed"){clearTimeout(to);reject(new Error("ICE失败"));}
    };
    tPc.oniceconnectionstatechange=check;check();
  });

  // 7. 替换真实音频轨道
  if(inputStream){
    const track=inputStream.getAudioTracks()[0];
    if(track){
      const sender=tPc.getSenders().find(s=>s.track?.kind==="audio");
      if(sender)await sender.replaceTrack(track);
    }
  }

  tPc._sessionId=session_id;
  log("✅ 翻译引擎就绪 →"+outputLang);
  return tPc;
}

// ═══════════════════════════════════════════════════════════
// 核心费用控制逻辑
//
// 规则1：双方P2P连接成功后，各自发 ready 信号
//        双方都收到 ready → 同时启动翻译session → 开始计费
//
// 规则2：任意一方挂断 → 发 peer_hangup 信号
//        对方收到 → 立刻关闭所有翻译session → 停止计费
//
// 规则3：页面进入后台超过5分钟 → 自动挂断 → 通知对方停止计费
// ═══════════════════════════════════════════════════════════
async function startTranslation(){
  if(translationStarted)return;
  translationStarted=true;
  setStatus(t.bothReady,"yellow");
  log("🚀 双方就绪，同时启动翻译（开始计费）");

  const myLang=$("myLang").value;
  const theirLang=$("theirLang").value;

  // 每人只建1个session：对方声音→翻译→我听+上框字幕
  // 下框字幕用本地ASR（免费），费用减半
  if(!theirAudioStream){
    log("❌ 没有对方音频流");
    translationStarted=false;
    return;
  }

  try{
    theirTransPc=await buildSession(
      theirAudioStream, myLang,
      delta=>appendBox($("boxThem"),delta),  // 上框：翻译后文字
      ()=>newlineBox($("boxThem")),
      $("audioThem")                          // 翻译后声音
    );
    theirSessionId=theirTransPc._sessionId;
    log("✅ 翻译session就绪（1个session）");
  }catch(err){
    log("❌ 翻译session失败: "+err.message);
    // 降级：播放对方原始声音
    if(theirAudioStream){
      const ra=document.createElement("audio");
      ra.autoplay=true;ra.srcObject=theirAudioStream;
      document.body.appendChild(ra);
    }
  }

  startASR(); // 下框字幕用本地ASR（免费）
  setStatus(t.active,"green");
  startTimer(); // 翻译启动后才开始计时
}

async function stopTranslation(reason){
  if(!translationStarted)return;
  translationStarted=false;
  stopTimer();stopASR();
  log("📵 停止翻译: "+reason);
  await Promise.allSettled([
    closeSession(theirTransPc,theirSessionId),
    closeSession(myTransPc,mySessionId)
  ]);
  theirTransPc=myTransPc=null;
  theirSessionId=mySessionId=null;
  log("✅ 翻译session已关闭，停止计费");
}

// ═══════════════════════════════════════════════════════════
// P2P连接
// ═══════════════════════════════════════════════════════════
async function createP2P(){
  try{
    localStream=await navigator.mediaDevices.getUserMedia({
      audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true},
      video:false
    });
    log("✅ 麦克风已获取");
  }catch(e){log("⚠️ 麦克风: "+e.message);}

  p2pPc=new RTCPeerConnection(rtcCfg);
  if(localStream)localStream.getTracks().forEach(tk=>p2pPc.addTrack(tk,localStream));

  let remoteStream=new MediaStream();
  p2pPc.ontrack=async e=>{
    log("收到对方轨道: "+e.track.kind);
    if(e.track.kind==="video"){
      remoteStream.addTrack(e.track);
      $("remoteVideo").srcObject=remoteStream;
      $("remoteVideo").style.display="block";
      return;
    }
    if(e.track.kind==="audio"){
      // 保存对方音频流，等双方都ready才启动翻译
      theirAudioStream=new MediaStream([e.track]);
      log("对方音频已接收，等待双方就绪...");
      // 如果双方都已ready（可能对方先发了ready），立刻检查
      checkBothReady();
    }
  };

  p2pPc.onicecandidate=async e=>{if(e.candidate)await bcast({type:"ice",candidate:e.candidate.toJSON()});};
  p2pPc.oniceconnectionstatechange=()=>{
    const s=p2pPc.iceConnectionState;
    log("P2P ICE: "+s);
    if(s==="connected"||s==="completed"){clearTimeout(relayTimer);setStatus(t.p2pOk,"yellow");}
    if(s==="failed"&&!usedRelay){
      usedRelay=true;
      try{p2pPc.setConfiguration({...rtcCfg,iceTransportPolicy:"relay"});}catch{}
      p2pPc.restartIce();
    }
    if(s==="disconnected"){
      setTimeout(()=>{if(p2pPc?.iceConnectionState==="disconnected")p2pPc.restartIce();},2000);
    }
  };
  relayTimer=setTimeout(()=>{
    if(!usedRelay&&p2pPc?.iceConnectionState!=="connected"&&p2pPc?.iceConnectionState!=="completed"){
      usedRelay=true;
      try{p2pPc.setConfiguration({...rtcCfg,iceTransportPolicy:"relay"});}catch{}
      p2pPc.restartIce();
    }
  },15000);
}

// DataChannel：双方就绪协议
function setupDC(d){
  dc=d;
  dc.onopen=()=>{
    log("✅ DataChannel开启");
    iAmReady=true;
    dc.send(JSON.stringify({type:"ready"}));
    log("→ 发送 ready 信号");
    checkBothReady();
    setInterval(()=>{if(dc?.readyState==="open"){pingStart=Date.now();dc.send(JSON.stringify({type:"ping",t:pingStart}));}},3000);
  };
  dc.onclose=()=>{log("DataChannel关闭");};
  dc.onmessage=async e=>{
    try{
      const d=JSON.parse(e.data);
      if(d.type==="ping"){dc.send(JSON.stringify({type:"pong",t:d.t}));return;}
      if(d.type==="pong"){const ms=Date.now()-d.t;$("pingText").textContent=ms+"ms";updateQuality(ms);return;}

      // 对方已就绪
      if(d.type==="ready"){
        log("← 收到对方 ready");
        peerReady=true;
        checkBothReady();
        return;
      }

      // 对方挂断 → 立刻停止计费
      if(d.type==="peer_hangup"){
        log("← 收到对方挂断，停止计费");
        await stopTranslation("对方挂断");
        iAmReady=false;peerReady=false;
        setStatus(t.peerHangup,"red");
        return;
      }
    }catch{}
  };
}

// 检查双方是否都就绪
function checkBothReady(){
  // 需要：双方DC就绪 + 对方音频已到达 + 本地麦克风已获取
  if(iAmReady&&peerReady&&theirAudioStream&&localStream&&!translationStarted){
    log("✅ 双方均已就绪，启动翻译");
    startTranslation();
  }
}

// ═══════════════════════════════════════════════════════════
// ICE管理
// ═══════════════════════════════════════════════════════════
async function addIce(c){
  if(!p2pPc)return;
  if(!p2pPc.remoteDescription){pendingIce.push(c);return;}
  try{await p2pPc.addIceCandidate(new RTCIceCandidate(c));}catch{}
}
async function flushIce(){
  while(pendingIce.length){
    try{await p2pPc.addIceCandidate(new RTCIceCandidate(pendingIce.shift()));}catch{}
  }
}

// ═══════════════════════════════════════════════════════════
// Supabase信令
// ═══════════════════════════════════════════════════════════
async function bcast(payload){if(ch)await ch.send({type:"broadcast",event:"signal",payload});}
async function onSignal(payload){
  if(payload.type==="offer"){
    if(!p2pPc)await createP2P();
    p2pPc.ondatachannel=e=>setupDC(e.channel);
    await p2pPc.setRemoteDescription({type:"offer",sdp:payload.sdp});
    await flushIce();
    const ans=await p2pPc.createAnswer();
    await p2pPc.setLocalDescription(ans);
    await bcast({type:"answer",sdp:p2pPc.localDescription.sdp});
    log("answer已发送");
  }
  if(payload.type==="answer"){
    await p2pPc.setRemoteDescription({type:"answer",sdp:payload.sdp});
    await flushIce();
    log("answer已接收");
  }
  if(payload.type==="ice")await addIce(payload.candidate);
}

// ═══════════════════════════════════════════════════════════
// 主流程
// ═══════════════════════════════════════════════════════════
async function startCall(){
  // 检查邀请码
  if(!inviteVerified){
    const statusEl=document.getElementById("inviteStatus");
    if(statusEl){statusEl.textContent="❌ 请先验证邀请码";statusEl.style.color="#ef4444";}
    return;
  }
  // 标记邀请码已使用（一次性）
  if(inviteCode){
    fetch(GLOTALK+"/invite/use",{method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({code:inviteCode})}).catch(()=>{});
  }
  // 房间信令频道 = 邀请码前缀 + 2位房间号（确保唯一）
  const CALL_ROOM = ROOM_CHANNEL;
  callActive=true;translationStarted=false;iAmReady=false;peerReady=false;
  theirAudioStream=null;
  $("mainBtn").className="btn btn-red";$("mainBtn").textContent=t.btnHangup;
  $("toolbar").style.display="flex";
  $("myLang").disabled=true;$("theirLang").disabled=true;
  $("boxThem").textContent="";$("boxMe").textContent="";
  setStatus(t.connecting,"yellow");
  log("【GloTalk v5 · 邀请码+房间号架构】ID:"+myId+" 频道:"+CALL_ROOM);
  await requestWakeLock(); // 通话开始，防止熄屏

  await initTurn();

  sb=window.supabase.createClient(SB_URL,SB_ANON);
  ch=sb.channel(CALL_ROOM,{config:{broadcast:{self:false},presence:{key:myId}}});

  ch.on("presence",{event:"sync"},async()=>{
    const members=Object.keys(ch.presenceState()).sort();
    log("成员: "+members.join(", "));
    if(members.length>2){setStatus(t.full,"red");return;}
    if(members.length>=2&&!p2pPc){
      const isCaller=members[0]===myId;
      log(isCaller?"角色：发起方":"角色：接收方");
      if(isCaller){
        await createP2P();
        const d=p2pPc.createDataChannel("chat");
        setupDC(d);
        const offer=await p2pPc.createOffer();
        await p2pPc.setLocalDescription(offer);
        await bcast({type:"offer",sdp:p2pPc.localDescription.sdp});
        log("offer已发送");
      }else{
        await createP2P();
        p2pPc.ondatachannel=e=>setupDC(e.channel);
      }
    }
  })
  .on("presence",{event:"join"},({key})=>{log("加入: "+key);setStatus(t.connecting,"yellow");})
  .on("presence",{event:"leave"},({key})=>{
    log("离开: "+key);
    if(translationStarted)stopTranslation("对方离开");
    setStatus(t.peerHangup,"red");
    iAmReady=false;peerReady=false;
  })
  .on("broadcast",{event:"signal"},async({payload})=>{await onSignal(payload);})
  .subscribe(async s=>{
    log("信令: "+s);
    if(s==="SUBSCRIBED"){setStatus(t.waiting,"yellow");await ch.track({id:myId,ts:myTs});}
  });
}

// ═══════════════════════════════════════════════════════════
// 挂断
// ═══════════════════════════════════════════════════════════
async function hangup(){
  // 通知对方立刻停止计费
  if(dc?.readyState==="open"){
    try{dc.send(JSON.stringify({type:"peer_hangup"}));log("→ 发送 peer_hangup");}catch{}
    await new Promise(r=>setTimeout(r,300));
  }
  callActive=false;
  clearTimeout(relayTimer);clearTimeout(bgTimer);
  releaseWakeLock(); // 挂断时释放屏幕常亮
  await stopTranslation("我主动挂断");
  try{p2pPc?.close();}catch{}
  p2pPc=null;
  if(localStream){localStream.getTracks().forEach(tk=>tk.stop());localStream=null;}
  theirAudioStream=null;iAmReady=false;peerReady=false;
  if(ch){ch.unsubscribe();ch=null;}
  $("mainBtn").className="btn btn-green";$("mainBtn").textContent=t.btnStart;
  $("toolbar").style.display="none";$("qualityBar").style.display="none";
  $("myLang").disabled=false;$("theirLang").disabled=false;
  setStatus(t.ended,"");
  log("通话已结束");
}
function handleMain(){if(callActive)hangup();else startCall();}

// ═══════════════════════════════════════════════════════════
// 后台超时保护（5分钟自动挂断，防止后台计费）
// ═══════════════════════════════════════════════════════════
document.addEventListener("visibilitychange",()=>{
  if(document.hidden&&callActive){
    log("⚠️ 进入后台，2分钟后自动挂断");
    bgTimer=setTimeout(()=>{
      if(callActive&&document.hidden){
        log("⏰ 后台超时，自动挂断");
        setStatus(t.bgTimeout,"red");
        hangup();
      }
    },BG_TIMEOUT);
  }else{
    if(bgTimer){clearTimeout(bgTimer);bgTimer=null;log("✅ 回到前台，取消后台超时");}
  }
});

// ═══════════════════════════════════════════════════════════
// 页面关闭时紧急关闭session
// ═══════════════════════════════════════════════════════════
window.addEventListener("beforeunload",()=>{
  if(dc?.readyState==="open")try{dc.send(JSON.stringify({type:"peer_hangup"}));}catch{}
  if(theirSessionId)fetch(GLOTALK+"/session/close",{method:"POST",headers:{"Content-Type":"application/json","X-GloTalk-Token":TOKEN},body:JSON.stringify({session_id:theirSessionId}),keepalive:true}).catch(()=>{});
  try{theirTransPc?.close();}catch{}
  try{p2pPc?.close();}catch{}
});

// ═══════════════════════════════════════════════════════════
// 工具栏
// ═══════════════════════════════════════════════════════════
function toggleMute(){
  muted=!muted;
  if(localStream)localStream.getAudioTracks().forEach(tk=>tk.enabled=!muted);
  if(muted)stopASR();else if(callActive&&translationStarted)startASR();
  $("muteBtn").textContent=muted?t.btnMicOff:t.btnMic;
  $("muteBtn").className="tool-btn"+(muted?"":" active");
}
function toggleSubtitle(){
  subtitleOn=!subtitleOn;
  const el=$("subtitleSection");
  el.style.display=subtitleOn?"flex":"none";
  $("subtitleBtn").textContent=subtitleOn?t.btnSubOn:t.btnSub;
  $("subtitleBtn").className="tool-btn"+(subtitleOn?" active":"");
  if(!subtitleOn){$("boxThem").textContent="";$("boxMe").textContent="";}
}
async function toggleVideo(){
  videoOn=!videoOn;
  $("videoBtn").textContent=videoOn?t.btnCamOn:t.btnCam;
  $("videoBtn").className="tool-btn"+(videoOn?" active":"");
  $("videoRow").style.display=videoOn?"flex":"none";
  if(videoOn&&localStream){
    try{
      const vs=await navigator.mediaDevices.getUserMedia({video:{facingMode:"user",width:{ideal:640},height:{ideal:480}}});
      const vt=vs.getVideoTracks()[0];
      localStream.addTrack(vt);
      $("localVideo").style.display="block";
      $("localVideo").srcObject=localStream;
      if(p2pPc)p2pPc.addTrack(vt,localStream);
      log("✅ 摄像头已开启");
    }catch(e){log("摄像头失败: "+e.message);videoOn=false;}
  }else if(!videoOn&&localStream){
    localStream.getVideoTracks().forEach(tk=>{tk.stop();localStream.removeTrack(tk);});
    $("localVideo").style.display="none";
  }
}

// ═══ 屏幕常亮（防止熄屏进入后台）═══
async function requestWakeLock(){
  try{
    if("wakeLock" in navigator){
      wakeLock=await navigator.wakeLock.request("screen");
      log("✅ 屏幕常亮已开启");
      // 页面重新可见时重新请求（系统可能释放了锁）
      document.addEventListener("visibilitychange",async()=>{
        if(wakeLock!==null&&document.visibilityState==="visible"&&callActive){
          try{wakeLock=await navigator.wakeLock.request("screen");log("✅ 屏幕常亮已恢复");}catch{}
        }
      },{once:false});
    }
  }catch(e){log("⚠️ 屏幕常亮: "+e.message);}
}
function releaseWakeLock(){
  if(wakeLock){wakeLock.release().catch(()=>{});wakeLock=null;log("屏幕常亮已释放");}
}

// ═══ 初始化 ═══
window.addEventListener("load",()=>{
  checkBrowser();
  initRoom();
  // URL带lang参数时自动设置语言
  if(urlLang&&UI[urlLang]){
    const sel=document.getElementById("myLang");
    if(sel)sel.value=urlLang;
  }
  onLangChange();
  // 回车键进入房间
  const ri=document.getElementById("roomInput");
  if(ri) ri.addEventListener("keydown",e=>{if(e.key==="Enter")joinRoom();});
});
</script>
