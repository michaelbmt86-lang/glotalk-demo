<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>GloTalk 全双工翻译通话</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <style>
    * { box-sizing: border-box; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
    body {
      margin: 0; min-height: 100vh; min-height: 100dvh;
      background: #0a0a0a; color: #f0f0f0;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif;
      display: flex; align-items: center; justify-content: center;
      padding: max(20px, env(safe-area-inset-top)) 20px max(20px, env(safe-area-inset-bottom));
    }
    .app { width: min(100%, 400px); display: flex; flex-direction: column; gap: 16px; }
    .logo { font-size: 32px; font-weight: 800; letter-spacing: -1px; color: #fff; }
    .logo span { color: #22c55e; }
    .logo small { font-size: 13px; font-weight: 400; color: #555; display: block; margin-top: 2px; }
    .card { background: #111; border: 1px solid #222; border-radius: 16px; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
    .field { display: flex; flex-direction: column; gap: 6px; }
    .field label { font-size: 12px; color: #555; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; }
    .field input, .field select {
      background: #1a1a1a; border: 1px solid #2a2a2a; border-radius: 10px;
      color: #f0f0f0; font: inherit; font-size: 16px; padding: 12px 14px;
      outline: none; -webkit-user-select: text; user-select: text; transition: border-color 0.2s;
    }
    .field input:focus, .field select:focus { border-color: #22c55e44; }
    .field select option { background: #1a1a1a; }
    .room-row { display: flex; gap: 8px; }
    .room-row input { flex: 1; }
    .gen-btn {
      background: #1a1a1a; border: 1px solid #2a2a2a; border-radius: 10px;
      color: #22c55e; font: inherit; font-size: 13px; font-weight: 700;
      padding: 0 14px; cursor: pointer; white-space: nowrap;
    }
    .join-btn {
      width: 100%; height: 58px; border: none; border-radius: 14px;
      background: #22c55e; color: #000; font: inherit;
      font-size: 17px; font-weight: 800; cursor: pointer; transition: all 0.15s;
    }
    .join-btn:active { transform: scale(0.97); }
    .join-btn:disabled { background: #1a1a1a; color: #444; cursor: wait; }
    .join-btn.danger { background: #ef4444; color: #fff; }

    .transcript-box {
      min-height: 150px; max-height: 200px; overflow-y: auto;
      background: #0d1a0f; border: 1px solid #1a3320; border-radius: 14px; padding: 16px;
      font-size: 19px; font-weight: 600; line-height: 1.4;
      color: #22c55e; word-break: break-word; white-space: pre-wrap;
    }
    .transcript-box:empty::before { content: "译文显示在这里"; color: #1a3320; font-size: 15px; font-weight: 400; }

    /* 说话状态指示器 */
    .speaking-indicator {
      display: flex; align-items: center; gap: 10px;
      background: #111; border: 1px solid #222; border-radius: 12px; padding: 12px 16px;
    }
    .indicator-dot {
      width: 12px; height: 12px; border-radius: 50%; background: #333;
      transition: all 0.2s; flex-shrink: 0;
    }
    .indicator-dot.speaking { background: #22c55e; box-shadow: 0 0 8px #22c55e88; animation: breathe 1s infinite; }
    .indicator-dot.translating { background: #60a5fa; box-shadow: 0 0 8px #60a5fa88; animation: breathe 0.5s infinite; }
    @keyframes breathe { 0%,100%{transform:scale(1)} 50%{transform:scale(1.3)} }
    .indicator-text { font-size: 14px; color: #666; font-weight: 600; }

    .start-btn {
      width: 100%; height: 66px; border: none; border-radius: 14px;
      font: inherit; font-size: 17px; font-weight: 800; cursor: pointer;
      transition: all 0.15s;
    }
    .start-btn.idle    { background: #22c55e; color: #000; }
    .start-btn.active  { background: #ef4444; color: #fff; }
    .start-btn.connecting { background: #1a1a1a; color: #555; cursor: wait; }

    .status { font-size: 13px; color: #444; text-align: center; min-height: 18px; }
    .status.ok    { color: #22c55e; }
    .status.error { color: #ef4444; }
    .status.info  { color: #60a5fa; }

    .room-info { font-size: 13px; color: #555; text-align: center; }
    .room-info strong { color: #f0f0f0; }

    .hint { font-size: 11px; color: #333; text-align: center; line-height: 1.5; }
    .call-section { display: none; flex-direction: column; gap: 12px; }
    .call-section.visible { display: flex; }

    /* VAD音量可视化 */
    .vad-bar {
      height: 4px; background: #1a1a1a; border-radius: 2px; overflow: hidden;
    }
    .vad-fill {
      height: 100%; background: #22c55e; border-radius: 2px;
      transition: width 0.1s; width: 0%;
    }
  </style>
</head>
<body>
<div class="app">
  <div class="logo">Glo<span>Talk</span><small>全双工实时翻译通话 · Beta</small></div>

  <!-- 加入房间 -->
  <div class="card" id="joinCard">
    <div class="field">
      <label>房间号（双方填同一个）</label>
      <div class="room-row">
        <input type="text" id="roomInput" placeholder="例如：123456"
          maxlength="6" inputmode="numeric" pattern="[0-9]*" />
        <button class="gen-btn" onclick="generateRoom()">随机生成</button>
      </div>
    </div>
    <div class="field">
      <label>我说的语言</label>
      <select id="inputLangSelect">
        <option value="zh">🇨🇳 中文</option>
        <option value="en">🇺🇸 英文</option>
        <option value="ja">🇯🇵 日文</option>
        <option value="ko">🇰🇷 韩文</option>
        <option value="es">🇪🇸 西班牙文</option>
        <option value="fr">🇫🇷 法文</option>
        <option value="de">🇩🇪 德文</option>
      </select>
    </div>
    <div class="field">
      <label>我要听的语言（翻译输出）</label>
      <select id="langSelect">
        <option value="en">🇺🇸 英文</option>
        <option value="zh">🇨🇳 中文</option>
        <option value="ja">🇯🇵 日文</option>
        <option value="ko">🇰🇷 韩文</option>
        <option value="es">🇪🇸 西班牙文</option>
        <option value="fr">🇫🇷 法文</option>
        <option value="de">🇩🇪 德文</option>
      </select>
    </div>
    <button class="join-btn" id="joinBtn" onclick="joinRoom()">开始翻译通话</button>
  </div>

  <!-- 通话中 -->
  <div class="call-section" id="callSection">
    <div class="card">
      <div class="room-info">房间号 <strong id="roomDisplay"></strong></div>
      <div id="transcript" class="transcript-box"></div>
      <div class="vad-bar"><div class="vad-fill" id="vadFill"></div></div>
    </div>

    <!-- 说话状态指示器 -->
    <div class="speaking-indicator">
      <div class="indicator-dot" id="indicatorDot"></div>
      <div class="indicator-text" id="indicatorText">等待连接...</div>
    </div>

    <div id="status" class="status">准备就绪</div>

    <button class="start-btn connecting" id="startBtn" onclick="toggleTranslation()">连接中...</button>
    <button class="join-btn danger" onclick="leaveRoom()" style="height:46px;font-size:15px;">挂断离开</button>
  </div>

  <div class="hint">需要 HTTPS · 全双工模式 · 正常说话即可，无需按键</div>
</div>

<audio id="remoteAudio" autoplay playsinline style="display:none"></audio>

<script>
// ===== 配置 =====
const SUPABASE_URL_SESSION  = "https://ryqxhagdbycccosuavtp.supabase.co/functions/v1/create-realtime-session";
const SUPABASE_URL_TURN     = "https://ryqxhagdbycccosuavtp.supabase.co/functions/v1/create-turn-credentials";
const SUPABASE_ANON = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJ5cXhoYWdkYnljY2Nvc3VhdnRwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk3MDM5MTgsImV4cCI6MjA5NTI3OTkxOH0.lj3PdKLsTU_cNEHjLNqyHSszJtGSU6gPORE5Y_9WNjQ";
const OPENAI_TRANSLATIONS   = "https://api.openai.com/v1/realtime/translations";

// VAD配置
const VAD_THRESHOLD = 0.015;
const VAD_HOLD_MS   = 800;
const VAD_FRAME_MS  = 20;

// ===== 状态 =====
let supabaseChannel = null;
let supabaseClient  = null;
let p2pPc           = null;
let transPc         = null;
let localStream     = null;
let roomName        = "";
let outputLang      = "en";
let inputLang       = "zh";
let isActive        = false;
let rtcReady        = false;
let makingOffer     = false;   // Perfect Negotiation: 防止重入
let ignoreOffer     = false;   // Perfect Negotiation: impolite peer忽略碰撞offer
let isPolite        = false;   // Perfect Negotiation: 角色（用加入时间戳决定）

// VAD状态
let audioCtx    = null;
let analyser    = null;
let vadTimer    = null;
let isSpeaking  = false;
let vadInterval = null;

// ===== UI =====
const joinCard      = document.getElementById("joinCard");
const callSection   = document.getElementById("callSection");
const roomInput     = document.getElementById("roomInput");
const langSelect    = document.getElementById("langSelect");
const joinBtn       = document.getElementById("joinBtn");
const startBtn      = document.getElementById("startBtn");
const statusEl      = document.getElementById("status");
const transcript    = document.getElementById("transcript");
const roomDisplay   = document.getElementById("roomDisplay");
const remoteAudio   = document.getElementById("remoteAudio");
const indicatorDot  = document.getElementById("indicatorDot");
const indicatorText = document.getElementById("indicatorText");
const vadFill       = document.getElementById("vadFill");

function generateRoom() {
  roomInput.value = Math.floor(100000 + Math.random() * 900000).toString();
}

function setStatus(msg, type = "") {
  statusEl.textContent = msg;
  statusEl.className = "status" + (type ? " " + type : "");
}

function setIndicator(state, text) {
  indicatorDot.className = "indicator-dot" + (state ? " " + state : "");
  indicatorText.textContent = text;
}

function appendText(delta) {
  if (!delta) return;
  transcript.textContent += delta;
  transcript.scrollTop = transcript.scrollHeight;
}

function newLine() {
  if (!transcript.textContent) return;
  const lines = transcript.textContent.split("\n");
  transcript.textContent = (lines.length > 6 ? lines.slice(-6) : lines).join("\n") + "\n";
  transcript.scrollTop = transcript.scrollHeight;
}

// ===== 获取TURN凭证 =====
async function getTurnConfig() {
  try {
    const res = await fetch(SUPABASE_URL_TURN, {
      method: "POST",
      headers: { "Authorization": `Bearer ${SUPABASE_ANON}`, "apikey": SUPABASE_ANON, "Content-Type": "application/json" }
    });
    const data = await res.json();
    if (data.iceServers) return { iceServers: data.iceServers, iceCandidatePoolSize: 10 };
  } catch {}
  return {
    iceServers: [
      { urls: "stun:stun.l.google.com:19302" },
      { urls: "stun:stun1.l.google.com:19302" },
      { urls: "stun:stun.cloudflare.com:3478" },
    ],
    iceCandidatePoolSize: 10,
  };
}

// ===== VAD =====
function startVAD(stream) {
  audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  const source = audioCtx.createMediaStreamSource(stream);
  analyser = audioCtx.createAnalyser();
  analyser.fftSize = 512;
  analyser.smoothingTimeConstant = 0.3;
  source.connect(analyser);
  const buffer = new Uint8Array(analyser.frequencyBinCount);

  vadInterval = setInterval(() => {
    if (!analyser) return;
    analyser.getByteFrequencyData(buffer);
    let sum = 0;
    for (let i = 0; i < buffer.length; i++) sum += buffer[i] * buffer[i];
    const rms = Math.sqrt(sum / buffer.length) / 255;
    vadFill.style.width = Math.min(rms * 800, 100) + "%";

    if (rms > VAD_THRESHOLD) {
      clearTimeout(vadTimer);
      if (!isSpeaking) { isSpeaking = true; setIndicator("speaking", "🎤 正在说话..."); }
      vadTimer = setTimeout(() => {
        isSpeaking = false;
        setIndicator("", rtcReady ? "🟢 请说话..." : "等待连接...");
        vadFill.style.width = "0%";
      }, VAD_HOLD_MS);
    }
  }, VAD_FRAME_MS);
}

function stopVAD() {
  clearInterval(vadInterval); clearTimeout(vadTimer);
  vadInterval = null; isSpeaking = false; vadFill.style.width = "0%";
  if (audioCtx) { audioCtx.close().catch(() => {}); audioCtx = null; }
  analyser = null;
}

// ===== PERFECT NEGOTIATION PATTERN（W3C标准，微信/Discord用的就是这套）=====
function setupPerfectNegotiation(pc, channel, polite) {
  // 当需要重新协商时自动发offer
  pc.onnegotiationneeded = async () => {
    try {
      makingOffer = true;
      await pc.setLocalDescription();
      await channel.send({
        type: "broadcast", event: "signal",
        payload: { type: "sdp", description: pc.localDescription }
      });
    } catch (err) {
      setStatus("协商失败: " + err.message, "error");
    } finally {
      makingOffer = false;
    }
  };

  pc.onicecandidate = async ({ candidate }) => {
    if (candidate) {
      await channel.send({
        type: "broadcast", event: "signal",
        payload: { type: "ice", candidate }
      });
    }
  };

  pc.oniceconnectionstatechange = () => {
    setStatus("ICE: " + pc.iceConnectionState, "info");
    if (pc.iceConnectionState === "failed") pc.restartIce();
  };

  pc.onconnectionstatechange = () => {
    setStatus("连接: " + pc.connectionState, "info");
    if (pc.connectionState === "connected") {
      setStatus("🟢 通话已接通，请自然说话", "ok");
      setIndicator("", "🟢 请说话...");
    }
  };

  // 收到对方音频 → 送去翻译
  pc.ontrack = async ({ streams }) => {
    setStatus("✅ 收到对方音频，启动翻译引擎...", "ok");
    await startTranslation(streams[0]);
  };

  // 处理收到的信令消息
  return async (payload) => {
    try {
      if (payload.type === "sdp") {
        const offerCollision = payload.description.type === "offer" &&
          (makingOffer || pc.signalingState !== "stable");

        ignoreOffer = !polite && offerCollision;
        if (ignoreOffer) return; // impolite peer忽略碰撞

        // polite peer回滚自己的offer，接受对方的
        await pc.setRemoteDescription(payload.description);
        if (payload.description.type === "offer") {
          await pc.setLocalDescription();
          await channel.send({
            type: "broadcast", event: "signal",
            payload: { type: "sdp", description: pc.localDescription }
          });
        }
      }

      if (payload.type === "ice" && !ignoreOffer) {
        try {
          await pc.addIceCandidate(payload.candidate);
        } catch (err) {
          if (!ignoreOffer) setStatus("ICE添加失败: " + err.message, "error");
        }
      }
    } catch (err) {
      setStatus("信令处理错误: " + err.message, "error");
    }
  };
}

// ===== Supabase 信令 =====
function connectSignaling(room, rtcConfig) {
  supabaseClient = window.supabase.createClient(
    "https://ryqxhagdbycccosuavtp.supabase.co", SUPABASE_ANON
  );

  // 用加入时间戳决定polite/impolite角色（先加入的是impolite，后加入的是polite）
  const myTimestamp = Date.now();

  supabaseChannel = supabaseClient.channel(`glt-${room}`, {
    config: { broadcast: { self: false }, presence: { key: String(myTimestamp) } }
  });

  // 创建P2P连接并设置Perfect Negotiation
  p2pPc = new RTCPeerConnection(rtcConfig);

  // 添加本机麦克风到P2P连接
  if (localStream) {
    localStream.getTracks().forEach(t => p2pPc.addTrack(t, localStream));
  }

  // 暂时用null，等presence确认角色后再设置
  let handleSignal = null;

  supabaseChannel
    .on("presence", { event: "sync" }, () => {
      const state = supabaseChannel.presenceState();
      const timestamps = Object.keys(state).map(Number).sort();
      if (timestamps.length >= 2) {
        // 先加入的时间戳更小 → impolite（不礼貌，坚持自己）
        // 后加入的时间戳更大 → polite（礼貌，让步）
        isPolite = myTimestamp === Math.max(...timestamps);
        setStatus(`角色: ${isPolite ? "polite(后加入)" : "impolite(先加入)"}`, "info");

        // 设置Perfect Negotiation（只设置一次）
        if (!handleSignal) {
          handleSignal = setupPerfectNegotiation(p2pPc, supabaseChannel, isPolite);
          // polite peer主动触发协商
          if (!isPolite) {
            // impolite peer（先加入的）立刻发offer触发连接
            p2pPc.onnegotiationneeded && p2pPc.onnegotiationneeded();
          }
        }
      }
    })
    .on("broadcast", { event: "signal" }, async ({ payload }) => {
      if (handleSignal) await handleSignal(payload);
      if (payload.type === "leave") {
        setIndicator("", "对方已离开");
        setStatus("对方已挂断", "error");
      }
    })
    .subscribe(async (status) => {
      if (status === "SUBSCRIBED") {
        setStatus("已进入房间，等待对方...", "info");
        await supabaseChannel.track({ ts: myTimestamp });
      }
    });
}

// ===== 翻译引擎（连接OpenAI，翻译对方的声音）=====
async function startTranslation(peerStream) {
  if (transPc) return; // 防止重复启动
  setIndicator("translating", "翻译引擎启动中...");

  try {
    const rtcConfig = await getTurnConfig();
    transPc = new RTCPeerConnection(rtcConfig);

    transPc.ontrack = (e) => {
      const audioEl = remoteAudio;
      if ("suppressLocalAudioPlayback" in audioEl) audioEl.suppressLocalAudioPlayback = true;
      audioEl.srcObject = e.streams[0];
      audioEl.play().catch(() => {});
      setIndicator("", "🟢 全双工翻译就绪，请说话");
      rtcReady = true;
      startBtn.className = "start-btn active";
      startBtn.textContent = "停止翻译";
    };

    // 把对方声音送给OpenAI
    peerStream.getTracks().forEach(t => transPc.addTrack(t, peerStream));

    const tdc = transPc.createDataChannel("oai-events");
    tdc.onmessage = (e) => {
      try {
        const ev = JSON.parse(e.data);
        if (ev.type === "session.output_transcript.delta" || ev.type === "response.audio_transcript.delta") appendText(ev.delta || "");
        if (ev.type === "session.output_transcript.done" || ev.type === "response.audio_transcript.done") newLine();
        if (ev.type === "error") setStatus("翻译错误: " + (ev.error?.message || ""), "error");
      } catch {}
    };

    const [secretRes, offer] = await Promise.all([
      fetch(SUPABASE_URL_SESSION, {
        method: "POST",
        headers: { "Authorization": `Bearer ${SUPABASE_ANON}`, "apikey": SUPABASE_ANON, "Content-Type": "application/json" },
        body: JSON.stringify({ inputLanguage: inputLang, outputLanguage: outputLang })
      }),
      transPc.createOffer().then(o => { transPc.setLocalDescription(o); return o; })
    ]);

    const secretText = await secretRes.text();
    if (!secretRes.ok) throw new Error("密钥获取失败: " + secretText);
    const { client_secret } = JSON.parse(secretText);
    if (!client_secret) throw new Error("没有收到client_secret");

    const sdpRes = await fetch(
      `${OPENAI_TRANSLATIONS}?model=gpt-realtime-translate`,
      { method: "POST", headers: { "Authorization": `Bearer ${client_secret}`, "Content-Type": "application/sdp" }, body: offer.sdp }
    );
    const answerSdp = await sdpRes.text();
    if (!sdpRes.ok) throw new Error("OpenAI握手失败: " + sdpRes.status + " " + answerSdp);
    await transPc.setRemoteDescription({ type: "answer", sdp: answerSdp });

    await new Promise((resolve, reject) => {
      const timeout = setTimeout(() => reject(new Error("翻译连接超时")), 12000);
      const check = () => {
        const s = transPc?.iceConnectionState;
        if (s === "connected" || s === "completed") { clearTimeout(timeout); resolve(); }
        if (s === "failed") { clearTimeout(timeout); reject(new Error("翻译ICE失败")); }
      };
      transPc.oniceconnectionstatechange = check;
      check();
    });

  } catch (err) {
    transPc = null;
    setStatus("翻译引擎失败: " + err.message, "error");
    setIndicator("", "翻译连接失败");
  }
}

// ===== 开始/停止 =====
async function toggleTranslation() {
  if (isActive) stopTranslation(); else await beginTranslation();
}

async function beginTranslation() {
  startBtn.className = "start-btn connecting";
  startBtn.textContent = "连接中...";
  startBtn.disabled = true;
  isActive = true;

  try {
    // 步骤1：申请麦克风
    setStatus("申请麦克风权限...", "info");
    // Safari iOS对约束非常严格，只用最基本的audio:true
    // sampleRate等高级约束在Safari上会触发OverconstrainedError
    try {
      localStream = await navigator.mediaDevices.getUserMedia({
        audio: {
          echoCancellation: true,
          noiseSuppression: true,
          autoGainControl: true,
        }
      });
    } catch (e1) {
      // 如果上面失败，用最简单的约束重试
      setStatus("重试麦克风...", "info");
      localStream = await navigator.mediaDevices.getUserMedia({ audio: true });
    }
    setStatus("麦克风已获取", "ok");

    // 步骤2：启动VAD
    startVAD(localStream);
    setIndicator("", "等待对方加入...");

    // 步骤3：获取TURN配置
    setStatus("获取网络配置...", "info");
    let rtcConfig;
    try {
      rtcConfig = await getTurnConfig();
      setStatus("网络配置完成", "ok");
    } catch(e) {
      rtcConfig = {
        iceServers: [{ urls: "stun:stun.l.google.com:19302" }],
        iceCandidatePoolSize: 10
      };
      setStatus("使用备用网络配置", "info");
    }

    // 步骤4：连接信令
    setStatus("连接信令服务...", "info");
    connectSignaling(roomName, rtcConfig);
    startBtn.disabled = false;

  } catch (err) {
    isActive = false;
    startBtn.className = "start-btn idle";
    startBtn.textContent = "开始翻译通话";
    startBtn.disabled = false;
    setStatus("错误: " + (err.message || String(err)), "error");
    console.error("beginTranslation error:", err);
  }
}

function stopTranslation() {
  isActive = false; rtcReady = false;
  stopVAD();
  if (supabaseChannel) {
    try { supabaseChannel.send({ type: "broadcast", event: "signal", payload: { type: "leave" } }); } catch {}
    try { supabaseClient.removeChannel(supabaseChannel); } catch {}
    supabaseChannel = null; supabaseClient = null;
  }
  if (transPc) { try { transPc.close(); } catch {} transPc = null; }
  if (p2pPc)   { try { p2pPc.close(); }   catch {} p2pPc = null; }
  if (localStream) { localStream.getTracks().forEach(t => t.stop()); localStream = null; }
  remoteAudio.srcObject = null;
  startBtn.className = "start-btn idle";
  startBtn.textContent = "开始翻译通话";
  setIndicator("", "已停止"); setStatus("翻译已停止");
}

// ===== 加入房间 =====
async function joinRoom() {
  const room = roomInput.value.trim();
  if (room.length < 4) { alert("请输入至少4位房间号"); return; }
  outputLang = langSelect.value;
  inputLang  = document.getElementById("inputLangSelect")?.value || "zh";
  roomName = room;
  joinBtn.disabled = true;
  joinCard.style.display = "none";
  callSection.classList.add("visible");
  roomDisplay.textContent = room;
  await beginTranslation();
}

function leaveRoom() {
  stopTranslation();
  callSection.classList.remove("visible");
  joinCard.style.display = "";
  joinBtn.disabled = false;
  transcript.textContent = "";
}

window.addEventListener("load", () => {
  fetch(SUPABASE_URL_SESSION, { method: "OPTIONS", headers: { "Authorization": `Bearer ${SUPABASE_ANON}` } }).catch(() => {});
});
</script>
