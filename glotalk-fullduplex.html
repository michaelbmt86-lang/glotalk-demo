<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>GloTalk – 实时翻译通话</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; -webkit-user-select: none; user-select: none; }
    body {
      min-height: 100dvh;
      background: #0a0a0a;
      color: #f0f0f0;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif;
      display: flex; align-items: center; justify-content: center;
      padding: max(20px, env(safe-area-inset-top)) 20px max(20px, env(safe-area-inset-bottom));
    }
    .app { width: min(100%, 420px); display: flex; flex-direction: column; gap: 14px; }

    /* Logo */
    .logo { font-size: 32px; font-weight: 800; letter-spacing: -1px; color: #fff; }
    .logo span { color: #22c55e; }
    .tagline { font-size: 12px; color: #444; }

    /* 状态栏 */
    .status-bar {
      display: flex; align-items: center; justify-content: space-between;
      background: #111; border: 1px solid #222; border-radius: 12px; padding: 10px 14px;
    }
    .status-dot { width: 8px; height: 8px; border-radius: 50%; background: #333; flex-shrink: 0; }
    .status-dot.green  { background: #22c55e; box-shadow: 0 0 6px #22c55e88; }
    .status-dot.yellow { background: #f59e0b; box-shadow: 0 0 6px #f59e0b88; }
    .status-dot.red    { background: #ef4444; box-shadow: 0 0 6px #ef444488; }
    .status-text { font-size: 13px; color: #888; flex: 1; margin-left: 8px; }
    .ping-text { font-size: 11px; color: #22c55e; }

    /* 语言选择 */
    .lang-card {
      background: #111; border: 1px solid #222; border-radius: 14px; padding: 12px 14px;
      display: flex; flex-direction: column; gap: 8px;
    }
    .lang-row { display: flex; align-items: center; gap: 10px; }
    .lang-label { font-size: 11px; color: #555; font-weight: 600; text-transform: uppercase; width: 60px; flex-shrink: 0; }
    select {
      flex: 1; background: #1a1a1a; border: 1px solid #2a2a2a; border-radius: 8px;
      color: #f0f0f0; font: inherit; font-size: 14px; padding: 8px 10px; outline: none; cursor: pointer;
    }
    select option { background: #1a1a1a; }
    select:disabled { opacity: 0.4; }

    /* 翻译结果 */
    .transcript-section { display: flex; flex-direction: column; gap: 8px; }
    .transcript-label { font-size: 11px; color: #555; font-weight: 600; text-transform: uppercase; padding-left: 4px; }
    .transcript-box {
      min-height: 90px; max-height: 130px; overflow-y: auto;
      background: #0d1a0f; border: 1px solid #1a3320; border-radius: 12px;
      padding: 14px; font-size: 17px; font-weight: 600; color: #22c55e;
      line-height: 1.5; word-break: break-word; white-space: pre-wrap;
    }
    .transcript-box:empty::before { content: attr(data-placeholder); color: #1a3320; font-size: 13px; font-weight: 400; }
    .transcript-box.my-box { background: #0f0f1a; border-color: #1a1a3a; color: #60a5fa; }
    .transcript-box.my-box:empty::before { color: #1a1a3a; }

    /* 视频 */
    .video-row { display: flex; gap: 8px; }
    .video-wrap { flex: 1; display: flex; flex-direction: column; gap: 4px; }
    .video-wrap span { font-size: 11px; color: #555; text-align: center; }
    video { width: 100%; aspect-ratio: 4/3; border-radius: 10px; background: #111; object-fit: cover; display: none; }

    /* 按钮 */
    .btn {
      width: 100%; height: 60px; border: none; border-radius: 14px;
      font: inherit; font-size: 17px; font-weight: 800; cursor: pointer;
      transition: all 0.15s; touch-action: none;
    }
    .btn:active:not(:disabled) { transform: scale(0.97); }
    .btn-green  { background: #22c55e; color: #000; }
    .btn-red    { background: #ef4444; color: #fff; }
    .btn-gray   { background: #1a1a1a; color: #444; cursor: not-allowed; }
    .btn-record { background: #ef4444; color: #fff; box-shadow: 0 0 0 4px #ef444433; }

    /* 工具栏 */
    .toolbar { display: flex; gap: 8px; }
    .tool-btn {
      flex: 1; height: 44px; border: 1px solid #222; border-radius: 10px;
      background: #111; color: #888; font: inherit; font-size: 13px;
      cursor: pointer; transition: all 0.15s;
    }
    .tool-btn.active { border-color: #22c55e44; color: #22c55e; background: #0d1a0f; }
    .tool-btn:active { transform: scale(0.96); }

    /* 日志 */
    .log-box {
      background: #0a0a0a; border: 1px solid #1a1a1a; border-radius: 8px;
      padding: 8px; font-size: 11px; max-height: 150px; overflow-y: auto;
      font-family: monospace; display: none;
    }
    .pulse { display: inline-block; width: 8px; height: 8px; background: #ef4444; border-radius: 50%; margin-right: 6px; animation: pulse 1s infinite; }
    @keyframes pulse { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:.5;transform:scale(.8)} }

    audio { display: none; }
  </style>
</head>

<script>
// ═══════════════════════════════════════════════════════════
// 配置
// ═══════════════════════════════════════════════════════════
const SUPABASE_URL      = "https://ryqxhagdbycccosuavtp.supabase.co";
const SUPABASE_ANON     = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJ5cXhoYWdkYnljY2Nvc3VhdnRwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk3MDM5MTgsImV4cCI6MjA5NTI3OTkxOH0.lj3PdKLsTU_cNEHjLNqyHSszJtGSU6gPORE5Y_9WNjQ";
const SUPABASE_TURN_URL = "https://ryqxhagdbycccosuavtp.supabase.co/functions/v1/create-turn-credentials";
const SESSION_URL       = "https://glotalk.tech/session";  // 我们自己的新加坡服务器
const SDP_URL           = "https://glotalk.tech/sdp";      // SDP中继

const ROOM = "glt-room-" + (new URLSearchParams(location.search).get("room") || "888888");
const myId = "u" + Math.random().toString(36).slice(2, 8);
const myTs = Date.now();

// ═══════════════════════════════════════════════════════════
// 状态
// ═══════════════════════════════════════════════════════════
let rtcConfig = { iceServers: [{ urls: "stun:stun.l.google.com:19302" }], iceTransportPolicy: "all" };
let p2pPc = null, dc = null, sb = null, ch = null;
let localStream = null, pendingIce = [], usedRelay = false, relayTimer = null;

// 翻译引擎（各自独立）
let myTransPc    = null;  // 我说话→翻译成对方语言→通过P2P发给对方
let theirTransPc = null;  // 对方声音→翻译成我的语言→我听到

let muted = false, videoOn = false;
let pingStart = 0;
let callActive = false;

// ═══════════════════════════════════════════════════════════
// UI
// ═══════════════════════════════════════════════════════════
const $ = id => document.getElementById(id);

function setStatus(msg, color = "") {
  $("statusText").textContent = msg;
  const dot = $("statusDot");
  dot.className = "status-dot" + (color ? " " + color : "");
  log(msg, color === "green" ? "#22c55e" : color === "red" ? "#ef4444" : "#60a5fa");
}

function log(msg, color = "#666") {
  const d = document.createElement("div");
  d.style.color = color;
  d.textContent = new Date().toLocaleTimeString() + " " + msg;
  $("logBox").appendChild(d);
  $("logBox").scrollTop = $("logBox").scrollHeight;
}

function toggleLog() {
  const b = $("logBox");
  b.style.display = b.style.display === "block" ? "none" : "block";
}

function appendTranscript(el, text) {
  el.textContent += text;
  el.scrollTop = el.scrollHeight;
}

function newlineTranscript(el) {
  if (el.textContent) el.textContent += "\n";
}

// ═══════════════════════════════════════════════════════════
// TURN 凭证
// ═══════════════════════════════════════════════════════════
async function initTurn() {
  try {
    const r = await fetch(SUPABASE_TURN_URL, {
      method: "POST",
      headers: { "Authorization": `Bearer ${SUPABASE_ANON}`, "apikey": SUPABASE_ANON, "Content-Type": "application/json" }
    });
    const d = await r.json();
    let servers = d.iceServers;
    if (servers && !Array.isArray(servers)) servers = [servers];
    if (servers?.length) {
      const u = servers[0].username   || d.username;
      const c = servers[0].credential || d.credential;
      const extra = (u && c) ? [
        { urls: "turns:turn.cloudflare.com:5349?transport=tcp", username: u, credential: c },
        { urls: "turn:turn.cloudflare.com:3478?transport=tcp",  username: u, credential: c },
        { urls: "turn:turn.cloudflare.com:3478?transport=udp",  username: u, credential: c },
      ] : [];
      rtcConfig = {
        iceServers: [{ urls: "stun:stun.l.google.com:19302" }, ...extra, ...servers],
        iceTransportPolicy: "all"
      };
      log("✅ TURN获取成功 " + rtcConfig.iceServers.length + "个服务器", "#22c55e");
    }
  } catch (e) { log("⚠️ TURN失败: " + e.message, "#f59e0b"); }
}

// ═══════════════════════════════════════════════════════════
// 翻译引擎：WebRTC连接OpenAI
// 参考：index.html 已验证方案
// 通过 glotalk.tech/session + glotalk.tech/sdp 中继（无需VPN）
// ═══════════════════════════════════════════════════════════
async function buildTranslationSession(inputStream, outputLang, onDelta, onDone, audioEl) {
  // 静音占位流
  const ctx  = new (window.AudioContext || window.webkitAudioContext)();
  const dest = ctx.createMediaStreamDestination();
  const silentStream = dest.stream;

  const tPc = new RTCPeerConnection({
    iceServers: [
      { urls: "stun:stun.l.google.com:19302" },
      { urls: "stun:stun1.l.google.com:19302" },
    ],
    iceCandidatePoolSize: 10,
  });

  // 翻译音频输出
  tPc.ontrack = e => {
    if (audioEl) {
      audioEl.srcObject = e.streams[0];
      audioEl.play().catch(() => {});
    }
  };

  // DataChannel接收字幕
  const tDc = tPc.createDataChannel("oai-events");
  tDc.onmessage = e => {
    try {
      const ev = JSON.parse(e.data);
      if (ev.type === "session.output_transcript.delta" || ev.type === "response.audio_transcript.delta") {
        onDelta(ev.delta || "");
      }
      if (ev.type === "session.output_transcript.done" || ev.type === "response.audio_transcript.done") {
        onDone();
      }
      if (ev.type === "error") {
        log("翻译错误: " + (ev.error?.message || ""), "#ef4444");
      }
    } catch {}
  };

  // 先用静音占位流
  silentStream.getTracks().forEach(t => {
    t.enabled = false;
    tPc.addTrack(t, silentStream);
  });

  // 并行：获取client_secret + 生成SDP offer
  const [secretRes, offer] = await Promise.all([
    fetch(SESSION_URL, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ outputLanguage: outputLang })
    }),
    tPc.createOffer().then(o => { tPc.setLocalDescription(o); return o; })
  ]);

  const secretText = await secretRes.text();
  if (!secretRes.ok) throw new Error("Session失败 " + secretRes.status + ": " + secretText);
  const { client_secret } = JSON.parse(secretText);
  if (!client_secret) throw new Error("无client_secret");

  // SDP握手通过我们的服务器中继
  const sdpRes = await fetch(`${SDP_URL}?model=gpt-realtime-translate`, {
    method: "POST",
    headers: {
      "Authorization": `Bearer ${client_secret}`,
      "Content-Type": "application/sdp"
    },
    body: offer.sdp
  });
  const answerSdp = await sdpRes.text();
  if (!sdpRes.ok) throw new Error("SDP握手失败 " + sdpRes.status + ": " + answerSdp);

  await tPc.setRemoteDescription({ type: "answer", sdp: answerSdp });

  // 等ICE连接
  await new Promise((resolve, reject) => {
    const timeout = setTimeout(() => reject(new Error("翻译引擎连接超时")), 15000);
    const check = () => {
      const s = tPc?.iceConnectionState;
      if (s === "connected" || s === "completed") { clearTimeout(timeout); resolve(); }
      else if (s === "failed") { clearTimeout(timeout); reject(new Error("翻译ICE失败")); }
    };
    tPc.oniceconnectionstatechange = check;
    check();
  });

  // 连接成功后，替换成真实音频轨道
  if (inputStream) {
    const realTrack = inputStream.getAudioTracks()[0];
    if (realTrack) {
      const sender = tPc.getSenders().find(s => s.track?.kind === "audio");
      if (sender) await sender.replaceTrack(realTrack);
    }
  }

  log("✅ 翻译引擎连接成功（→" + outputLang + "）", "#22c55e");
  return tPc;
}

// ═══════════════════════════════════════════════════════════
// P2P连接
// ═══════════════════════════════════════════════════════════
async function createP2P() {
  try {
    localStream = await navigator.mediaDevices.getUserMedia({
      audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true },
      video: videoOn ? { facingMode: "user", width: { ideal: 640 }, height: { ideal: 480 } } : false
    });
    log("✅ 麦克风已获取", "#22c55e");
  } catch (e) {
    log("⚠️ 麦克风: " + e.message, "#ef4444");
  }

  p2pPc = new RTCPeerConnection(rtcConfig);

  if (localStream) localStream.getTracks().forEach(t => p2pPc.addTrack(t, localStream));

  // 收到对方音频/视频
  let remoteStream = new MediaStream();
  p2pPc.ontrack = async e => {
    log("收到对方轨道: " + e.track.kind, "#60a5fa");
    remoteStream.addTrack(e.track);

    if (e.track.kind === "audio") {
      // 对方原始声音 → 直接播放（可选静音，看产品决策）
      $("remoteAudio").srcObject = remoteStream;
      $("remoteAudio").volume = 0.2; // 翻译声音已有，原声压低

      // 对方声音 → 送进翻译引擎（翻译成我的语言）
      // 用 MediaStream 包一下对方轨道
      const theirStream = new MediaStream([e.track]);
      const myLang = $("myLang").value;
      try {
        theirTransPc = await buildTranslationSession(
          theirStream,
          myLang,
          delta => appendTranscript($("theirTranscript"), delta),
          ()    => newlineTranscript($("theirTranscript")),
          $("remoteAudio") // 翻译后声音播放到remoteAudio
        );
        setStatus("🟢 通话中（翻译就绪）", "green");
      } catch (err) {
        log("对方翻译引擎失败: " + err.message, "#ef4444");
        setStatus("通话中（翻译引擎错误）", "yellow");
      }
    }

    if (e.track.kind === "video") {
      $("remoteVideo").srcObject = remoteStream;
      $("remoteVideo").style.display = "block";
      $("remoteVideo").play().catch(() => {});
    }
  };

  p2pPc.onicecandidate = async e => {
    if (e.candidate) await bcast({ type: "ice", candidate: e.candidate.toJSON() });
  };

  p2pPc.oniceconnectionstatechange = () => {
    const s = p2pPc.iceConnectionState;
    log("P2P ICE: " + s, s === "connected" || s === "completed" ? "#22c55e" : s === "failed" ? "#ef4444" : "#60a5fa");
    if (s === "connected" || s === "completed") {
      clearTimeout(relayTimer);
      setStatus("🟢 P2P已连接，等待翻译引擎...", "green");
    }
    if (s === "failed" && !usedRelay) {
      usedRelay = true;
      log("切换relay模式...", "#f59e0b");
      try { p2pPc.setConfiguration({ ...rtcConfig, iceTransportPolicy: "relay" }); } catch {}
      p2pPc.restartIce();
    }
    if (s === "disconnected") {
      setTimeout(() => { if (p2pPc?.iceConnectionState === "disconnected") p2pPc.restartIce(); }, 2000);
    }
  };

  // 15秒超时自动切relay
  relayTimer = setTimeout(() => {
    if (!usedRelay && p2pPc?.iceConnectionState !== "connected" && p2pPc?.iceConnectionState !== "completed") {
      usedRelay = true;
      log("15秒超时，切换relay...", "#f59e0b");
      try { p2pPc.setConfiguration({ ...rtcConfig, iceTransportPolicy: "relay" }); } catch {}
      p2pPc.restartIce();
    }
  }, 15000);
}

function setupDC(d) {
  dc = d;
  dc.onopen = () => {
    log("✅ DataChannel开启", "#22c55e");
    // 启动我的翻译引擎（我说话→翻译成对方语言）
    startMyTranslation();
    // ping
    setInterval(() => {
      if (dc?.readyState === "open") { pingStart = Date.now(); dc.send(JSON.stringify({ type: "ping", t: pingStart })); }
    }, 3000);
  };
  dc.onclose  = () => setStatus("连接断开", "red");
  dc.onmessage = e => {
    try {
      const d = JSON.parse(e.data);
      if (d.type === "ping") { dc.send(JSON.stringify({ type: "pong", t: d.t })); return; }
      if (d.type === "pong") { $("pingText").textContent = (Date.now() - d.t) + "ms"; return; }
    } catch {}
  };
}

// 我说话的翻译引擎
async function startMyTranslation() {
  const theirLang = $("theirLang").value;
  if (!localStream) return;
  try {
    myTransPc = await buildTranslationSession(
      localStream,
      theirLang,
      delta => appendTranscript($("myTranscript"), delta),
      ()    => newlineTranscript($("myTranscript")),
      $("myTranslationAudio")
    );
    log("✅ 我的翻译引擎就绪（→" + theirLang + "）", "#22c55e");
  } catch (err) {
    log("我的翻译引擎失败: " + err.message, "#ef4444");
  }
}

// ═══════════════════════════════════════════════════════════
// ICE候选管理
// ═══════════════════════════════════════════════════════════
async function addIce(c) {
  if (!p2pPc) return;
  if (!p2pPc.remoteDescription) { pendingIce.push(c); return; }
  try { await p2pPc.addIceCandidate(new RTCIceCandidate(c)); } catch {}
}
async function flushIce() {
  while (pendingIce.length) {
    try { await p2pPc.addIceCandidate(new RTCIceCandidate(pendingIce.shift())); } catch {}
  }
}

// ═══════════════════════════════════════════════════════════
// 信令（Supabase Presence + Broadcast）
// ═══════════════════════════════════════════════════════════
async function bcast(payload) {
  if (ch) await ch.send({ type: "broadcast", event: "signal", payload });
}

async function onSignal(payload) {
  if (payload.type === "offer") {
    log("收到offer，发answer...", "#22c55e");
    if (!p2pPc) await createP2P();
    p2pPc.ondatachannel = e => setupDC(e.channel);
    await p2pPc.setRemoteDescription({ type: "offer", sdp: payload.sdp });
    await flushIce();
    const ans = await p2pPc.createAnswer();
    await p2pPc.setLocalDescription(ans);
    await bcast({ type: "answer", sdp: p2pPc.localDescription.sdp });
  }
  if (payload.type === "answer") {
    log("收到answer！", "#22c55e");
    await p2pPc.setRemoteDescription({ type: "answer", sdp: payload.sdp });
    await flushIce();
  }
  if (payload.type === "ice") await addIce(payload.candidate);
}

// ═══════════════════════════════════════════════════════════
// 主流程
// ═══════════════════════════════════════════════════════════
async function startCall() {
  callActive = true;
  $("mainBtn").className = "btn btn-red";
  $("mainBtn").textContent = "挂断";
  $("toolbar").style.display = "flex";
  $("myLang").disabled  = true;
  $("theirLang").disabled = true;

  setStatus("正在连接...", "yellow");
  log("我的ID: " + myId + " 房间: " + ROOM, "#60a5fa");

  await initTurn();

  sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON);
  ch = sb.channel(ROOM, {
    config: {
      broadcast: { self: false },
      presence:  { key: myId }
    }
  });

  ch.on("presence", { event: "sync" }, async () => {
    const state   = ch.presenceState();
    const members = Object.keys(state).sort();
    log("房间成员: " + members.join(", "), "#60a5fa");

    if (members.length > 2) {
      setStatus("房间已满（最多2人）", "red");
      return;
    }

    if (members.length >= 2 && !p2pPc) {
      const isCaller = members[0] === myId;
      log(isCaller ? "我发offer" : "等待offer", "#60a5fa");

      if (isCaller) {
        await createP2P();
        const d = p2pPc.createDataChannel("chat");
        setupDC(d);
        const offer = await p2pPc.createOffer();
        await p2pPc.setLocalDescription(offer);
        await bcast({ type: "offer", sdp: p2pPc.localDescription.sdp });
      } else {
        await createP2P();
        p2pPc.ondatachannel = e => setupDC(e.channel);
      }
    }
  })
  .on("presence", { event: "join" }, ({ key }) => {
    log("对方加入: " + key, "#22c55e");
    setStatus("对方已进入，正在连接...", "yellow");
  })
  .on("presence", { event: "leave" }, ({ key }) => {
    log("对方离开: " + key, "#ef4444");
    setStatus("对方已挂断", "red");
  })
  .on("broadcast", { event: "signal" }, async ({ payload }) => {
    await onSignal(payload);
  })
  .subscribe(async s => {
    log("信令: " + s, "#60a5fa");
    if (s === "SUBSCRIBED") {
      setStatus("等待对方进入...", "yellow");
      await ch.track({ id: myId, ts: myTs });
    }
  });
}

function hangup() {
  callActive = false;
  if (relayTimer) clearTimeout(relayTimer);
  [p2pPc, myTransPc, theirTransPc].forEach(pc => { try { pc?.close(); } catch {} });
  p2pPc = myTransPc = theirTransPc = null;
  if (localStream) { localStream.getTracks().forEach(t => t.stop()); localStream = null; }
  if (ch) { ch.unsubscribe(); ch = null; }
  $("mainBtn").className = "btn btn-green";
  $("mainBtn").textContent = "重新通话";
  $("toolbar").style.display = "none";
  $("myLang").disabled = false;
  $("theirLang").disabled = false;
  setStatus("通话已结束", "");
}

function handleMainBtn() {
  if (callActive) hangup();
  else startCall();
}

// ═══════════════════════════════════════════════════════════
// 工具栏
// ═══════════════════════════════════════════════════════════
function toggleMute() {
  muted = !muted;
  if (localStream) localStream.getAudioTracks().forEach(t => t.enabled = !muted);
  $("muteBtn").className = "tool-btn" + (muted ? "" : " active");
  $("muteBtn").textContent = muted ? "🔇 已静音" : "🎤 麦克风";
}

async function toggleVideo() {
  videoOn = !videoOn;
  $("videoBtn").className = "tool-btn" + (videoOn ? " active" : "");
  $("videoBtn").textContent = videoOn ? "📷 摄像头开" : "📷 摄像头";
  $("videoRow").style.display = videoOn ? "flex" : "none";

  if (videoOn && localStream) {
    try {
      const vs = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: "user", width: { ideal: 640 }, height: { ideal: 480 } }
      });
      const vt = vs.getVideoTracks()[0];
      localStream.addTrack(vt);
      $("localVideo").style.display = "block";
      $("localVideo").srcObject = localStream;
      if (p2pPc) p2pPc.addTrack(vt, localStream);
    } catch (e) { log("摄像头失败: " + e.message, "#ef4444"); videoOn = false; }
  } else if (!videoOn && localStream) {
    localStream.getVideoTracks().forEach(t => { t.stop(); localStream.removeTrack(t); });
    $("localVideo").style.display = "none";
  }
}

// 例如：https://glotalk.tech/?room=abc123

  const room = new URLSearchParams(location.search).get("room");
  if (room) {
    log("房间号: " + room, "#60a5fa");
  }
  setStatus("选择语言，点击开始通话", "");
});
