
<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>GloTalk</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; margin: 0; padding: 0; }
    body { min-height: 100dvh; background: #0a0a0a; color: #f0f0f0; font-family: -apple-system, BlinkMacSystemFont, sans-serif; display: flex; align-items: center; justify-content: center; padding: max(20px,env(safe-area-inset-top)) 20px max(20px,env(safe-area-inset-bottom)); }
    .app { width: min(100%,420px); display: flex; flex-direction: column; gap: 14px; }
    .logo { font-size: 28px; font-weight: 800; color: #fff; }
    .logo span { color: #22c55e; }
    .logo small { font-size: 12px; font-weight: 400; color: #555; display: block; margin-top: 2px; }
    .card { background: #111; border: 1px solid #222; border-radius: 16px; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
    .field { display: flex; flex-direction: column; gap: 5px; }
    .field label { font-size: 11px; color: #555; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; }
    .field select { background: #1a1a1a; border: 1px solid #2a2a2a; border-radius: 10px; color: #f0f0f0; font: inherit; font-size: 15px; padding: 11px 14px; outline: none; }
    .btn { width: 100%; border: none; border-radius: 12px; font: inherit; font-weight: 800; cursor: pointer; -webkit-user-select: none; user-select: none; }
    .btn-green { background: #22c55e; color: #000; height: 54px; font-size: 17px; }
    .btn-red   { background: #ef4444; color: #fff; height: 44px; font-size: 15px; }
    .btn-dark  { background: #1a1a1a; color: #60a5fa; border: 1px solid #2a2a2a; height: 40px; font-size: 13px; }
    .btn:disabled { background: #1a1a1a; color: #444; cursor: wait; }
    .tbox { min-height: 80px; max-height: 120px; overflow-y: auto; background: #0d1a0f; border: 1px solid #1a3320; border-radius: 12px; padding: 12px; font-size: 17px; font-weight: 600; color: #22c55e; line-height: 1.4; word-break: break-word; white-space: pre-wrap; }
    .tbox.blue { background: #0d0f1a; border-color: #1a2033; color: #60a5fa; min-height: 50px; max-height: 70px; font-size: 14px; }
    .tlabel { font-size: 11px; color: #444; margin-bottom: 2px; }
    .vad-bar { height: 3px; background: #1a1a1a; border-radius: 2px; overflow: hidden; }
    .vad-fill { height: 100%; background: #22c55e; border-radius: 2px; transition: width 0.1s; width: 0%; }
    .ind { display: flex; align-items: center; gap: 8px; background: #111; border: 1px solid #222; border-radius: 10px; padding: 10px 14px; }
    .dot { width: 10px; height: 10px; border-radius: 50%; background: #333; flex-shrink: 0; }
    .dot.s { background: #22c55e; animation: pulse 1s infinite; }
    .dot.t { background: #60a5fa; animation: pulse 0.5s infinite; }
    @keyframes pulse { 0%,100%{transform:scale(1)} 50%{transform:scale(1.3)} }
    .ind-text { font-size: 13px; color: #666; font-weight: 600; }

<body>

  <div class="hint" id="hintText"></div>

</div>

<audio id="remoteAudio" autoplay playsinline style="display:none"></audio>

<script>
// ===== 多语言UI =====
const UI = {
  zh: {

    join:"开始翻译通话", hangup:"挂断离开",
    myV:"我的画面", theirV:"对方画面",
    vidOn:"📹 开启视频", vidOff:"📹 关闭视频",
    tLabel1:"译文（对方→我）↓", tLabel2:"对方原话识别↓",
    waiting:"等待对方加入...", connecting:"建立连接中...",
    p2pOk:"通话接通，翻译启动中...", ready:"🟢 翻译就绪！请说话",
    speaking:"🎤 正在说话...", standby:"🟢 请说话...",
    transStart:"翻译引擎启动中...", transFail:"翻译连接失败",
    peerJoined:"对方已加入！", peerLeft:"对方已离开", peerHangup:"对方已挂断",
    hint:"需要HTTPS · 全双工 · 自然说话",
    tapPlay:"请点击页面任意位置以播放声音",
    transErr:"翻译错误: ", err:"错误: ", roomFull:"房间已满，请稍后重试",
  },
  en: {
    sub:"Full-Duplex Real-Time Translation·Beta", lang:"My Language",
    join:"Start Translation Call", hangup:"Hang Up",
    myV:"My Camera", theirV:"Their Camera",
    vidOn:"📹 Turn On Video", vidOff:"📹 Turn Off Video",
    tLabel1:"Translation (Their→Mine) ↓", tLabel2:"Their Original Speech ↓",
    waiting:"Waiting for other person...", connecting:"Connecting...",
    p2pOk:"Connected, starting translation...", ready:"🟢 Ready! Speak naturally",
    speaking:"🎤 Speaking...", standby:"🟢 Please speak...",
    transStart:"Starting translation engine...", transFail:"Translation failed",
    peerJoined:"Other person joined!", peerLeft:"Other person left", peerHangup:"Other person hung up",
    hint:"Requires HTTPS · Full-duplex · Speak naturally",
    tapPlay:"Tap anywhere to enable audio",
    transErr:"Translation error: ", err:"Error: ", roomFull:"Room is full, please try later",
  }
};

let myLang = "zh";
const t = k => UI[myLang][k] || k;

function applyUI() {
  document.documentElement.lang = myLang;
  $("logoSub").textContent  = t("sub");
  $("langLabel").textContent= t("lang");
  $("joinBtn").textContent  = t("join");

  $("myVL").textContent     = t("myV");
  $("theirVL").textContent  = t("theirV");
  $("vidBtn").textContent   = t("vidOn");
  $("indText").textContent  = t("waiting");
  $("hintText").textContent = t("hint");
  $("tLabel1").textContent  = t("tLabel1");
  $("tLabel2").textContent  = t("tLabel2");
}

function onLangChange() { myLang = $("myLang").value; applyUI(); }
function $(id) { return document.getElementById(id); }
applyUI();

// ===== 配置 =====
const SUPABASE_URL  = "https://ryqxhagdbycccosuavtp.supabase.co";
const SUPABASE_ANON = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJ5cXhoYWdkYnljY2Nvc3VhdnRwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk3MDM5MTgsImV4cCI6MjA5NTI3OTkxOH0.lj3PdKLsTU_cNEHjLNqyHSszJtGSU6gPORE5Y_9WNjQ";
const TURN_URL      = "https://ryqxhagdbycccosuavtp.supabase.co/functions/v1/create-turn-credentials";
const SESSION_URL   = "https://ryqxhagdbycccosuavtp.supabase.co/functions/v1/create-realtime-session";
const OPENAI_TRANS = "https://white.michaelbmt86.workers.dev/openai/v1/realtime/translations";
const ROOM = "glt-fd-888888";
const myId = "dev" + Math.floor(Math.random()*9000+1000);
const myTs = Date.now();

// ===== 状态 =====
let rtcConfig = { iceServers:[{urls:"stun:stun.l.google.com:19302"}], iceTransportPolicy:"all" };
let sb=null, ch=null;
let pc=null;           // P2P连接
let transPc=null;      // 翻译引擎连接
let localStream=null, videoStream=null, peerMediaStream=null;
let videoEnabled=false, rtcReady=false;
let makingOffer=false, ignoreOffer=false, isPolite=false;
let transRetryCount=0;
let pendingIce=[];
let audioCtx=null, analyser=null, vadTimer=null, isSpeaking=false, vadInterval=null;

// ===== 日志 =====
function addLog(msg, color="#555") {
  const d = document.createElement("div");
  d.style.color = color;
  d.textContent = new Date().toLocaleTimeString()+" "+msg;
  $("logBox").appendChild(d);
  $("logBox").scrollTop = $("logBox").scrollHeight;
  console.log(msg);
}
function toggleLog() {
  const b = $("logBox");
  b.style.display = b.style.display==="none" ? "block" : "none";
}
function setStatus(msg, type="") {
  $("statusBar").textContent = msg;
  $("statusBar").className = type;
  const c = type==="ok"?"#22c55e":type==="err"?"#ef4444":type==="info"?"#60a5fa":"#555";
  addLog(msg, c);
}
function setInd(state, text) {
  $("dot").className = "dot"+(state?" "+state:"");
  $("indText").textContent = text;
}

// ===== TURN =====
async function initTurn() {
  try {
    const r = await fetch(TURN_URL, {
      method:"POST",
      headers:{"Authorization":`Bearer ${SUPABASE_ANON}`,"apikey":SUPABASE_ANON,"Content-Type":"application/json"}
    });
    const d = await r.json();
    let servers = d.iceServers;
    if (servers && !Array.isArray(servers)) servers = [servers];
    if (servers?.length) {
      const u = servers[0].username||d.username;
      const c = servers[0].credential||d.credential;
      const extra = (u&&c) ? [
        {urls:"turns:turn.cloudflare.com:5349?transport=tcp",username:u,credential:c},
        {urls:"turn:turn.cloudflare.com:3478?transport=tcp", username:u,credential:c},
        {urls:"turn:turn.cloudflare.com:3478?transport=udp", username:u,credential:c},
      ] : [];
      rtcConfig = {
        iceServers:[{urls:"stun:stun.l.google.com:19302"},...extra,...servers],
        iceTransportPolicy:"all"
      };
      addLog("TURN ready: "+rtcConfig.iceServers.length+" servers", "#22c55e");
    }
  } catch(e) { addLog("TURN failed: "+e.message, "#ef4444"); }
}

// ===== VAD =====
function startVAD(stream) {
  try {
    audioCtx = new (window.AudioContext||window.webkitAudioContext)();
    const src = audioCtx.createMediaStreamSource(stream);
    analyser = audioCtx.createAnalyser();
    analyser.fftSize=512; analyser.smoothingTimeConstant=0.3;
    src.connect(analyser);
    const buf = new Uint8Array(analyser.frequencyBinCount);
    vadInterval = setInterval(()=>{
      if (!analyser) return;
      analyser.getByteFrequencyData(buf);
      let sum=0; for(let i=0;i<buf.length;i++) sum+=buf[i]*buf[i];
      const rms = Math.sqrt(sum/buf.length)/255;
      $("vadFill").style.width = Math.min(rms*800,100)+"%";
      if (rms>0.015) {
        clearTimeout(vadTimer);
        if (!isSpeaking) { isSpeaking=true; setInd("s",t("speaking")); }
        vadTimer = setTimeout(()=>{
          isSpeaking=false;
          setInd(rtcReady?"":"t", rtcReady?t("standby"):t("transStart"));
          $("vadFill").style.width="0%";
        }, 800);
      }
    }, 20);
  } catch(e) { addLog("VAD err: "+e.message,"#ef4444"); }
}
function stopVAD() {
  clearInterval(vadInterval); clearTimeout(vadTimer); vadInterval=null; isSpeaking=false;
  $("vadFill").style.width="0%";
  if (audioCtx) { audioCtx.close().catch(()=>{}); audioCtx=null; } analyser=null;
}

// ===== 翻译引擎重试 =====
function scheduleTransRetry() {
  if (transRetryCount>=3) {
    addLog("Trans failed after 3 retries", "#ef4444");
    transRetryCount=0; setStatus(t("transFail"),"err"); setInd("",t("transFail")); return;
  }
  transRetryCount++;
  const delay = transRetryCount*3000;
  addLog("Trans retry "+transRetryCount+"/3 in "+(delay/1000)+"s...", "#f59e0b");
  setTimeout(async()=>{
    if (peerMediaStream && !transPc) {
      const track = peerMediaStream.getAudioTracks()[0];
      if (track) await startTranslation(track);
      else scheduleTransRetry();
    }
  }, delay);
}

// ===== 翻译消息处理 =====
function handleTransMsg(data) {
  try {
    const ev = JSON.parse(data);
    const skip = ["session.created","output_audio_buffer.started",
      "input_audio_buffer.speech_started","input_audio_buffer.speech_stopped",
      "input_audio_buffer.committed"];
    if (ev.type && !skip.includes(ev.type)) addLog("DC: "+ev.type, "#60a5fa");

    // 译文（对方→我）
    if (ev.type==="session.output_transcript.delta"||ev.type==="response.audio_transcript.delta") {
      const d = ev.delta||ev.text||"";
      if (d) {
        addLog("delta: ["+d+"]","#22c55e");
        const tb=$("transcript"); tb.textContent+=d; tb.scrollTop=tb.scrollHeight;
      }
    }
    if (ev.type==="session.output_transcript.done"||ev.type==="response.audio_transcript.done") {
      const tb=$("transcript");
      const lines=tb.textContent.split("\n");
      tb.textContent=(lines.length>6?lines.slice(-6):lines).join("\n")+"\n";
      tb.scrollTop=tb.scrollHeight;
    }
    // 对方原话识别
    if (ev.type==="session.input_transcript.delta") {
      const d=ev.delta||ev.text||"";
      if (d) { const tb=$("myTranscript"); tb.textContent+=d; tb.scrollTop=tb.scrollHeight; }
    }
    if (ev.type==="session.input_transcript.done") {
      const tb=$("myTranscript");
      addLog("对方说: ["+(tb.textContent.trim().split("\n").filter(Boolean).pop()||"")+"]","#60a5fa");
      const lines=tb.textContent.split("\n");
      tb.textContent=(lines.length>4?lines.slice(-4):lines).join("\n")+"\n";
      tb.scrollTop=tb.scrollHeight;
    }
    if (ev.type==="error") addLog("Trans err: "+(ev.error?.message||""),"#ef4444");
  } catch(e) { addLog("DC parse err: "+e.message,"#ef4444"); }
}

// ===== 翻译引擎（WebRTC relay模式，绕过Safari ICE consent bug）=====
// 问题3：提供两种ICE策略供AB测试
// relay = 强制TURN（绕过Safari ICE consent bug，但VPN下多一跳）
// all   = 先尝试直连，失败再用TURN（VPN下可能更快）
const TRANS_ICE_POLICY = "relay"; // 可改为"all"做AB测试

// 问题2：统一ICE状态处理函数，避免重复定义
function handleTransIceState(state, resolve, reject) {
  addLog("Trans ICE: "+state, state==="connected"||state==="completed"?"#22c55e":state==="failed"?"#ef4444":"#60a5fa");
  if (resolve && (state==="connected"||state==="completed")) { resolve(); return; }
  if (reject  &&  state==="failed") { reject(new Error("Trans ICE failed")); return; }
  if (state==="disconnected") {
    setTimeout(()=>{
      if (transPc?.iceConnectionState==="disconnected") {
        addLog("Trans restartIce()","#f59e0b");
        try { transPc.restartIce(); } catch(e) {
          addLog("restartIce failed: "+e.message,"#ef4444");
          if (transPc) { try { transPc.close(); } catch {} }
          transPc=null;
          setTimeout(()=>scheduleTransRetry(), 100);
        }
      }
    }, 2000);
  }
}

async function startTranslation(peerAudioTrack) {
  if (transPc) return;
  peerMediaStream = new MediaStream([peerAudioTrack]);
  addLog("Starting translation ("+TRANS_ICE_POLICY+"), lang="+myLang, "#60a5fa");

  // 问题1：监控远端音频轨道状态（Safari iOS常出现muted=true但readyState=live）
  addLog("Track state: readyState="+peerAudioTrack.readyState+" muted="+peerAudioTrack.muted, "#60a5fa");
  peerAudioTrack.onmute   = ()=>addLog("⚠️ peerAudioTrack MUTED（Safari常见）","#f59e0b");
  peerAudioTrack.onunmute = ()=>addLog("✅ peerAudioTrack UNMUTED","#22c55e");
  peerAudioTrack.onended  = ()=>{
    addLog("❌ peerAudioTrack ENDED - 需要重新建立翻译","#ef4444");
    if (transPc) { try { transPc.close(); } catch {} transPc=null; }
    setTimeout(()=>scheduleTransRetry(), 500);
  };

  const turnOnly = rtcConfig.iceServers.filter(s=>s.username&&s.credential);
  const transConfig = {
    iceServers: turnOnly.length>0 ? turnOnly : rtcConfig.iceServers,
    iceTransportPolicy: TRANS_ICE_POLICY
  };
  addLog("Trans: "+transConfig.iceServers.length+" servers, policy="+TRANS_ICE_POLICY, "#60a5fa");

  try {
    transPc = new RTCPeerConnection(transConfig);

    transPc.ontrack = (e) => {
      transRetryCount=0;
      addLog("Trans: received audio!", "#22c55e");
      const audio=$("remoteAudio");
      if ("suppressLocalAudioPlayback" in audio) audio.suppressLocalAudioPlayback=true;
      audio.srcObject=e.streams[0];
      if (audioCtx?.state==="suspended") audioCtx.resume();
      audio.play().then(()=>{
        addLog("Trans: playing!","#22c55e");
        rtcReady=true; setInd("",t("standby")); setStatus(t("ready"),"ok");
      }).catch(err=>{
        addLog("Autoplay blocked","#ef4444");
        setStatus(t("tapPlay"),"info");
        document.addEventListener("click",()=>{ audio.play(); setStatus(t("ready"),"ok"); },{once:true});
      });
    };

    transPc.addTrack(peerAudioTrack, peerMediaStream);

    // DataChannel
    const tdc = transPc.createDataChannel("oai-events");
    tdc.onopen    = ()=>addLog("DC opened!","#22c55e");
    tdc.onclose   = ()=>addLog("DC closed","#ef4444");
    tdc.onmessage = e=>handleTransMsg(e.data);
    transPc.ondatachannel = e=>{
      addLog("ondatachannel (Safari)","#f59e0b");
      e.channel.onopen    = ()=>addLog("Safari DC opened!","#22c55e");
      e.channel.onmessage = m=>handleTransMsg(m.data);
    };

    // ICE状态由Promise内的handleTransIceState统一处理
    // 这里只监控disconnected做早期重启
    transPc.oniceconnectionstatechange = ()=>{
      handleTransIceState(transPc?.iceConnectionState, null, null);
    };

    // 并行获取密钥+offer
    const [secretRes, offer] = await Promise.all([
      fetch(SESSION_URL, {
        method:"POST",
        headers:{"Authorization":`Bearer ${SUPABASE_ANON}`,"apikey":SUPABASE_ANON,"Content-Type":"application/json"},
        body: JSON.stringify({ outputLanguage: myLang })
      }),
      transPc.createOffer().then(o=>{ transPc.setLocalDescription(o); return o; })
    ]);

    const secretText = await secretRes.text();
    addLog("Session: "+secretRes.status, secretRes.ok?"#22c55e":"#ef4444");
    if (!secretRes.ok) throw new Error(secretRes.status+" "+secretText);
    const { client_secret } = JSON.parse(secretText);
    if (!client_secret) throw new Error("no client_secret");

    const sdpRes = await fetch(
      `${OPENAI_TRANS}?model=gpt-realtime-translate`,
      {method:"POST", headers:{"Authorization":`Bearer ${client_secret}`,"Content-Type":"application/sdp"}, body:offer.sdp}
    );
    const answerSdp = await sdpRes.text();
    addLog("SDP: "+sdpRes.status, sdpRes.ok?"#22c55e":"#ef4444");
    if (!sdpRes.ok) throw new Error(sdpRes.status+" "+answerSdp.substring(0,80));
    await transPc.setRemoteDescription({type:"answer", sdp:answerSdp});

    await new Promise((resolve,reject)=>{
      const timeout = setTimeout(()=>reject(new Error("Trans ICE timeout 15s")), 15000);
      const _resolve = ()=>{ clearTimeout(timeout); resolve(); };
      const _reject  = (e)=>{ clearTimeout(timeout); reject(e); };
      // 统一用handleTransIceState处理，不再重复写状态逻辑
      transPc.oniceconnectionstatechange = ()=>{
        handleTransIceState(transPc?.iceConnectionState, _resolve, _reject);
      };
      // 立即检查当前状态（可能已经connected）
      handleTransIceState(transPc?.iceConnectionState, _resolve, _reject);
    });

  } catch(err) {
    addLog("Trans FAILED: "+err.message,"#ef4444");
    if (transPc) { try { transPc.close(); } catch {} }
    transPc=null;
    setTimeout(()=>scheduleTransRetry(), 100);
  }
}

// ===== PERFECT NEGOTIATION P2P =====
function setupPC() {
  pc = new RTCPeerConnection(rtcConfig);

  pc.onnegotiationneeded = async()=>{
    try {
      makingOffer=true;
      addLog("onnegotiationneeded → offer","#60a5fa");
      await pc.setLocalDescription();
      await bcast({type:"sdp", sdp:pc.localDescription});
    } catch(e) { addLog("negotiation err: "+e.message,"#ef4444"); }
    finally { makingOffer=false; }
  };

  pc.onicecandidate = async({candidate})=>{
    if (candidate) await bcast({type:"ice", candidate:candidate.toJSON()});
  };

  pc.oniceconnectionstatechange = ()=>{
    const s=pc.iceConnectionState;
    addLog("P2P ICE: "+s, s==="connected"||s==="completed"?"#22c55e":s==="failed"?"#ef4444":"#60a5fa");
    if (s==="failed") pc.restartIce();
    if (s==="disconnected") setTimeout(()=>{ if(pc?.iceConnectionState==="disconnected") pc.restartIce(); },2000);
  };

  pc.onconnectionstatechange = ()=>{
    addLog("P2P conn: "+pc.connectionState,"#60a5fa");
    if (pc.connectionState==="connected") setStatus(t("p2pOk"),"ok");
  };

  // 收到对方音视频
  let remoteStream = new MediaStream();
  pc.ontrack = async({track, streams})=>{
    addLog("P2P track: "+track.kind,"#22c55e");
    remoteStream.addTrack(track);
    if (track.kind==="video") $("remoteVid").srcObject=remoteStream;
    if (track.kind==="audio" && !transPc) {
      setInd("t",t("transStart"));
      await startTranslation(track);
    }
  };

  // 添加本机音频
  if (localStream) {
    localStream.getTracks().forEach(track=>{
      pc.addTrack(track, localStream);
      addLog("Added: "+track.kind,"#22c55e");
    });
  }
}

// ===== 信令（Perfect Negotiation）=====
async function handleSignal(payload) {
  if (!pc) return;

  if (payload.type==="sdp") {
    const desc = payload.sdp;
    const collision = desc.type==="offer" && (makingOffer || pc.signalingState!=="stable");
    ignoreOffer = !isPolite && collision;
    if (ignoreOffer) { addLog("Ignoring colliding offer (impolite)","#f59e0b"); return; }
    addLog("setRemoteDesc: "+desc.type,"#60a5fa");
    await pc.setRemoteDescription(desc);
    if (desc.type==="offer") {
      await pc.setLocalDescription();
      await bcast({type:"sdp", sdp:pc.localDescription});
    }
  }

  if (payload.type==="ice") {
    try {
      if (!pc.remoteDescription) { pendingIce.push(payload.candidate); return; }
      await pc.addIceCandidate(new RTCIceCandidate(payload.candidate));
    } catch(e) { if (!ignoreOffer) addLog("ICE add err: "+e.message,"#ef4444"); }
  }

  if (payload.type==="leave") {
    setInd("",t("peerLeft")); setStatus(t("peerHangup"),"err");
  }
}

async function bcast(payload) {
  if (ch) await ch.send({type:"broadcast", event:"signal", payload});
}

// ===== 视频开关 =====
async function toggleVideo() {
  const btn=$("vidBtn"), row=$("vrow");
  if (!videoEnabled) {
    try {
      videoStream = await navigator.mediaDevices.getUserMedia({
        video:{facingMode:"user",width:{ideal:640},height:{ideal:480}}
      });
      $("localVid").srcObject=videoStream;
      if (pc) videoStream.getVideoTracks().forEach(t=>pc.addTrack(t,videoStream));
      row.style.display="flex"; videoEnabled=true;
      btn.textContent=t("vidOff"); btn.style.color="#ef4444";
    } catch(e) { setStatus(t("err")+e.message,"err"); }
  } else {
    if (videoStream) { videoStream.getTracks().forEach(t=>t.stop()); videoStream=null; }
    $("localVid").srcObject=null; row.style.display="none"; videoEnabled=false;
    btn.textContent=t("vidOn"); btn.style.color="#60a5fa";
  }
}

// ===== 加入房间 =====
async function joinRoom() {
  myLang=$("myLang").value;
  $("joinBtn").disabled=true;
  $("joinCard").style.display="none";
  $("callSection").classList.add("on");
  applyUI(); setStatus(t("connecting"),"info");

  try {
    localStream = await navigator.mediaDevices.getUserMedia({audio:true});
    addLog("Mic ready","#22c55e");
    startVAD(localStream);
    await initTurn();

    sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON);
    ch = sb.channel(ROOM, {config:{broadcast:{self:false},presence:{key:myId}}});

    ch.on("presence",{event:"sync"},()=>{
      const state=ch.presenceState();
      const members=Object.keys(state).sort();
      addLog("Room: "+members.join(","),"#60a5fa");
      if (members.length>2) { setStatus(t("roomFull"),"err"); return; }
      if (members.length===2 && !pc) {
        isPolite = myId!==members[0];
        addLog("Role: "+(isPolite?"polite":"impolite"),"#f59e0b");
        setupPC();
        pendingIce.forEach(async c=>{
          try { await pc.addIceCandidate(new RTCIceCandidate(c)); } catch {}
        });
        pendingIce=[];
      }
    })
    .on("presence",{event:"join"},({key})=>{
      addLog("Joined: "+key,"#22c55e"); setStatus(t("peerJoined"),"info");
    })
    .on("presence",{event:"leave"},({key})=>{
      addLog("Left: "+key,"#ef4444"); setStatus(t("peerLeft"),"err"); setInd("",t("peerLeft"));
    })
    .on("broadcast",{event:"signal"},async({payload})=>{
      if (!pc && payload.type!=="leave") { pendingIce.push(payload); return; }
      await handleSignal(payload);
    })
    .subscribe(async status=>{
      addLog("Channel: "+status, status==="SUBSCRIBED"?"#22c55e":"#60a5fa");
      if (status==="SUBSCRIBED") {
        setStatus(t("waiting"),"info"); setInd("",t("waiting"));
        await ch.track({id:myId,ts:myTs});
      }
    });

  } catch(err) {
    setStatus(t("err")+err.message,"err");
    $("joinBtn").disabled=false;
    $("joinCard").style.display="";
    $("callSection").classList.remove("on");
  }
}

function leaveRoom() {
  bcast({type:"leave"}).catch(()=>{});
  cleanup();
  $("callSection").classList.remove("on");
  $("joinCard").style.display="";
  $("joinBtn").disabled=false;
  $("transcript").textContent="";
  $("myTranscript").textContent="";
  applyUI();
}

function cleanup() {
  rtcReady=false; makingOffer=false; ignoreOffer=false;
  transRetryCount=0; pendingIce=[];
  stopVAD();
  if (ch)          { try { sb?.removeChannel(ch); } catch {} ch=null; sb=null; }
  if (transPc)     { try { transPc.close(); } catch {} transPc=null; }
  if (pc)          { try { pc.close(); }      catch {} pc=null; }
  if (localStream) { localStream.getTracks().forEach(t=>t.stop()); localStream=null; }
  if (videoStream) { videoStream.getTracks().forEach(t=>t.stop()); videoStream=null; }
  peerMediaStream=null; videoEnabled=false;
  $("remoteAudio").srcObject=null;
  $("localVid").srcObject=null;
  $("remoteVid").srcObject=null;
  $("vrow").style.display="none";
  setInd("","");
}

window.addEventListener("load",()=>{
  fetch(SESSION_URL,{method:"OPTIONS",headers:{"Authorization":`Bearer ${SUPABASE_ANON}`}}).catch(()=>{});
});
</script>
