<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>GloTalk</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; -webkit-user-select: none; user-select: none; }
    body {
      min-height: 100dvh; background: #0a0a0a; color: #f0f0f0;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif;
      display: flex; align-items: center; justify-content: center;
      padding: max(20px, env(safe-area-inset-top)) 20px max(20px, env(safe-area-inset-bottom));
    }
    .app { width: min(100%, 420px); display: flex; flex-direction: column; gap: 12px; }
    .logo { font-size: 30px; font-weight: 800; letter-spacing: -1px; color: #fff; }
    .logo span { color: #22c55e; }
    .tagline { font-size: 12px; color: #333; margin-top: 2px; }

    /* 状态栏 */
    .status-bar {
      display: flex; align-items: center; gap: 8px;
      background: #111; border: 1px solid #222; border-radius: 12px; padding: 10px 14px;
    }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: #333; flex-shrink: 0; transition: all 0.3s; }
    .dot.green  { background: #22c55e; box-shadow: 0 0 6px #22c55e88; }
    .dot.yellow { background: #f59e0b; box-shadow: 0 0 4px #f59e0b66; }
    .dot.red    { background: #ef4444; box-shadow: 0 0 4px #ef444466; }
    .status-text { font-size: 13px; color: #888; flex: 1; }
    .ping { font-size: 11px; color: #22c55e; }

    /* 房间卡片 */
    .room-card {
      background: #111; border: 1px solid #222; border-radius: 14px; padding: 12px 14px;
      display: flex; flex-direction: column; gap: 8px;
    }
    .room-row { display: flex; align-items: center; gap: 8px; }
    .room-label { font-size: 11px; color: #555; font-weight: 600; text-transform: uppercase; width: 44px; flex-shrink: 0; }
    .room-id {
      flex: 1; background: #1a1a1a; border: 1px solid #2a2a2a; border-radius: 8px;
      color: #22c55e; font: inherit; font-size: 15px; font-weight: 700;
      padding: 8px 10px; letter-spacing: 2px;
    }
    .copy-btn {
      height: 36px; padding: 0 12px; border: 1px solid #2a2a2a; border-radius: 8px;
      background: #1a1a1a; color: #888; font: inherit; font-size: 12px; cursor: pointer;
      white-space: nowrap; flex-shrink: 0;
    }
    .copy-btn:active { background: #222; }
    .share-link {
      font-size: 11px; color: #555; word-break: break-all;
      background: #0f0f0f; border-radius: 6px; padding: 6px 8px;
      -webkit-user-select: text; user-select: text;
    }

    /* 语言选择 */
    .lang-card {
      background: #111; border: 1px solid #222; border-radius: 14px; padding: 12px 14px;
      display: flex; flex-direction: column; gap: 8px;
    }
    .lang-row { display: flex; align-items: center; gap: 10px; }
    .lang-label { font-size: 11px; color: #555; font-weight: 600; text-transform: uppercase; width: 56px; flex-shrink: 0; }
    select {
      flex: 1; background: #1a1a1a; border: 1px solid #2a2a2a; border-radius: 8px;
      color: #f0f0f0; font: inherit; font-size: 14px; padding: 8px 10px; outline: none; cursor: pointer;
    }
    select option { background: #1a1a1a; }
    select:disabled { opacity: 0.4; }

    /* 字幕区（默认隐藏） */
    .subtitle-section { display: none; flex-direction: column; gap: 8px; }
    .subtitle-section.visible { display: flex; }
    .box-wrap { display: flex; flex-direction: column; gap: 4px; }
    .box-label { font-size: 11px; color: #555; font-weight: 600; text-transform: uppercase; padding-left: 2px; }
    .tbox {
      min-height: 80px; max-height: 120px; overflow-y: auto;
      border-radius: 12px; padding: 12px; font-size: 16px; font-weight: 600;
      line-height: 1.5; word-break: break-word; white-space: pre-wrap;
      -webkit-user-select: text; user-select: text;
    }
    .tbox-them { background: #0d1a0f; border: 1px solid #1a3320; color: #22c55e; }
    .tbox-them:empty::before { content: attr(data-ph); color: #1a3320; font-size: 13px; font-weight: 400; }
    .tbox-me   { background: #0f0f1a; border: 1px solid #1a1a3a; color: #60a5fa; }
    .tbox-me:empty::before   { content: attr(data-ph); color: #1a1a3a; font-size: 13px; font-weight: 400; }

    /* 按钮 */
    .btn {
      width: 100%; height: 60px; border: none; border-radius: 14px;
      font: inherit; font-size: 17px; font-weight: 800; cursor: pointer;
      transition: all 0.15s; touch-action: none;
    }
    .btn:active:not(:disabled) { transform: scale(0.97); }
    .btn-green { background: #22c55e; color: #000; }
    .btn-red   { background: #ef4444; color: #fff; box-shadow: 0 0 0 4px #ef444422; }
    .btn-blue  { background: #3b82f6; color: #fff; }

    /* 工具栏 */
    .toolbar { display: flex; gap: 8px; flex-wrap: wrap; }
    .tool-btn {
      flex: 1; min-width: 70px; height: 44px;
      border: 1px solid #222; border-radius: 10px;
      background: #111; color: #888; font: inherit; font-size: 12px; cursor: pointer;
      transition: all 0.15s;
    }
    .tool-btn.active { border-color: #22c55e44; color: #22c55e; background: #0d1a0f; }
    .tool-btn.warn   { border-color: #ef444444; color: #ef4444; background: #1a0f0f; }
    .tool-btn:active { transform: scale(0.96); }

    /* 视频 */
    .video-row { display: flex; gap: 8px; }
    .video-wrap { flex: 1; display: flex; flex-direction: column; gap: 4px; align-items: center; }
    .video-wrap span { font-size: 11px; color: #555; }
    video { width: 100%; aspect-ratio: 4/3; border-radius: 10px; background: #111; object-fit: cover; display: none; }

    /* 网络质量指示器 */
    .quality-bar {
      display: flex; align-items: center; gap: 6px;
      background: #111; border: 1px solid #222; border-radius: 8px; padding: 6px 10px;
      font-size: 11px; color: #555;
    }
    .quality-dot { width: 6px; height: 6px; border-radius: 50%; background: #333; }
    .quality-dot.g { background: #22c55e; }
    .quality-dot.y { background: #f59e0b; }
    .quality-dot.r { background: #ef4444; }

    /* 日志：用textarea支持iOS复制 */
    .log-wrap { display: none; flex-direction: column; gap: 4px; }
    .log-wrap.visible { display: flex; }
    textarea.log-box {
      background: #0a0a0a; border: 1px solid #1a1a1a; border-radius: 8px;
      padding: 8px; font-size: 11px; height: 200px; resize: none;
      font-family: monospace; color: #666; outline: none;
      -webkit-user-select: text; user-select: text;
    }
    .toggle-log { width: 100%; height: 28px; border: none; border-radius: 6px; background: #111; color: #333; font-size: 11px; cursor: pointer; }
    audio { display: none; }
  </style>
</head>
<body>
<div class="app">

  <div>
    <div class="logo">Glo<span>Talk</span></div>
    <div class="tagline" id="tagline">实时翻译通话 · 无需VPN · 支持70+语言</div>
  </div>

  <!-- 状态栏 -->
  <div class="status-bar">
    <div class="dot" id="dot"></div>
    <div class="status-text" id="statusText">选择语言，创建通话</div>
    <div class="ping" id="pingText"></div>
  </div>

  <!-- 房间卡片 -->
  <div class="room-card" id="roomCard">
    <div class="room-row">
      <span class="room-label" id="labelRoom">房间</span>
      <div class="room-id" id="roomDisplay">------</div>
      <button class="copy-btn" id="copyBtn" onclick="copyLink()">📋 复制链接</button>
    </div>
    <div class="share-link" id="shareLink"></div>
  </div>

  <!-- 语言选择 -->
  <div class="lang-card">
    <div class="lang-row">
      <span class="lang-label" id="labelMe">我说</span>
      <select id="myLang" onchange="onLangChange()">
        <option value="zh">🇨🇳 中文</option>
        <option value="en">🇺🇸 英文</option>
        <option value="ja">🇯🇵 日文</option>
        <option value="ko">🇰🇷 韩文</option>
        <option value="es">🇪🇸 西班牙文</option>
        <option value="fr">🇫🇷 法文</option>
        <option value="de">🇩🇪 德文</option>
        <option value="ar">🇸🇦 阿拉伯文</option>
      </select>
    </div>
    <div class="lang-row">
      <span class="lang-label" id="labelThem">对方说</span>
      <select id="theirLang" onchange="onLangChange()">
        <option value="en">🇺🇸 英文</option>
        <option value="zh">🇨🇳 中文</option>
        <option value="ja">🇯🇵 日文</option>
        <option value="ko">🇰🇷 韩文</option>
        <option value="es">🇪🇸 西班牙文</option>
        <option value="fr">🇫🇷 法文</option>
        <option value="de">🇩🇪 德文</option>
        <option value="ar">🇸🇦 阿拉伯文</option>
      </select>
    </div>
  </div>

  <!-- 字幕区（默认隐藏） -->
  <div class="subtitle-section" id="subtitleSection">
    <div class="box-wrap">
      <div class="box-label" id="labelBoxThem">🔊 对方说 → 我听到的翻译</div>
      <div class="tbox tbox-them" id="boxThem" data-ph="对方说话时，翻译显示在这里..."></div>
    </div>
    <div class="box-wrap">
      <div class="box-label" id="labelBoxMe">🎤 我说的话</div>
      <div class="tbox tbox-me"  id="boxMe"   data-ph="我说话时，原文显示在这里..."></div>
    </div>
  </div>

  <!-- 视频区（默认隐藏） -->
  <div class="video-row" id="videoRow" style="display:none">
    <div class="video-wrap">
      <span id="labelLocalVideo">我的画面</span>
      <video id="localVideo" autoplay playsinline muted></video>
    </div>
    <div class="video-wrap">
      <span id="labelRemoteVideo">对方画面</span>
      <video id="remoteVideo" autoplay playsinline></video>
    </div>
  </div>

  <!-- 网络质量 -->
  <div class="quality-bar" id="qualityBar" style="display:none">
    <div class="quality-dot" id="qualityDot"></div>
    <span id="qualityText">检测网络中...</span>
  </div>

  <!-- 主按钮 -->
  <button class="btn btn-green" id="mainBtn" onclick="handleMain()">开始通话</button>

  <!-- 工具栏 -->
  <div class="toolbar" id="toolbar" style="display:none">
    <button class="tool-btn active" id="muteBtn"    onclick="toggleMute()">🎤 麦克风</button>
    <button class="tool-btn"        id="subtitleBtn" onclick="toggleSubtitle()">💬 字幕</button>
    <button class="tool-btn"        id="videoBtn"   onclick="toggleVideo()">📷 摄像头</button>
    <button class="tool-btn warn"   id="hangupBtn"  onclick="handleMain()">📵 挂断</button>
  </div>

  <!-- 日志（textarea，iOS可复制） -->
  <div class="log-wrap" id="logWrap">
    <textarea class="log-box" id="logBox" readonly placeholder="调试日志..."></textarea>
  </div>
  <button class="toggle-log" onclick="toggleLog()">🔍 调试日志</button>

</div>

<!-- 音频 -->
<audio id="audioThem" autoplay playsinline></audio>

function startASR() {

    for (let i = e.resultIndex; i < e.results.length; i++) {

// ═══════════════════════════════════════════════════════════
// 建立翻译session（通用）
// inputStream: 要翻译的音频流
// outputLang:  翻译目标语言
// onDelta/onDone: 字幕回调
// audioEl: 翻译后声音播放元素（null=不播放）
// ═══════════════════════════════════════════════════════════
async function buildSession(inputStream, outputLang, onDelta, onDone, audioEl) {
  const ctx    = new (window.AudioContext || window.webkitAudioContext)();
  const silent = ctx.createMediaStreamDestination().stream;

  const tPc = new RTCPeerConnection({
    iceServers:[{urls:"stun:stun.l.google.com:19302"},{urls:"stun:stun1.l.google.com:19302"}],
    iceCandidatePoolSize:10,
  });

  if (audioEl) {
    tPc.ontrack = e => {
      audioEl.srcObject = e.streams[0];
      audioEl.volume = 1.0;
      audioEl.play().catch(()=>{});
      log("✅ 翻译音频流已连接");
    };
  }

  const tDc = tPc.createDataChannel("oai-events");
  tDc.onmessage = e => {
    try {
      const ev = JSON.parse(e.data);
      if (ev.type==="session.output_transcript.delta"||ev.type==="response.audio_transcript.delta") {
        onDelta && onDelta(ev.delta||ev.text||"");
      }
      if (ev.type==="session.output_transcript.done"||ev.type==="response.audio_transcript.done") {
        onDone && onDone();
      }
      if (ev.type==="error") log("翻译错误: " + (ev.error?.message||""));
    } catch {}
  };

  silent.getTracks().forEach(tk => { tk.enabled=false; tPc.addTrack(tk,silent); });

  const [secretRes, offer] = await Promise.all([
    fetch(SESSION_URL, {
      method:"POST", headers:{"Content-Type":"application/json"},
      body:JSON.stringify({outputLanguage:outputLang})
    }),
    tPc.createOffer().then(o => { tPc.setLocalDescription(o); return o; })
  ]);

  const secretText = await secretRes.text();
  if (!secretRes.ok) throw new Error("Session " + secretRes.status + ": " + secretText);
  const {client_secret} = JSON.parse(secretText);
  if (!client_secret) throw new Error("no client_secret");

  const sdpRes = await fetch(`${SDP_URL}?model=gpt-realtime-translate`, {
    method:"POST",
    headers:{"Authorization":`Bearer ${client_secret}`,"Content-Type":"application/sdp"},
    body:offer.sdp
  });
  const answerSdp = await sdpRes.text();
  if (!sdpRes.ok) throw new Error("SDP " + sdpRes.status + ": " + answerSdp);

  await tPc.setRemoteDescription({type:"answer",sdp:answerSdp});

  await new Promise((resolve,reject) => {
    const to = setTimeout(()=>reject(new Error("翻译引擎连接超时")),15000);
    const check = () => {
      const s = tPc?.iceConnectionState;
      if (s==="connected"||s==="completed") { clearTimeout(to); resolve(); }
      else if (s==="failed") { clearTimeout(to); reject(new Error("翻译ICE失败")); }
    };
    tPc.oniceconnectionstatechange = check;
    check();
  });

  if (inputStream) {
    const track = inputStream.getAudioTracks()[0];
    if (track) {
      const sender = tPc.getSenders().find(s=>s.track?.kind==="audio");
      if (sender) await sender.replaceTrack(track);
    }
  }

  return tPc;
}

// ═══════════════════════════════════════════════════════════
// P2P连接
// 双session架构：
//   - P2P只传原始音频（作为对方翻译引擎的输入来源）
//   - 翻译后的声音各自通过自己的翻译session播放
//   - 不再通过P2P传翻译结果
// ═══════════════════════════════════════════════════════════
async function createP2P() {
  try {
    localStream = await navigator.mediaDevices.getUserMedia({
      audio:{ echoCancellation:true, noiseSuppression:true, autoGainControl:true },
      video:false
    });
    log("✅ 麦克风已获取");
  } catch(e) { log("⚠️ 麦克风: " + e.message); }

  p2pPc = new RTCPeerConnection(rtcConfig);
  if (localStream) localStream.getTracks().forEach(tk=>p2pPc.addTrack(tk,localStream));

  let remoteStream = new MediaStream();

  p2pPc.ontrack = async e => {
    log("收到对方轨道: " + e.track.kind);

    if (e.track.kind==="video") {
      remoteStream.addTrack(e.track);
      $("remoteVideo").srcObject = remoteStream;
      $("remoteVideo").style.display = "block";
      return;
    }

    if (e.track.kind==="audio") {
      // ══════════════════════════════════════════
      // 双session核心逻辑：
      // 对方声音 → theirTransPc → 翻译成我的语言 → audioThem播放
      // 不直接播放对方原始声音（静音处理）
      // ══════════════════════════════════════════
      const theirStream = new MediaStream([e.track]);
      const myLang = $("myLang").value;
      log("启动对方翻译session → " + myLang);
      try {
        theirTransPc = await buildSession(
          theirStream, myLang,
          delta => appendBox($("boxThem"), delta),
          ()    => newlineBox($("boxThem")),
          $("audioThem")  // 翻译后声音播放给我听
        );
        log("✅ 对方翻译session就绪");
        setStatus(t.active, "green");
      } catch(err) {
        log("❌ 对方翻译session失败: " + err.message);
        // 翻译失败时，播放原始声音作为降级方案
        const rawAudio = new Audio();
        rawAudio.srcObject = theirStream;
        rawAudio.autoplay = true;
        document.body.appendChild(rawAudio);
        setStatus(t.active + " ⚠️翻译异常", "yellow");
      }
    }
  };

  p2pPc.onicecandidate = async e => {
    if (e.candidate) await bcast({type:"ice",candidate:e.candidate.toJSON()});
  };

  p2pPc.oniceconnectionstatechange = () => {
    const s = p2pPc.iceConnectionState;
    log("P2P ICE: " + s);
    if (s==="connected"||s==="completed") {
      clearTimeout(relayTimer);
      setStatus(t.p2pOk, "yellow");
    }
    if (s==="failed"&&!usedRelay) {
      usedRelay = true;
      log("切换relay模式...");
      try { p2pPc.setConfiguration({...rtcConfig,iceTransportPolicy:"relay"}); } catch {}
      p2pPc.restartIce();
    }
    if (s==="disconnected") {
      setTimeout(()=>{ if(p2pPc?.iceConnectionState==="disconnected") p2pPc.restartIce(); },2000);
    }
  };

  relayTimer = setTimeout(()=>{
    if (!usedRelay&&p2pPc?.iceConnectionState!=="connected"&&p2pPc?.iceConnectionState!=="completed") {
      usedRelay=true;
      log("15秒超时，切换relay...");
      try { p2pPc.setConfiguration({...rtcConfig,iceTransportPolicy:"relay"}); } catch {}
      p2pPc.restartIce();
    }
  },15000);
}

// DataChannel
function setupDC(d) {
  dc = d;
  dc.onopen = async () => {
    log("✅ DataChannel开启");

    // ══════════════════════════════════════════
    // 双session核心逻辑：
    // 我的麦克风 → myTransPc → 翻译成对方语言
    // 翻译后的声音通过DataChannel通知对方播放？
    // 不！双session架构下：
    //   我的session负责翻译我的声音给对方听
    //   但对方听到的翻译来自对方自己的session
    //   所以myTransPc只是给字幕用（我说了什么）
    //   实际上对方的theirTransPc接收的是P2P传来的我的原始声音
    // ══════════════════════════════════════════
    const theirLang = $("theirLang").value;
    log("启动我的翻译session → " + theirLang + "（用于字幕）");

    if (localStream) {
      try {
        myTransPc = await buildSession(
          localStream, theirLang,
          delta => appendBox($("boxMe"), delta),
          ()    => newlineBox($("boxMe")),
          null  // 我的翻译不在本地播放（对方自己会翻译）
        );
        log("✅ 我的翻译session就绪");
        startASR();
      } catch(err) {
        log("⚠️ 我的翻译session失败: " + err.message);
        startASR(); // ASR仍然启动
      }
    }

    // ping保活 + 网络质量监测
    setInterval(()=>{
      if (dc?.readyState==="open") {
        pingStart = Date.now();
        dc.send(JSON.stringify({type:"ping",t:pingStart}));
      }
    },3000);

    // 房间有效期检查
    if (ROOM_CREATED_AT) {
      setInterval(()=>{
        if (Date.now() - ROOM_CREATED_AT > ROOM_EXPIRE_MS) {
          log("⚠️ 房间已超过30分钟，建议重新创建");
        }
      },60000);
    }
  };

  dc.onclose  = () => { log("DataChannel关闭"); setStatus(t.left,"red"); };
  dc.onmessage = e => {
    try {
      const d = JSON.parse(e.data);
      if (d.type==="ping") { dc.send(JSON.stringify({type:"pong",t:d.t})); return; }
      if (d.type==="pong") {
        const ms = Date.now()-d.t;
        $("pingText").textContent = ms+"ms";
        updateQuality(ms);
        return;
      }
    } catch {}
  };
}

// ICE管理
async function addIce(c) {
  if (!p2pPc) return;
  if (!p2pPc.remoteDescription) { pendingIce.push(c); return; }
  try { await p2pPc.addIceCandidate(new RTCIceCandidate(c)); } catch {}
}
async function flushIce() {
  while(pendingIce.length) {
    try { await p2pPc.addIceCandidate(new RTCIceCandidate(pendingIce.shift())); } catch {}
  }
}

// 信令
async function bcast(payload) {
  if (ch) await ch.send({type:"broadcast",event:"signal",payload});
}
async function onSignal(payload) {
  if (payload.type==="offer") {
    if (!p2pPc) await createP2P();
    p2pPc.ondatachannel = e=>setupDC(e.channel);
    await p2pPc.setRemoteDescription({type:"offer",sdp:payload.sdp});
    await flushIce();
    const ans = await p2pPc.createAnswer();
    await p2pPc.setLocalDescription(ans);
    await bcast({type:"answer",sdp:p2pPc.localDescription.sdp});
    log("answer已发送");
  }
  if (payload.type==="answer") {
    await p2pPc.setRemoteDescription({type:"answer",sdp:payload.sdp});
    await flushIce();
    log("answer已接收");
  }
  if (payload.type==="ice") await addIce(payload.candidate);
}

// ═══════════════════════════════════════════════════════════
// 主流程
// ═══════════════════════════════════════════════════════════
async function startCall() {
  // 检查房间有效期
  if (ROOM_CREATED_AT && Date.now()-ROOM_CREATED_AT > ROOM_EXPIRE_MS) {
    alert(t.labelRoom + " 已超时，请刷新页面创建新房间");
    return;
  }

  callActive = true;
  $("mainBtn").style.display = "none";
  $("toolbar").style.display = "flex";
  $("qualityBar").style.display = "flex";
  $("myLang").disabled = true;
  $("theirLang").disabled = true;
  $("boxThem").textContent = "";
  $("boxMe").textContent = "";

  setStatus(t.connecting, "yellow");
  log("【双session架构】ID:" + myId + " 房间:" + ROOM);

  await initTurn();

  sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON);
  ch = sb.channel(ROOM, {
    config:{ broadcast:{self:false}, presence:{key:myId} }
  });

  ch.on("presence",{event:"sync"},async()=>{
    const members = Object.keys(ch.presenceState()).sort();
    log("成员: " + members.join(", "));

    if (members.length>2) { setStatus(t.full,"red"); return; }
    if (members.length>=2 && !p2pPc) {
      const isCaller = members[0]===myId;
      log(isCaller ? "角色：发起方（发offer）" : "角色：接收方（等待offer）");
      if (isCaller) {
        await createP2P();
        const d = p2pPc.createDataChannel("chat");
        setupDC(d);
        const offer = await p2pPc.createOffer();
        await p2pPc.setLocalDescription(offer);
        await bcast({type:"offer",sdp:p2pPc.localDescription.sdp});
        log("offer已发送");
      } else {
        await createP2P();
        p2pPc.ondatachannel = e=>setupDC(e.channel);
      }
    }
  })
  .on("presence",{event:"join"},({key})=>{
    log("加入: " + key);
    setStatus(t.connecting, "yellow");
  })
  .on("presence",{event:"leave"},({key})=>{
    log("离开: " + key);
    setStatus(t.left, "red");
  })
  .on("broadcast",{event:"signal"},async({payload})=>{ await onSignal(payload); })
  .subscribe(async s=>{
    log("信令: " + s);
    if (s==="SUBSCRIBED") {
      setStatus(t.waiting, "yellow");
      await ch.track({id:myId,ts:myTs});
    }
  });
}

function hangup() {
  callActive = false;
  clearTimeout(relayTimer);
  stopASR();
  [p2pPc, myTransPc, theirTransPc].forEach(pc=>{ try{pc?.close();}catch{} });
  p2pPc = myTransPc = theirTransPc = null;
  if (localStream) { localStream.getTracks().forEach(tk=>tk.stop()); localStream=null; }
  if (ch) { ch.unsubscribe(); ch=null; }
  $("mainBtn").style.display = "block";
  $("mainBtn").textContent = t.btnStart;
  $("toolbar").style.display = "none";
  $("qualityBar").style.display = "none";
  $("myLang").disabled = false;
  $("theirLang").disabled = false;
  setStatus(t.ended, "");
  log("通话已结束，所有session已关闭");
}

function handleMain() {
  if (callActive) hangup();
  else startCall();
}

// ═══════════════════════════════════════════════════════════
// 工具栏
// ═══════════════════════════════════════════════════════════
function toggleMute() {
  muted = !muted;
  if (localStream) localStream.getAudioTracks().forEach(tk=>tk.enabled=!muted);
  if (muted) stopASR(); else if (callActive) startASR();
  $("muteBtn").textContent  = muted ? t.btnMicOff : t.btnMic;
  $("muteBtn").className    = "tool-btn" + (muted ? "" : " active");
}

function toggleSubtitle() {
  subtitleOn = !subtitleOn;
  $("subtitleSection").className = "subtitle-section" + (subtitleOn?" visible":"");
  $("subtitleBtn").textContent   = subtitleOn ? t.btnSubOn : t.btnSub;
  $("subtitleBtn").className     = "tool-btn" + (subtitleOn?" active":"");
  if (!subtitleOn) { $("boxThem").textContent=""; $("boxMe").textContent=""; }
}

async function toggleVideo() {
  videoOn = !videoOn;
  $("videoBtn").textContent = videoOn ? t.btnCamOn : t.btnCam;
  $("videoBtn").className   = "tool-btn" + (videoOn?" active":"");
  $("videoRow").style.display = videoOn ? "flex" : "none";
  if (videoOn && localStream) {
    try {
      const vs = await navigator.mediaDevices.getUserMedia({video:{facingMode:"user",width:{ideal:640},height:{ideal:480}}});
      const vt = vs.getVideoTracks()[0];
      localStream.addTrack(vt);
      $("localVideo").style.display = "block";
      $("localVideo").srcObject = localStream;
      if (p2pPc) p2pPc.addTrack(vt,localStream);
      log("✅ 摄像头已开启");
    } catch(e) { log("摄像头失败: "+e.message); videoOn=false; }
  } else if (!videoOn && localStream) {
    localStream.getVideoTracks().forEach(tk=>{ tk.stop(); localStream.removeTrack(tk); });
    $("localVideo").style.display = "none";
  }
}

// ═══════════════════════════════════════════════════════════
// 初始化
// ═══════════════════════════════════════════════════════════
window.addEventListener("load", () => {
  initRoom();
  onLangChange();
});
</script>
