<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GloTalk — Gemini Live Translate</title>

  <!--
    GloTalk 路线B升级版 — gemini-3.5-live-translate-preview + LiveKit
    参考来源：google-gemini/gemini-live-api-examples（2026-06-09）
      src/app/session/[id]/broadcast/page.tsx → 主讲人界面
      src/app/session/[id]/watch/page.tsx    → 听众界面
      src/app/session/[id]/watch/components/LanguageSelector.tsx → 语言切换
    LiveKit Browser SDK via CDN
  -->

  <script src="https://unpkg.com/livekit-client@2.17.3/dist/livekit-client.umd.min.js"></script>

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #0a0a0a; color: #f0f0f0; min-height: 100vh; display: flex; flex-direction: column; }

    header { padding: 1rem 1.5rem; border-bottom: 1px solid #1a1a1a; display: flex; align-items: center; gap: 0.75rem; }
    header h1 { font-size: 1.1rem; font-weight: 600; }
    .badge { font-size: 0.7rem; background: #1a3a1a; color: #00e676; padding: 0.2rem 0.6rem; border-radius: 99px; font-weight: 600; }

    .page { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 2rem; gap: 1.5rem; }
    .card { background: #111; border: 1px solid #222; border-radius: 16px; padding: 2rem; width: 100%; max-width: 420px; display: flex; flex-direction: column; gap: 1.25rem; }
    .card h2 { font-size: 1.3rem; font-weight: 600; }
    .card p { color: #666; font-size: 0.85rem; line-height: 1.5; }

    .form-group { display: flex; flex-direction: column; gap: 0.4rem; }
    .form-group label { font-size: 0.8rem; color: #888; font-weight: 500; }
    .form-group input, .form-group select {
      background: #1a1a1a; border: 1px solid #2a2a2a; border-radius: 8px;
      color: #f0f0f0; font-size: 0.95rem; padding: 0.65rem 0.9rem; outline: none; width: 100%;
    }
    .form-group input:focus, .form-group select:focus { border-color: #00e676; }
    .form-group select option { background: #1a1a1a; }

    .btn { background: #00e676; color: #000; border: none; border-radius: 8px; font-size: 0.95rem; font-weight: 700; padding: 0.8rem 1.5rem; cursor: pointer; width: 100%; transition: background 0.15s; }
    .btn:hover { background: #00ff85; }
    .btn:disabled { background: #1a1a1a; color: #444; cursor: not-allowed; }
    .btn.secondary { background: transparent; color: #f0f0f0; border: 1px solid #333; font-weight: 500; }
    .btn.secondary:hover { background: #1a1a1a; }
    .btn.danger { background: #ef4444; color: #fff; }
    .btn.danger:hover { background: #dc2626; }

    .role-btns { display: grid; grid-template-columns: 1fr 1fr; gap: 0.75rem; }

    /* 会议界面 */
    #meeting { flex: 1; display: none; flex-direction: column; max-width: 500px; width: 100%; margin: 0 auto; padding: 1.5rem; gap: 1.25rem; }

    .status-bar { display: flex; align-items: center; justify-content: space-between; }
    .status-dot { width: 8px; height: 8px; border-radius: 50%; background: #00e676; display: inline-block; margin-right: 6px; animation: pulse 1.5s infinite; }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }
    .status-text { font-size: 0.85rem; color: #00e676; display: flex; align-items: center; }
    .session-id { font-size: 0.75rem; color: #444; font-family: monospace; }

    .section-label { font-size: 0.75rem; color: #666; font-weight: 600; letter-spacing: 0.05em; text-transform: uppercase; margin-bottom: 0.5rem; }

    /* 字幕区域 */
    .subtitles-box { background: #111; border: 1px solid #1a1a1a; border-radius: 12px; padding: 1rem; min-height: 120px; max-height: 200px; overflow-y: auto; }
    .subtitle-line { font-size: 0.95rem; line-height: 1.6; color: #f0f0f0; margin-bottom: 0.25rem; }
    .subtitle-line.interim { color: #666; }
    .subtitle-empty { color: #333; font-size: 0.85rem; text-align: center; padding: 1.5rem 0; }

    /* 语言选择器（来自官方 LanguageSelector）*/
    .lang-selector { background: #111; border: 1px solid #222; border-radius: 12px; padding: 1rem; }
    .lang-selector select { width: 100%; background: #1a1a1a; border: 1px solid #2a2a2a; border-radius: 8px; color: #f0f0f0; font-size: 0.9rem; padding: 0.6rem 0.8rem; outline: none; }
    .lang-selector select:disabled { opacity: 0.5; }
    .lang-status { margin-top: 0.6rem; font-size: 0.8rem; color: #00e676; display: flex; align-items: center; min-height: 20px; }

    /* 翻译状态列表（主讲人界面）*/
    .translations-list { background: #111; border: 1px solid #1a1a1a; border-radius: 12px; padding: 1rem; }
    .translation-item { display: flex; align-items: center; justify-content: space-between; padding: 0.5rem 0; border-bottom: 1px solid #1a1a1a; }
    .translation-item:last-child { border-bottom: none; }
    .translation-lang { font-size: 0.9rem; font-weight: 500; }
    .translation-meta { font-size: 0.75rem; color: #666; }

    /* 控制栏 */
    .controls { display: flex; gap: 0.75rem; }
    .mic-btn { width: 56px; height: 56px; border-radius: 50%; border: none; cursor: pointer; display: grid; place-items: center; font-size: 1.3rem; transition: background 0.15s; flex-shrink: 0; }
    .mic-btn.on { background: #1a1a1a; }
    .mic-btn.off { background: #ef4444; }

    #error-bar { background: #3a0000; color: #ff5252; padding: 0.6rem 1rem; font-size: 0.85rem; display: none; }
  </style>
</head>
<body>

<header>
  <h1>GloTalk</h1>
  <span class="badge">Route B · gemini-3.5-live-translate</span>
</header>

<div id="error-bar"></div>

<!-- 首页：选择角色 -->
<div id="home" class="page">
  <div class="card">
    <h2>Live Translation</h2>
    <p>Powered by Gemini 3.5 Live Translate + LiveKit</p>

    <div class="role-btns">
      <button class="btn" onclick="showOrganizerForm()">🎙 主讲人<br><small>我来说话</small></button>
      <button class="btn secondary" onclick="showAttendeeForm()">🎧 听众<br><small>我来听</small></button>
    </div>
  </div>
</div>

<!-- 主讲人登录 -->
<div id="organizer-form" class="page" style="display:none">
  <div class="card">
    <h2>🎙 主讲人</h2>
    <p>创建一个翻译会话，把链接分享给听众。</p>

    <div class="form-group">
      <label>你的名字</label>
      <input id="org-name" type="text" placeholder="输入你的名字" maxlength="40" />
    </div>

    <button class="btn" id="org-start-btn" onclick="startBroadcast()">创建会话</button>
    <button class="btn secondary" onclick="showHome()">← 返回</button>
  </div>
</div>

<!-- 听众登录 -->
<div id="attendee-form" class="page" style="display:none">
  <div class="card">
    <h2>🎧 听众</h2>
    <p>输入主讲人分享给你的会话 ID。</p>

    <div class="form-group">
      <label>会话 ID</label>
      <input id="att-session-id" type="text" placeholder="例如：abc123de" maxlength="20" />
    </div>

    <button class="btn" id="att-join-btn" onclick="joinAsAttendee()">加入</button>
    <button class="btn secondary" onclick="showHome()">← 返回</button>
  </div>
</div>

<!-- 会议界面（主讲人 + 听众共用，逻辑不同）-->
<div id="meeting">
  <div class="status-bar">
    <div class="status-text"><span class="status-dot"></span><span id="meeting-status">连接中...</span></div>
    <span class="session-id" id="meeting-session-id"></span>
  </div>

  <!-- 字幕区域（听众看翻译，主讲人看当前活跃语言）-->
  <div>
    <div class="section-label" id="subtitles-label">翻译字幕</div>
    <div class="subtitles-box" id="subtitles-box">
      <div class="subtitle-empty" id="subtitles-empty">等待说话...</div>
    </div>
  </div>

  <!-- 语言选择器（听众用，来自官方 LanguageSelector）-->
  <div class="lang-selector" id="lang-selector-box" style="display:none">
    <div class="section-label">我想听</div>
    <select id="lang-select" onchange="handleLanguageChange(this.value)">
      <option value="original">🔊 原声</option>
      <optgroup label="翻译">
        <option value="zh">🇨🇳 中文</option>
        <option value="en">🇺🇸 English</option>
        <option value="ja">🇯🇵 日本語</option>
        <option value="ko">🇰🇷 한국어</option>
        <option value="es">🇪🇸 Español</option>
        <option value="fr">🇫🇷 Français</option>
        <option value="de">🇩🇪 Deutsch</option>
        <option value="pt">🇧🇷 Português</option>
        <option value="ru">🇷🇺 Русский</option>
        <option value="ar">🇸🇦 العربية</option>
        <option value="hi">🇮🇳 हिन्दी</option>
        <option value="th">🇹🇭 ภาษาไทย</option>
        <option value="vi">🇻🇳 Tiếng Việt</option>
        <option value="id">🇮🇩 Indonesia</option>
        <option value="ms">🇲🇾 Melayu</option>
      </optgroup>
    </select>
    <div class="lang-status" id="lang-status"></div>
  </div>

  <!-- 翻译列表（主讲人用）-->
  <div id="translations-box" style="display:none">
    <div class="section-label">当前活跃翻译</div>
    <div class="translations-list" id="translations-list">
      <div class="subtitle-empty">暂无听众请求翻译</div>
    </div>
  </div>

  <!-- 控制栏 -->
  <div class="controls">
    <button class="mic-btn on" id="mic-btn" onclick="toggleMic()">🎤</button>
    <button class="btn danger" onclick="leaveRoom()">结束通话</button>
  </div>
</div>

<script>
// ============================================================
// GloTalk 路线B前端
// 参考来源：google-gemini/gemini-live-api-examples（2026-06-09）
//   src/app/session/[id]/broadcast/page.tsx
//   src/app/session/[id]/watch/page.tsx
//   src/app/session/[id]/watch/components/LanguageSelector.tsx
// ============================================================

let room = null;
let sessionId = null;
let role = null; // "organizer" | "attendee"
let micEnabled = true;
let currentLanguage = "original";
let translatorIdentity = null;
let transcripts = [];
let translationsPollingTimer = null;

// ── 页面切换 ──
function showHome() { hide("organizer-form"); hide("attendee-form"); show("home"); }
function showOrganizerForm() { hide("home"); show("organizer-form"); }
function showAttendeeForm() { hide("home"); show("attendee-form"); }
function show(id) { document.getElementById(id).style.display = "flex"; }
function hide(id) { document.getElementById(id).style.display = "none"; }

function showError(msg) {
  const el = document.getElementById("error-bar");
  el.textContent = msg;
  el.style.display = "block";
  setTimeout(() => { el.style.display = "none"; }, 6000);
}

// ── 主讲人：创建会话（来自官方 POST /api/sessions）──
async function startBroadcast() {
  const name = document.getElementById("org-name").value.trim() || "host";
  const btn = document.getElementById("org-start-btn");
  btn.disabled = true; btn.textContent = "创建中...";

  try {
    // 1. 创建会话
    const sessRes = await fetch("/api/gemini/sessions", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ organizerName: name }),
    });
    const sessData = await sessRes.json();
    sessionId = sessData.sessionId;
    role = "organizer";

    // 2. 拿 LiveKit Token（用现有接口，角色 organizer）
    const tokenRes = await fetch(
      `/livekit-token?room=${sessionId}&identity=organizer-${name}&lang=zh`
    );
    const tokenData = await tokenRes.json();

    // 3. 连接 LiveKit
    await connectRoom(tokenData.url, tokenData.token);

    // 4. 开启麦克风
    await room.localParticipant.setMicrophoneEnabled(true);

    // 5. 显示会议界面（主讲人模式）
    enterMeeting(`会话 ${sessionId}`, "organizer");

    // 6. 定时轮询翻译状态（来自官方 fetchTranslations）
    translationsPollingTimer = setInterval(fetchTranslations, 3000);
    fetchTranslations();

  } catch (err) {
    showError("创建会话失败: " + err.message);
    btn.disabled = false; btn.textContent = "创建会话";
  }
}

// ── 听众：加入会话（来自官方 watch/page.tsx）──
async function joinAsAttendee() {
  sessionId = document.getElementById("att-session-id").value.trim();
  if (!sessionId) { showError("请输入会话 ID"); return; }

  const btn = document.getElementById("att-join-btn");
  btn.disabled = true; btn.textContent = "加入中...";
  role = "attendee";

  try {
    // 1. 验证会话是否存在
    const sessRes = await fetch(`/api/gemini/sessions/${sessionId}`);
    if (!sessRes.ok) { showError("会话不存在，请确认 ID"); btn.disabled = false; btn.textContent = "加入"; return; }

    // 2. 拿 LiveKit Token（听众角色，不发布音频）
    const identity = `attendee-${Math.random().toString(36).slice(2, 8)}`;
    const tokenRes = await fetch(
      `/livekit-token?room=${sessionId}&identity=${identity}&lang=zh`
    );
    const tokenData = await tokenRes.json();

    // 3. 连接 LiveKit（autoSubscribe: false，手动控制订阅，来自官方）
    await connectRoom(tokenData.url, tokenData.token, false);

    // 4. 显示会议界面（听众模式）
    enterMeeting(`会话 ${sessionId}`, "attendee");

  } catch (err) {
    showError("加入失败: " + err.message);
    btn.disabled = false; btn.textContent = "加入";
  }
}

// ── 连接 LiveKit 房间 ──
async function connectRoom(url, token, autoSubscribe = true) {
  room = new LivekitClient.Room({ adaptiveStream: true, dynacast: true });

  room.on(LivekitClient.RoomEvent.TrackSubscribed, onTrackSubscribed);
  room.on(LivekitClient.RoomEvent.TrackUnsubscribed, onTrackUnsubscribed);
  room.on(LivekitClient.RoomEvent.DataReceived, onDataReceived);
  room.on(LivekitClient.RoomEvent.ParticipantConnected, () => updateSubscriptions());
  room.on(LivekitClient.RoomEvent.TrackPublished, () => updateSubscriptions());
  room.on(LivekitClient.RoomEvent.Disconnected, onDisconnected);

  await room.connect(url, token, { autoSubscribe });
}

// ── 进入会议界面 ──
function enterMeeting(label, userRole) {
  hide("home"); hide("organizer-form"); hide("attendee-form");

  document.getElementById("meeting-status").textContent = userRole === "organizer" ? "直播中" : "收听中";
  document.getElementById("meeting-session-id").textContent = label;

  // 根据角色显示不同 UI
  if (userRole === "attendee") {
    document.getElementById("lang-selector-box").style.display = "block";
    document.getElementById("translations-box").style.display = "none";
    document.getElementById("subtitles-label").textContent = "翻译字幕";
    document.getElementById("mic-btn").style.display = "none"; // 听众不需要麦克风
  } else {
    document.getElementById("lang-selector-box").style.display = "none";
    document.getElementById("translations-box").style.display = "block";
    document.getElementById("subtitles-label").textContent = "活跃翻译";
  }

  document.getElementById("meeting").style.display = "flex";
}

// ── 语言切换（来自官方 LanguageSelector handleChange）──
async function handleLanguageChange(langCode) {
  const previousLanguage = currentLanguage;
  const select = document.getElementById("lang-select");
  const statusEl = document.getElementById("lang-status");

  select.disabled = true;
  statusEl.textContent = "启动翻译中...";
  statusEl.style.color = "#ffd600";

  // 取消上一个语言订阅
  if (previousLanguage && previousLanguage !== "original" && previousLanguage !== langCode) {
    fetch("/api/gemini/translate/unsubscribe", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ sessionId, targetLanguage: previousLanguage }),
    }).catch(() => {});
  }

  if (langCode === "original") {
    currentLanguage = "original";
    translatorIdentity = null;
    transcripts = [];
    renderSubtitles();
    updateSubscriptions();
    select.disabled = false;
    statusEl.textContent = "";
    return;
  }

  try {
    // 请求 Gemini Bot 启动（来自官方 POST /api/translate）
    const res = await fetch("/api/gemini/translate", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ sessionId, targetLanguage: langCode, previousLanguage }),
    });

    if (!res.ok) throw new Error(await res.text());
    const data = await res.json();

    currentLanguage = langCode;
    translatorIdentity = data.translatorIdentity;
    transcripts = [];
    renderSubtitles();
    updateSubscriptions();

    statusEl.textContent = `✓ 翻译到 ${langCode.toUpperCase()} 已启动`;
    statusEl.style.color = "#00e676";
  } catch (err) {
    showError("翻译启动失败: " + err.message);
    statusEl.textContent = "启动失败";
    statusEl.style.color = "#ef4444";
  } finally {
    select.disabled = false;
  }
}

// ── 订阅控制（来自官方 updateSubscriptions）──
function updateSubscriptions() {
  if (!room || role !== "attendee") return;

  for (const [, participant] of room.remoteParticipants) {
    const isOrganizer = participant.identity.startsWith("organizer-");
    const isSelectedTranslator = translatorIdentity && participant.identity === translatorIdentity;

    for (const [, pub] of participant.trackPublications) {
      if (pub.kind === LivekitClient.Track.Kind.Audio) {
        if (currentLanguage === "original") {
          pub.setSubscribed(isOrganizer);
        } else {
          pub.setSubscribed(!!isSelectedTranslator);
        }
      }
    }
  }
}

// ── Track 订阅事件 ──
function onTrackSubscribed(track, publication, participant) {
  if (track.kind === "audio") {
    track.attach(); // LiveKit 自动播放
  }
}

function onTrackUnsubscribed(track) {
  track.detach();
}

// ── 接收字幕数据（来自官方 RoomEvent.DataReceived 处理）──
function onDataReceived(payload, participant, kind, topic) {
  if (topic !== "transcription") return;
  try {
    const data = JSON.parse(new TextDecoder().decode(payload));
    if (data.type !== "transcription") return;
    if (role === "attendee" && data.language !== currentLanguage) return;

    const existing = transcripts.findIndex(t => t.id === data.segmentId);
    if (existing >= 0) {
      transcripts[existing].text += data.text;
      transcripts[existing].final = data.final;
    } else {
      transcripts.push({ id: data.segmentId, text: data.text, final: data.final });
    }

    // 最多保留50条
    if (transcripts.length > 50) transcripts = transcripts.slice(-50);
    renderSubtitles();
  } catch {}
}

// ── 渲染字幕 ──
function renderSubtitles() {
  const box = document.getElementById("subtitles-box");
  const empty = document.getElementById("subtitles-empty");

  if (transcripts.length === 0) {
    if (empty) empty.style.display = "block";
    // 清除旧字幕
    Array.from(box.querySelectorAll(".subtitle-line")).forEach(el => el.remove());
    return;
  }

  if (empty) empty.style.display = "none";
  box.innerHTML = "";

  transcripts.forEach(t => {
    const p = document.createElement("p");
    p.className = `subtitle-line${t.final ? "" : " interim"}`;
    p.textContent = t.text;
    box.appendChild(p);
  });

  box.scrollTop = box.scrollHeight;
}

// ── 主讲人：轮询翻译状态（来自官方 fetchTranslations）──
async function fetchTranslations() {
  if (!sessionId || role !== "organizer") return;
  try {
    const res = await fetch(`/api/gemini/translate/status?sessionId=${sessionId}`);
    const data = await res.json();
    renderTranslations(data.translations || []);
  } catch {}
}

function renderTranslations(translations) {
  const list = document.getElementById("translations-list");
  if (translations.length === 0) {
    list.innerHTML = '<div class="subtitle-empty">暂无听众请求翻译</div>';
    return;
  }
  list.innerHTML = translations.map(t => `
    <div class="translation-item">
      <span class="translation-lang">${t.language.toUpperCase()}</span>
      <span class="translation-meta">${t.subscriberCount} 人 · ${t.status}</span>
    </div>
  `).join("");
}

// ── 麦克风切换 ──
async function toggleMic() {
  if (!room) return;
  micEnabled = !micEnabled;
  await room.localParticipant.setMicrophoneEnabled(micEnabled);
  const btn = document.getElementById("mic-btn");
  btn.className = `mic-btn ${micEnabled ? "on" : "off"}`;
  btn.textContent = micEnabled ? "🎤" : "🔇";
}

// ── 离开房间 ──
async function leaveRoom() {
  if (translationsPollingTimer) { clearInterval(translationsPollingTimer); translationsPollingTimer = null; }

  // 取消字幕订阅（来自官方 beforeunload + sendBeacon 逻辑）
  if (role === "attendee" && currentLanguage && currentLanguage !== "original") {
    try {
      await fetch("/api/gemini/translate/unsubscribe", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ sessionId, targetLanguage: currentLanguage }),
      });
    } catch {}
  }

  // 主讲人结束时清理所有 Bridge（来自官方 DELETE /api/sessions/:id）
  if (role === "organizer" && sessionId) {
    try {
      await fetch(`/api/gemini/sessions/${sessionId}`, { method: "DELETE" });
    } catch {}
  }

  if (room) { room.disconnect(); room = null; }

  // 重置状态
  sessionId = null; role = null; currentLanguage = "original";
  translatorIdentity = null; transcripts = [];

  document.getElementById("meeting").style.display = "none";
  showHome();
}

// ── 断线处理 ──
function onDisconnected() {
  document.getElementById("meeting-status").textContent = "已断线";
  if (translationsPollingTimer) { clearInterval(translationsPollingTimer); translationsPollingTimer = null; }
}

// ── 页面关闭时清理（来自官方 beforeunload + sendBeacon）──
window.addEventListener("beforeunload", () => {
  if (role === "attendee" && currentLanguage && currentLanguage !== "original" && sessionId) {
    const payload = JSON.stringify({ sessionId, targetLanguage: currentLanguage });
    navigator.sendBeacon?.("/api/gemini/translate/unsubscribe",
      new Blob([payload], { type: "application/json" }));
  }
});
</script>
</body>
