<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <title>GloTalk</title>
  <!-- LiveKit JS SDK -->
  <script src="https://cdn.jsdelivr.net/npm/livekit-client@2/dist/livekit-client.umd.min.js"></script>
  <style>
    *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
    body{min-height:100dvh;background:#0a0a0a;color:#f0f0f0;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",sans-serif;display:flex;align-items:center;justify-content:center;padding:max(20px,env(safe-area-inset-top)) 20px max(20px,env(safe-area-inset-bottom))}
    .app{width:min(100%,420px);display:flex;flex-direction:column;gap:12px}
    .logo{font-size:30px;font-weight:800;letter-spacing:-1px;color:#fff}
    .logo span{color:#22c55e}
    .tagline{font-size:12px;color:#333;margin-top:2px}
    .status-bar{display:flex;align-items:center;gap:8px;background:#111;border:1px solid #222;border-radius:12px;padding:10px 14px}
    .dot{width:8px;height:8px;border-radius:50%;background:#333;flex-shrink:0;transition:all .3s}
    .dot.green{background:#22c55e;box-shadow:0 0 6px #22c55e88}
    .dot.yellow{background:#f59e0b;box-shadow:0 0 6px #f59e0b88}
    .dot.red{background:#ef4444}
    .dot.pulse{animation:pulse 1.5s infinite}
    @keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
    .status-text{font-size:13px;color:#888;flex:1}
    .card{background:#111;border:1px solid #222;border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
    .row{display:flex;align-items:center;gap:8px}
    .label{font-size:11px;color:#555;font-weight:600;text-transform:uppercase;width:56px;flex-shrink:0}
    input,select{flex:1;background:#1a1a1a;border:1px solid #2a2a2a;border-radius:8px;color:#f0f0f0;font:inherit;font-size:14px;padding:8px 10px;outline:none;-webkit-user-select:text;user-select:text}
    input:focus,select:focus{border-color:#22c55e44}
    input::placeholder{color:#333;font-weight:400}
    select option{background:#1a1a1a}
    select:disabled{opacity:.4}
    .room-id{flex:1;background:#1a1a1a;border:1px solid #2a2a2a;border-radius:8px;color:#22c55e;font:inherit;font-size:15px;font-weight:700;padding:8px 10px;letter-spacing:2px}
    .copy-btn{height:36px;padding:0 12px;border:1px solid #2a2a2a;border-radius:8px;background:#1a1a1a;color:#888;font:inherit;font-size:12px;cursor:pointer;white-space:nowrap;flex-shrink:0}
    .copy-btn:active{background:#222}
    .share-link{font-size:11px;color:#444;word-break:break-all;background:#0f0f0f;border-radius:6px;padding:6px 8px;-webkit-user-select:text;user-select:text}
    .btn{width:100%;padding:14px;border:none;border-radius:12px;font:inherit;font-size:16px;font-weight:700;cursor:pointer;transition:all .2s;letter-spacing:.5px}
    .btn-primary{background:#22c55e;color:#000}
    .btn-primary:active{background:#16a34a}
    .btn-primary:disabled{background:#1a3320;color:#2a5a3a;cursor:not-allowed}
    .btn-danger{background:#1a0a0a;color:#ef4444;border:1px solid #2a1010}
    .btn-danger:active{background:#2a1010}
    .btn-secondary{background:#1a1a1a;color:#888;border:1px solid #222}
    /* 字幕区 */
    .subtitle-section{display:none;flex-direction:column;gap:8px}
    .subtitle-section.visible{display:flex}
    .box-wrap{display:flex;flex-direction:column;gap:4px}
    .box-label{font-size:11px;color:#555;font-weight:600;text-transform:uppercase;padding-left:2px}
    .tbox{min-height:72px;max-height:120px;overflow-y:auto;border-radius:12px;padding:12px;font-size:16px;font-weight:600;line-height:1.5;word-break:break-word;white-space:pre-wrap;-webkit-user-select:text;user-select:text}
    .tbox-them{background:#0d1a0f;border:1px solid #1a3320;color:#22c55e}
    .tbox-them:empty::before{content:attr(data-ph);color:#1a3320;font-size:13px;font-weight:400}
    .tbox-me{background:#0f0f1a;border:1px solid #1a1a3a;color:#60a5fa}
    .tbox-me:empty::before{content:attr(data-ph);color:#1a1a3a;font-size:13px;font-weight:400}
    /* 通话中指示器 */
    .call-indicator{display:none;align-items:center;justify-content:center;gap:10px;background:#0d1a0f;border:1px solid #1a3320;border-radius:12px;padding:12px}
    .call-indicator.visible{display:flex}
    .call-timer{font-size:22px;font-weight:700;color:#22c55e;font-variant-numeric:tabular-nums;letter-spacing:1px}
    .call-label{font-size:12px;color:#2a5a3a}
    /* 邀请码输入 */
    .invite-section{display:flex;flex-direction:column;gap:12px}
    .invite-input{width:100%;background:#1a1a1a;border:1px solid #2a2a2a;border-radius:10px;color:#f0f0f0;font:inherit;font-size:18px;font-weight:700;padding:12px 14px;outline:none;text-align:center;letter-spacing:3px;text-transform:uppercase;-webkit-user-select:text;user-select:text}
    .invite-input:focus{border-color:#22c55e44}
    .invite-input::placeholder{color:#333;font-weight:400;letter-spacing:0;text-transform:none;font-size:14px}
    .error-msg{font-size:12px;color:#ef4444;text-align:center;display:none}
    .error-msg.visible{display:block}
    /* 隐藏/显示 */
    .hidden{display:none!important}
  </style>
</head>
<body>
<div class="app">
  <div>
    <div class="logo">Glo<span>Talk</span></div>
    <div class="tagline">实时语音翻译 · Real-time Voice Translation</div>
  </div>

  <!-- 状态栏 -->
  <div class="status-bar">
    <div class="dot" id="dot"></div>
    <div class="status-text" id="statusText">请输入邀请码加入通话</div>
  </div>

  <!-- 邀请码验证区（初始显示） -->
  <div class="invite-section" id="inviteSection">
    <div class="card">
      <div class="row">
        <div class="label">邀请码</div>
        <input class="invite-input" id="inviteInput" type="text" placeholder="输入邀请码 GT-XXXXXX" maxlength="10" autocomplete="off" autocapitalize="characters" spellcheck="false"/>
      </div>
      <div class="row">
        <div class="label">姓名</div>
        <input id="nameInput" type="text" placeholder="你的名字" maxlength="20" autocomplete="off"/>
      </div>
    </div>
    <div class="error-msg" id="errorMsg"></div>
    <button class="btn btn-primary" id="verifyBtn" onclick="verifyInvite()">验证邀请码</button>
  </div>

  <!-- 通话前设置区（验证后显示） -->
  <div class="hidden" id="setupSection">
    <!-- 房间信息 -->
    <div class="card" style="margin-bottom:12px">
      <div class="row">
        <div class="label">房间</div>
        <div class="room-id" id="roomDisplay">--</div>
        <button class="copy-btn" onclick="copyRoom()">复制</button>
      </div>
      <div class="share-link" id="shareLink"></div>
    </div>

    <!-- 语言设置 -->
    <div class="card" style="margin-bottom:12px">
      <div class="row">
        <div class="label">我说</div>
        <select id="myLang">
          <option value="zh">🇨🇳 中文</option>
          <option value="en">🇺🇸 English</option>
          <option value="ja">🇯🇵 日本語</option>
          <option value="ko">🇰🇷 한국어</option>
          <option value="es">🇪🇸 Español</option>
          <option value="fr">🇫🇷 Français</option>
          <option value="de">🇩🇪 Deutsch</option>
          <option value="pt">🇧🇷 Português</option>
          <option value="ar">🇸🇦 العربية</option>
          <option value="hi">🇮🇳 हिन्दी</option>
          <option value="th">🇹🇭 ภาษาไทย</option>
          <option value="vi">🇻🇳 Tiếng Việt</option>
          <option value="id">🇮🇩 Bahasa Indonesia</option>
          <option value="ru">🇷🇺 Русский</option>
          <option value="it">🇮🇹 Italiano</option>
        </select>
      </div>
    </div>

    <button class="btn btn-primary" id="joinBtn" onclick="joinRoom()">😙️ 开始通话&lt;/button>
  </div>

  <!-- 通话中区域 -->
  <div class="hidden" id="callSection">
    <!-- 通话计时器 -->
    <div class="call-indicator visible" style="margin-bottom:12px">
      <div>
        <div class="call-timer" id="callTimer">00:00</div>
        <div class="call-label">通话中</div>
      </div>
    </div>

    <!-- 字幕区 -->
    <div class="subtitle-section visible">
      <div class="box-wrap">
        <div class="box-label">🌐 翻译（对方→你）</div>
        <div class="tbox tbox-them" id="themBox" data-ph="等待对方说话..."></div>
      </div>
      <div class="box-wrap">
        <div class="box-label">🎙️ 你说的</div>
        <div class="tbox tbox-me" id="meBox" data-ph="开始说话..."></div>
      </div>
    </div>

    <!-- 挂断 -->
    <button class="btn btn-danger" style="margin-top:12px" onclick="leaveRoom()">📵 结束通话</button>
  </div>

</div>

<script>
// ─── 配置 ────────────────────────────────────────────────────────────────────
const SERVER = '';  // 同域，留空
const ACCESS_TOKEN = 'glotalk2026';

// ─── 状态 ────────────────────────────────────────────────────────────────────
let room = null;
let callStartTime = null;
let timerInterval = null;
let myIdentity = '';
let myRoom = '';
let myLang = 'zh';
let inviteData = null;

// ─── UI 工具 ─────────────────────────────────────────────────────────────────
const $ = id => document.getElementById(id);

function setStatus(text, color) {
  $('statusText').textContent = text;
  const dot = $('dot');
  dot.className = 'dot ' + (color || '');
}

function showError(msg) {
  const el = $('errorMsg');
  el.textContent = msg;
  el.classList.add('visible');
  setTimeout(() => el.classList.remove('visible'), 4000);
}

function showSection(name) {
  ['inviteSection','setupSection','callSection'].forEach(id => {
    $(id).classList.add('hidden');
  });
  $(name).classList.remove('hidden');
}

// ─── 邀请码验证 ───────────────────────────────────────────────────────────────
async function verifyInvite() {
  const code = $('inviteInput').value.trim().toUpperCase();
  const name = $('nameInput').value.trim();
  if (!code) { showError('请输入邀请码'); return; }
  // 姓名可选

  $('verifyBtn').disabled = true;
  $('verifyBtn').textContent = '验证中...';
  setStatus('验证邀请码...', 'yellow pulse');

  try {
    const res = await fetch('/invite/verify', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'x-glotalk-token': ACCESS_TOKEN },
      body: JSON.stringify({ code, name })
    });
    const data = await res.json();
    if (!data.ok) throw new Error(data.error || '邀请码无效');

    inviteData = data;
    myRoom = data.roomId || code;
    myIdentity = (name || '用户') + '-' + Date.now().toString(36);

    $('roomDisplay').textContent = myRoom;
    $('shareLink').textContent = location.origin + '?room=' + myRoom;
    setStatus('邀请码验证成功，请选择语言', 'green');
    showSection('setupSection');

  } catch(e) {
    showError(e.message);
    setStatus('验证失败', 'red');
    $('verifyBtn').disabled = false;
    $('verifyBtn').textContent = '验证邀请码';
  }
}

// ─── 使用邀请码 ───────────────────────────────────────────────────────────────
async function useInvite() {
  const code = $('inviteInput').value.trim().toUpperCase();
  const name = $('nameInput').value.trim();
  try {
    await fetch('/invite/use', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'x-glotalk-token': ACCESS_TOKEN },
      body: JSON.stringify({ code, name })
    });
  } catch(e) { /* 非关键 */ }
}

// ─── 加入房间 ─────────────────────────────────────────────────────────────────
async function joinRoom() {
  myLang = $('myLang').value;
  $('joinBtn').disabled = true;
  $('joinBtn').textContent = '连接中...';
  setStatus('获取通话凭证...', 'yellow pulse');

  try {
    // 1. 获取 LiveKit Token
    const tokenRes = await fetch(
      `/livekit-token?room=${encodeURIComponent(myRoom)}&identity=${encodeURIComponent(myIdentity)}&lang=${myLang}`,
      { headers: { 'x-glotalk-token': ACCESS_TOKEN } }
    );
    const tokenData = await tokenRes.json();
    if (!tokenData.token) throw new Error('获取 Token 失败');

    // 2. 标记邀请码已使用
    await useInvite();

    // 3. 连接 LiveKit 房间
    setStatus('连接房间...', 'yellow pulse');
    room = new LivekitClient.Room({
      adaptiveStream: true,
      dynacast: true,
      audioCaptureDefaults: {
        echoCancellation: true,
        noiseSuppression: true,
        autoGainControl: true,
      },
    });
    // 只订阅翻译轨道，不订阅原声
    room.on(LivekitClient.RoomEvent.TrackPublished, (publication, participant) => {
      const trackName = publication.trackName || '';
      if (trackName.startsWith('tx:') && trackName.endsWith(':' + myLang)) {
        publication.setSubscribed(true);
      } else {
        publication.setSubscribed(false);
      }
    });

    // 监听事件
    room.on(LivekitClient.RoomEvent.ParticipantConnected, onParticipantConnected);
    room.on(LivekitClient.RoomEvent.ParticipantDisconnected, onParticipantDisconnected);
    room.on(LivekitClient.RoomEvent.TrackSubscribed, onTrackSubscribed);
    room.on(LivekitClient.RoomEvent.TrackUnsubscribed, onTrackUnsubscribed);
    room.on(LivekitClient.RoomEvent.Disconnected, onDisconnected);
    room.on(LivekitClient.RoomEvent.DataReceived, onDataReceived);

    await room.connect(tokenData.url, tokenData.token);

    // 4. 发布麦克风
    await room.localParticipant.setMicrophoneEnabled(true);

    // 5. 更新属性（语言）
    await room.localParticipant.setAttributes({ lang: myLang });

    // 6. 切换 UI
    showSection('callSection');
    startTimer();
    setStatus(`通话中 · ${room.remoteParticipants.size} 人在线`, 'green');

  } catch(e) {
    showError('连接失败: ' + e.message);
    setStatus('连接失败', 'red');
    $('joinBtn').disabled = false;
    $('joinBtn').textContent = '🎙️ 开始通话';
  }
}

// ─── LiveKit 事件 ─────────────────────────────────────────────────────────────
function onParticipantConnected(participant) {
  setStatus(`通话中 · ${room.remoteParticipants.size} 人在线`, 'green');
}

function onParticipantDisconnected(participant) {
  setStatus(`通话中 · ${room.remoteParticipants.size} 人在线`, 'green');
  appendText('themBox', `[${participant.identity} 已离开]`);
}

function onTrackSubscribed(track, publication, participant) {
  const trackName = publication.trackName || '';
  if (track.kind === 'audio') {
    if (trackName.startsWith('tx:') && trackName.endsWith(':' + myLang)) {
      // 播放翻译轨道
      console.log('播放翻译轨道:', trackName);
      const audioEl = track.attach();
      audioEl.autoplay = true;
      document.body.appendChild(audioEl);
      audioEl.play().catch(e => console.log('失败:', e));
    } else if (!trackName.startsWith('tx:')) {
      // 原声轨道：完全不播放，只记录日志
      console.log('忽略原声轨道:', trackName || participant.identity);
    }
  }
}

function onTrackUnsubscribed(track) {
  track.detach();
}

function onDisconnected() {
  setStatus('通话已断开', 'red');
  stopTimer();
  setTimeout(() => {
    showSection('inviteSection');
    $('verifyBtn').disabled = false;
    $('verifyBtn').textContent = '验证邀请码';
    setStatus('请输入邀请码加入通话', '');
  }, 2000);
}

function onDataReceived(data, participant) {
  try {
    const msg = JSON.parse(new TextDecoder().decode(data));
    if (msg.type === 'transcript') {
      if (participant) {
        appendText('themBox', msg.text);
      } else {
        appendText('meBox', msg.text);
      }
    }
  } catch(e) {}
}

// ─── 离开房间 ─────────────────────────────────────────────────────────────────
async function leaveRoom() {
  if (room) {
    await room.disconnect();
    room = null;
  }
  stopTimer();
  $('themBox').textContent = '';
  $('meBox').textContent = '';
  showSection('inviteSection');
  $('verifyBtn').disabled = false;
  $('verifyBtn').textContent = '验证邀请码';
  setStatus('请输入邀请码加入通话', '');
}

// ─── 计时器 ───────────────────────────────────────────────────────────────────
function startTimer() {
  callStartTime = Date.now();
  timerInterval = setInterval(() => {
    const s = Math.floor((Date.now() - callStartTime) / 1000);
    const m = Math.floor(s / 60);
    $('callTimer').textContent = String(m).padStart(2,'0') + ':' + String(s%60).padStart(2,'0');
  }, 1000);
}

function stopTimer() {
  if (timerInterval) { clearInterval(timerInterval); timerInterval = null; }
  $('callTimer').textContent = '00:00';
}

// ─── 工具 ────────────────────────────────────────────────────────────────────
function appendText(boxId, text) {
  const box = $(boxId);
  box.textContent = text;
  box.scrollTop = box.scrollHeight;
}

function copyRoom() {
  navigator.clipboard.writeText(myRoom).catch(() => {});
}

// ─── URL 参数预填 ─────────────────────────────────────────────────────────────
(function() {
  const params = new URLSearchParams(location.search);
  const room = params.get('room');
  if (room) $('inviteInput').value = room;
})();
</script>
</body>
</html>
