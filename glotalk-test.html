<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>GloTalk 信令测试</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <style>
    body { background:#111; color:#f0f0f0; font-family:sans-serif; padding:30px; max-width:400px; margin:0 auto; }
    h2 { color:#22c55e; }
    #log { background:#000; border-radius:10px; padding:16px; min-height:200px; font-size:14px; line-height:1.8; }
    .ok  { color:#22c55e; }
    .err { color:#ef4444; }
    .info{ color:#60a5fa; }
    button { margin-top:16px; width:100%; height:50px; border:none; border-radius:10px; background:#22c55e; color:#000; font-size:16px; font-weight:800; cursor:pointer; }
  </style>
</head>
<body>
  <h2>GloTalk 信令测试</h2>
  <p style="color:#666;font-size:13px;">房间号固定：<strong style="color:#fff">888888</strong><br>两台设备同时打开这个页面，看能不能互相收到消息。</p>
  <div id="log"></div>
  <button onclick="sendTest()">发送测试消息给对方</button>

<script>
const SUPABASE_URL  = "https://ryqxhagdbycccosuavtp.supabase.co";
const SUPABASE_ANON = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJ5cXhoYWdkYnljY2Nvc3VhdnRwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk3MDM5MTgsImV4cCI6MjA5NTI3OTkxOH0.lj3PdKLsTU_cNEHjLNqyHSszJtGSU6gPORE5Y_9WNjQ";
const ROOM = "888888";
const myId = "设备-" + Math.floor(Math.random() * 9000 + 1000);

const logEl = document.getElementById("log");

function log(msg, type = "info") {
  const line = document.createElement("div");
  line.className = type;
  line.textContent = new Date().toLocaleTimeString() + " " + msg;
  logEl.appendChild(line);
  logEl.scrollTop = logEl.scrollHeight;
}

log("我的ID: " + myId, "ok");
log("正在连接房间 " + ROOM + "...");

const client  = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON);
const channel = client.channel(`test-${ROOM}`, {
  config: { broadcast: { self: false } }
});

channel
  .on("broadcast", { event: "test" }, ({ payload }) => {
    log("✅ 收到来自 " + payload.from + " 的消息: " + payload.msg, "ok");
  })
  .subscribe((status) => {
    log("频道状态: " + status, status === "SUBSCRIBED" ? "ok" : "info");
    if (status === "SUBSCRIBED") {
      log("✅ 连接成功！等待对方消息，或点下面按钮发消息", "ok");
    }
  });

async function sendTest() {
  log("发送消息...", "info");
  const result = await channel.send({
    type: "broadcast",
    event: "test",
    payload: { from: myId, msg: "你好！" + new Date().toLocaleTimeString() }
  });
  log("发送结果: " + JSON.stringify(result), result === "ok" ? "ok" : "err");
}
</script>
</body>
</html>
