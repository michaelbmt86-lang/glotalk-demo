
<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>GloTalk P2PV测试（含视频）</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; margin: 0; padding: 0; }
    body { min-height: 100vh; background: #0a0a0a; color: #f0f0f0; font-family: -apple-system, sans-serif; display: flex; align-items: center; justify-content: center; padding: 20px; }
    .app { width: min(100%, 420px); display: flex; flex-direction: column; gap: 12px; }
    h2 { color: #22c55e; font-size: 24px; }
    h2 span { color: #fff; }
    .log { background: #111; border: 1px solid #222; border-radius: 12px; padding: 14px; min-height: 240px; max-height: 320px; overflow-y: auto; font-size: 13px; line-height: 1.8; }
    .ok   { color: #22c55e; }
    .err  { color: #ef4444; }
    .info { color: #60a5fa; }
    .msg  { color: #f0f0f0; }
    .them { color: #f59e0b; }
    #statusBar { font-size: 13px; text-align: center; padding: 6px; border-radius: 8px; background: #111; border: 1px solid #222; }
    #statusBar.ok  { color: #22c55e; border-color: #22c55e44; }
    #statusBar.err { color: #ef4444; border-color: #ef444444; }
    #pingBar { font-size: 12px; color: #22c55e; text-align: center; min-height: 16px; }
    #msgInput {
      width: 100%; padding: 14px;
      background: #1a1a1a; border: 2px solid #333;
      border-radius: 10px; color: #f0f0f0;
      font-size: 16px; font-family: inherit;
      outline: none;
      /* iOS Safari必须用这两个才能输入 */
      -webkit-user-select: auto !important;
      user-select: auto !important;
    }
    #msgInput::placeholder { color: #444; }
    #msgInput:focus { border-color: #22c55e; }
    #msgInput:disabled { opacity: 0.4; }
    .btn { width: 100%; height: 52px; border: none; border-radius: 12px; font-size: 16px; font-weight: 800; cursor: pointer; }
    #sendBtn { background: #22c55e; color: #000; }
    #sendBtn:disabled { background: #1a1a1a; color: #444; cursor: not-allowed; }
    #resetBtn { background: #ef4444; color: #fff; height: 44px; font-size: 14px; }
    .audio-row { display: flex; align-items: center; gap: 8px; background: #111; border: 1px solid #222; border-radius: 10px; padding: 10px 14px; }
    .audio-label { font-size: 12px; color: #555; white-space: nowrap; }
    audio { flex: 1; height: 32px; }
  </style>
</head>
<body>
<div class="app">
  <h2>Glo<span>Talk</span> P2P测试</h2>
  <p style="color:#555;font-size:12px;">房间固定888888 · 文字+音频+视频 · 不调用OpenAI · 完全免费</p>
  <div class="log" id="log"></div>
  <div id="statusBar">正在初始化...</div>
  <div id="pingBar"></div>
  <input type="text" id="msgInput" placeholder="输入消息（P2P连接后可用）" disabled />
  <button class="btn" id="sendBtn" onclick="sendMsg()" disabled>发送消息</button>
  <!-- 视频区域 -->
  <div style="display:flex;gap:8px;">
    <div style="flex:1;display:flex;flex-direction:column;gap:4px;align-items:center;">
      <span style="font-size:11px;color:#555;">我的画面</span>
      <video id="localVideo" autoplay playsinline muted style="width:100%;border-radius:10px;background:#111;aspect-ratio:4/3;object-fit:cover;"></video>
    </div>
    <div style="flex:1;display:flex;flex-direction:column;gap:4px;align-items:center;">
      <span style="font-size:11px;color:#555;">对方画面</span>
      <video id="remoteVideo" autoplay playsinline style="width:100%;border-radius:10px;background:#111;aspect-ratio:4/3;object-fit:cover;"></video>
    </div>
  </div>
  <div class="audio-row">
    <span class="audio-label">对方声音：</span>
    <audio id="remoteAudio" autoplay playsinline controls></audio>
  </div>
  <button class="btn" id="resetBtn" onclick="location.reload()">重新连接</button>
</div>
<script>
const SUPABASE_URL      = "https://ryqxhagdbycccosuavtp.supabase.co";
const SUPABASE_ANON     = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJ5cXhoYWdkYnljY2Nvc3VhdnRwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk3MDM5MTgsImV4cCI6MjA5NTI3OTkxOH0.lj3PdKLsTU_cNEHjLNqyHSszJtGSU6gPORE5Y_9WNjQ";
const SUPABASE_TURN_URL = "https://ryqxhagdbycccosuavtp.supabase.co/functions/v1/create-turn-credentials";
const ROOM   = "glt-888888";
const myId   = "dev" + Math.floor(Math.random() * 9000 + 1000);
const myTs   = Date.now();

let rtcConfig = { iceServers: [{ urls: "stun:stun.l.google.com:19302" }], iceTransportPolicy: "all" };
let pc = null, dc = null, sb = null, ch = null;
let localStream = null, pendingIce = [];
let usedRelay = false, relayTimer = null;
let pingStart = 0;

const logEl    = document.getElementById("log");
const statusEl = document.getElementById("statusBar");
const pingEl   = document.getElementById("pingBar");
const msgInput = document.getElementById("msgInput");
const sendBtn  = document.getElementById("sendBtn");
const audio    = document.getElementById("remoteAudio");

function log(msg, t="info") {
  const d = document.createElement("div");
  d.className = t;
  d.textContent = new Date().toLocaleTimeString() + " " + msg;
  logEl.appendChild(d);
  logEl.scrollTop = logEl.scrollHeight;
}
function status(msg, t="") {
  statusEl.textContent = msg;
  statusEl.className = t;
}

// ===== TURN =====
async function initTurn() {
  try {
    const r = await fetch(SUPABASE_TURN_URL, {
      method:"POST",
      headers:{"Authorization":`Bearer ${SUPABASE_ANON}`,"apikey":SUPABASE_ANON,"Content-Type":"application/json"}
    });
    const d = await r.json();
    let servers = d.iceServers;
    if (servers && !Array.isArray(servers)) servers = [servers];
    if (servers?.length) {
      const u = servers[0].username   || d.username;
      const c = servers[0].credential || d.credential;
      const extra = (u && c) ? [
        { urls:"turns:turn.cloudflare.com:5349?transport=tcp", username:u, credential:c },
        { urls:"turn:turn.cloudflare.com:3478?transport=tcp",  username:u, credential:c },
        { urls:"turn:turn.cloudflare.com:3478?transport=udp",  username:u, credential:c },
      ] : [];
      rtcConfig = {
        iceServers: [{ urls:"stun:stun.l.google.com:19302" }, ...extra, ...servers],
        iceTransportPolicy: "all"
      };
      log("✅ TURN获取成功！" + rtcConfig.iceServers.length + "个服务器", "ok");
    }
  } catch(e) { log("⚠️ TURN失败: "+e.message, "err"); }
}

// ===== ICE =====
async function addIce(c) {
  if (!pc) return;
  if (!pc.remoteDescription) { pendingIce.push(c); return; }
  try { await pc.addIceCandidate(new RTCIceCandidate(c)); } catch {}
}
async function flushIce() {
  while(pendingIce.length) {
    try { await pc.addIceCandidate(new RTCIceCandidate(pendingIce.shift())); } catch {}
  }
}

// ===== P2P =====
async function createPC() {
  // 麦克风
  try {
    localStream = await navigator.mediaDevices.getUserMedia({ 
      audio: true, 
      video: { facingMode: "user", width: { ideal: 640 }, height: { ideal: 480 } }
    });
    log("✅ 麦克风+摄像头已获取", "ok");
    // 显示本地视频
    const localVideo = document.getElementById("localVideo");
    if (localVideo) localVideo.srcObject = localStream;
  } catch(e) { log("⚠️ 麦克风: "+e.message, "err"); }

  pc = new RTCPeerConnection(rtcConfig);
  log("PeerConnection已创建，服务器: "+rtcConfig.iceServers.length+"个", "info");

  if (localStream) localStream.getTracks().forEach(t => pc.addTrack(t, localStream));

  // 用同一个stream处理音视频（Safari iOS要求）
  pc.ontrack = e => {
    log("✅ 收到对方轨道: " + e.track.kind, "ok");
    const stream = e.streams[0];
    if (!stream) return;

    // 音频元素
    if (!audio.srcObject) {
      audio.srcObject = stream;
      audio.play().catch(()=>{});
    }

    // 视频元素（同一个stream包含音视频）
    const remoteVideo = document.getElementById("remoteVideo");
    if (remoteVideo && !remoteVideo.srcObject) {
      remoteVideo.srcObject = stream;
      remoteVideo.play().catch(()=>{});
    }
  };

  pc.onicecandidate = async e => {
    if (e.candidate) {
      log("ICE候选: "+e.candidate.type+" "+e.candidate.protocol, "info");
      await bcast({ type:"ice", candidate:e.candidate.toJSON() });
    } else {
      log("ICE收集完成", "ok");
    }
  };

  pc.oniceconnectionstatechange = () => {
    const s = pc.iceConnectionState;
    log("ICE: "+s, s==="connected"||s==="completed"?"ok":s==="failed"?"err":"info");
    if (s==="connected"||s==="completed") {
      clearTimeout(relayTimer);
    }
    if (s==="failed" && !usedRelay) {
      usedRelay = true;
      log("⚡ 切换relay模式重试...", "info");
      try { pc.setConfiguration({...rtcConfig, iceTransportPolicy:"relay"}); } catch {}
      pc.restartIce();
    }
    if (s==="disconnected") {
      setTimeout(() => { if(pc?.iceConnectionState==="disconnected") pc.restartIce(); }, 2000);
    }
  };

  pc.onconnectionstatechange = () => {
    log("连接: "+pc.connectionState, "info");
  };

  // 15秒自动切relay
  relayTimer = setTimeout(() => {
    if (!usedRelay && pc?.iceConnectionState !== "connected" && pc?.iceConnectionState !== "completed") {
      usedRelay = true;
      log("⏱️ 15秒超时，切换relay模式...", "info");
      try { pc.setConfiguration({...rtcConfig, iceTransportPolicy:"relay"}); } catch {}
      pc.restartIce();
    }
  }, 15000);
}

// ===== DataChannel =====
function setupDC(d) {
  dc = d;
  dc.onopen = () => {
    log("✅ DataChannel开启！P2P完全成功！", "ok");
    status("🟢 P2P连接成功！可以发消息和通话了", "ok");
    msgInput.disabled = false;
    sendBtn.disabled  = false;
    // 延迟focus，iOS Safari需要
    setTimeout(() => { try { msgInput.focus(); } catch {} }, 300);
    setInterval(() => {
      if (dc?.readyState==="open") { pingStart=Date.now(); dc.send(JSON.stringify({type:"ping",t:pingStart})); }
    }, 3000);
  };
  dc.onclose  = () => { status("连接断开","err"); msgInput.disabled=true; sendBtn.disabled=true; };
  dc.onerror  = e => log("DC错误: "+(e.error?.message||""), "err");
  dc.onmessage = e => {
    try {
      const d = JSON.parse(e.data);
      if (d.type==="ping") { dc.send(JSON.stringify({type:"pong",t:d.t})); return; }
      if (d.type==="pong") { pingEl.textContent="P2P延迟: "+(Date.now()-d.t)+"ms"; return; }
      if (d.type==="msg")  { log("对方说: "+d.text, "them"); }
    } catch { log("对方说: "+e.data, "them"); }
  };
}

// ===== 信令 =====
async function bcast(payload) {
  if (ch) await ch.send({ type:"broadcast", event:"signal", payload });
}

async function onSignal(payload) {
  if (payload.type==="offer") {
    log("收到offer，发answer...", "ok");
    if (!pc) await createPC();
    pc.ondatachannel = e => setupDC(e.channel);
    await pc.setRemoteDescription({ type:"offer", sdp:payload.sdp });
    await flushIce();
    const ans = await pc.createAnswer();
    await pc.setLocalDescription(ans);
    await bcast({ type:"answer", sdp:pc.localDescription.sdp });
  }
  if (payload.type==="answer") {
    log("收到answer！", "ok");
    await pc.setRemoteDescription({ type:"answer", sdp:payload.sdp });
    await flushIce();
  }
  if (payload.type==="ice") await addIce(payload.candidate);
}

// ===== 主逻辑：用Presence感知对方 =====
async function start() {
  log("我的ID: "+myId, "ok");
  await initTurn();
  log("连接信令...", "info");

  sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON);
  ch = sb.channel(ROOM, {
    config: {
      broadcast: { self:false },
      presence:  { key: myId }
    }
  });

  ch.on("presence", { event:"sync" }, async () => {
    const state   = ch.presenceState();
    const members = Object.keys(state).sort(); // 字母序排序
    log("房间人数: "+members.length+" 成员:"+members.join(","), "info");

    if (members.length >= 2 && !pc) {
      // 用ID字母序决定角色：排序后第一个发offer，第二个等待
      // 这个方法100%可靠，不依赖时间戳
      const isCaller = members[0] === myId;
      log((isCaller ? "✅ 我发offer" : "我等待offer") + " (ID排序: "+members[0]+"<"+members[1]+")", "info");

      if (isCaller) {
        await createPC();
        const d = pc.createDataChannel("chat");
        setupDC(d);
        const offer = await pc.createOffer();
        await pc.setLocalDescription(offer);
        await bcast({ type:"offer", sdp:pc.localDescription.sdp });
        log("offer已发送！", "ok");
      } else {
        await createPC();
        pc.ondatachannel = e => setupDC(e.channel);
        log("等待对方offer...", "info");
      }
    }
  })
  .on("presence", { event:"join" }, ({ key, newPresences }) => {
    log("加入: "+key, "ok");
  })
  .on("presence", { event:"leave" }, ({ key }) => {
    log("离开: "+key, "err");
    status("对方已离开", "err");
  })
  .on("broadcast", { event:"signal" }, async ({ payload }) => {
    await onSignal(payload);
  })
  .subscribe(async (s) => {
    log("信令: "+s, s==="SUBSCRIBED"?"ok":"info");
    if (s==="SUBSCRIBED") {
      status("已进入房间，等待对方...");
      await ch.track({ id:myId, ts:myTs });
    }
  });
}

function sendMsg() {
  const t = msgInput.value.trim();
  if (!t || !dc || dc.readyState!=="open") return;
  dc.send(JSON.stringify({ type:"msg", text:t }));
  log("我说: "+t, "msg");
  msgInput.value = "";
}

document.getElementById("msgInput").addEventListener("keydown", e => {
  if (e.key==="Enter") sendMsg();
});

start();
</script>
</body>
</html>
