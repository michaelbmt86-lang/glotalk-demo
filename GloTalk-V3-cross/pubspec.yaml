# 参考来源：
#   pub.dev/packages/sherpa_onnx          v1.13.2 (2026-05-14)
#   pub.dev/packages/flutter_onnxruntime   最新版 ^1.8.0
#   pub.dev/packages/dart_sentencepiece_tokenizer v1.3.2 ✅ 包名正确，pub.dev 已确认存在
#   pub.dev/packages/record                v6.2.0 (最新，^6.0.0 约束兼容)
#   pub.dev/packages/path_provider         ^2.1.5
#   pub.dev/packages/permission_handler    ^12.0.1
#   工作手册 V16 第二节「Flutter 包依赖」

name: glotalk_v3_cross
description: "GloTalk V3 — 设备端离线 STT + 翻译 + TTS 跨语言实时通话"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # STT + TTS + VAD 统一引擎（Apache 2.0）
  # 来源：https://pub.dev/packages/sherpa_onnx (v1.13.2)
  sherpa_onnx: ^1.13.1

  # ONNX 推理引擎 — Opus-MT 翻译（MIT）
  # 来源：https://pub.dev/packages/flutter_onnxruntime
  # 注意：>=1.5.1 满足 Android 16 KB Google Play 兼容要求
  flutter_onnxruntime: ^1.8.0

  # SentencePiece 分词器 — 纯 Dart，零依赖（MIT）
  # 来源：https://pub.dev/packages/dart_sentencepiece_tokenizer (v1.3.2, 已验证包名正确)
  # API：SentencePieceTokenizer.fromModelFile(path) → encode(text).ids / decode(ids)
  dart_sentencepiece_tokenizer: ^1.3.1

  # 麦克风 PCM 流采集（BSD-3-Clause）
  # 来源：https://pub.dev/packages/record (v6.2.0, latest)
  # API：AudioRecorder().startStream(RecordConfig(encoder: AudioEncoder.pcm16bits))
  #      → Stream<Uint8List>（signed 16-bit PCM Little-Endian）
  record: ^6.0.0

  # 本地文件路径（BSD）
  path_provider: ^2.1.5

  # 权限管理（MIT）
  permission_handler: ^12.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  # 模型资源 asset 声明
  # STT:  sherpa-onnx-sense-voice-zh-en-ja-ko-yue-2024-07-17-int8/
  # 翻译:  opus-mt-zh-en/ (encoder_model_int8.onnx + decoder_model_int8.onnx + *.spm)
  # TTS:  vits-piper-en_US-libritts_r-medium/ (含 espeak-ng-data/)
  # VAD:  silero_vad.onnx
  assets:
    - assets/models/stt/
    - assets/models/translate/
    - assets/models/tts/
    - assets/models/vad/
